name: Agent AI Energy Reservation Runner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-ai-energy-reservation-runner.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-energy-reservation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate continuation model
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent-ai-energy-reservation.py')
          text = path.read_text()
          text = text.replace('          5.5\n', '          7.5\n', 1)
          text = text.replace(
              '  const likelihood = futurePlayLikelihood(match, playerId, card, choices, "hand");\n',
              '''  const likelihood = /\\b(?:Flow|Fury|Turbo|Domination|Victor)\\b|\\bif\\b/i.test(card.effect)\n    ? 0.65\n    : 1;\n''',
              1,
          )
          path.write_text(text)
          PY
          python scripts/agent-ai-energy-reservation.py
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/opponentAiBase.ts')
          text = path.read_text()
          text = text.replace(
              '  if (budget <= 0 || !forecast.own || !forecast.opponent) return 0;\n',
              '''  console.log("AI_CONT_START", { budget, own: Boolean(forecast.own), opponent: Boolean(forecast.opponent), selected: match.selected });
  if (budget <= 0 || !forecast.own || !forecast.opponent) return 0;
''',
              1,
          )
          text = text.replace(
              '  if (!options.length) return 0;\n',
              '''  console.log("AI_CONT_OPTIONS", options);
  if (!options.length) return 0;
''',
              1,
          )
          path.write_text(text)
          PY
      - name: Run focused tests
        id: focused
        continue-on-error: true
        run: |
          node --import tsx --test tests/opponent-ai-tactics.test.ts tests/ai-energize-planner.test.ts tests/ai-roll-forecast.test.ts > /tmp/ai-reservation-output.txt 2>&1
      - name: Persist failure diagnostics
        if: steps.focused.outcome == 'failure'
        run: |
          cp /tmp/ai-reservation-output.txt .github/ai-reservation-debug-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ai-reservation-debug-output.txt
          git commit -m "Record AI reservation diagnostics" || true
          git push origin HEAD:agent/ai-energy-reservation
          exit 1
      - name: Remove diagnostic logging
        if: steps.focused.outcome == 'success'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/opponentAiBase.ts')
          text = path.read_text()
          text = text.replace('''  console.log("AI_CONT_START", { budget, own: Boolean(forecast.own), opponent: Boolean(forecast.opponent), selected: match.selected });
''', '')
          text = text.replace('''  console.log("AI_CONT_OPTIONS", options);
''', '')
          path.write_text(text)
          PY
      - name: Build production application
        if: steps.focused.outcome == 'success'
        run: npm run build
      - name: Commit implementation
        if: steps.focused.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/ai-reservation-debug-output.txt
          git rm -f scripts/agent-ai-energy-reservation.py .github/workflows/agent-ai-energy-reservation.yml .github/workflows/agent-ai-energy-reservation-debug.yml .github/ai-reservation-debug-trigger.txt
          git add lib/opponentAiBase.ts tests/opponent-ai-tactics.test.ts
          git commit -m "Teach AI to reserve tactical Energy"
          git push origin HEAD:agent/ai-energy-reservation
