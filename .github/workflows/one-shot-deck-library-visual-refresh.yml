name: One-shot Deck Library Visual Refresh

on:
  push:
    branches:
      - implement/deck-library-visual-refresh
    paths:
      - ".github/workflows/one-shot-deck-library-visual-refresh.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implement/deck-library-visual-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply Deck Library visual refresh
        run: python scripts/apply-deck-library-visual-refresh.py
      - name: Build
        run: npm run build
      - name: Deck Library regression tests
        run: node --import tsx --test tests/deck-library-visuals.test.ts tests/public-deck-favorites.test.ts tests/deck-experience.test.ts tests/administration.test.ts
      - name: Lint
        run: npm run lint
      - name: Bundle budget diagnostic
        continue-on-error: true
        run: npm run bundle:budget
      - name: Commit implementation
        run: |
          rm scripts/apply-deck-library-visual-refresh.py
          rm .github/workflows/one-shot-deck-library-visual-refresh.yml
          git config user.name "UnCoverOne"
          git config user.email "uncover250@gmail.com"
          git add -A
          git commit -m "Refresh Deck Library cards" -m "Tighten Deck Library card proportions, show 3 Characters plus the Featured card in a four-card fan, replace faction names with accessible faction symbols, and compact Public Deck actions including the Favorite count."
          git push origin HEAD:implement/deck-library-visual-refresh
