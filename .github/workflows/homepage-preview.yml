name: Homepage Rebuild Preview

on:
  push:
    branches:
      - homepage-rebuild
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-rebuild-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy isolated Cloudflare Worker Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout homepage-rebuild
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build Worker and assets
        run: npm run build

      - name: Install Preview-capable Wrangler 4.135.0
        run: npm install --no-save --legacy-peer-deps wrangler@4.135.0

      - name: Deploy isolated branch Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets to enable preview deployment."
            exit 1
          fi
          npx wrangler preview --name homepage-rebuild
