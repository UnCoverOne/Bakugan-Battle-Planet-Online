name: Run Administrator AI card visibility implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Administrator AI visibility feature
        run: python3 .github/implement-admin-ai-card-visibility.py
      - name: Install dependencies
        run: npm run install:ci
      - name: Run focused regressions
        run: node --import tsx --test tests/admin-ai-visibility.test.ts tests/administration.test.ts tests/card-preview-state.test.ts tests/card-preview-interactions.test.ts tests/roll-phase-presentation.test.ts
      - name: Build application
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "UnCoverOne"
          git config user.email "291861529+UnCoverOne@users.noreply.github.com"
          git rm .github/implement-admin-ai-card-visibility.py
          git rm .github/workflows/implement-admin-ai-card-visibility.yml
          git rm .github/workflows/run-admin-ai-card-visibility.yml
          git add lib app components tests package.json
          git commit -m "Add Administrator Training AI card visibility"
          git push origin HEAD:${{ github.head_ref }}
