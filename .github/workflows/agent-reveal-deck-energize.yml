name: Agent Deck Energize Reveal

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reveal-deck-energize
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply deck Energize reveal implementation
        run: python scripts/agent-reveal-deck-energize-patch.py
      - name: Run focused deck Energize reveal regressions
        run: node --import tsx --test --test-name-pattern="Energize transitions report|deck-to-Energy|top-deck Energize" tests/game-screen-state.test.ts tests/presentation-stability.test.ts
      - name: Build production application
        run: npm run build
      - name: Commit implementation
        run: |
          rm scripts/agent-reveal-deck-energize-patch.py .github/workflows/agent-reveal-deck-energize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reveal deck-Energized cards to their owner"
          git push origin HEAD:agent/reveal-deck-energize
