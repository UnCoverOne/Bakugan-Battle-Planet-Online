name: Apply gameplay mechanics repair

on:
  push:
    branches:
      - fix/gameplay-mechanics-2026-08-14

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gameplay-mechanics-2026-08-14
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply rules-engine repairs
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\n--- wanted ---\n{old[:600]}")
              p.write_text(text.replace(old, new, 1))

          # --- Typed rules model -------------------------------------------------
          replace_once(
              "lib/rules/model.ts",
              '  | { kind: "selection-made"; choiceId: keyof CardChoices }\n  | { kind: "reroll-opened" }',
              '  | { kind: "selection-made"; choiceId: keyof CardChoices }\n  | { kind: "mode-selected"; mode: string }\n  | { kind: "reroll-opened" }',
          )
          replace_once(
              "lib/rules/model.ts",
              '  label: string;\n  minimum?: number;',
              '  label: string;\n  /** Explicit printed options for semantic mode choices such as Battle Mastery. */\n  options?: Array<{ id: string; label: string; description?: string }>;\n  minimum?: number;',
          )
          replace_once(
              "lib/rules/model.ts",
              '  | "ATTACK_CREATED"\n  | "DAMAGE_TAKEN"',
              '  | "ATTACK_CREATED"\n  | "ATTACK_DAMAGE_DEALT"\n  | "DAMAGE_TAKEN"',
          )
          replace_once(
              "lib/rules/model.ts",
              '  optional?: boolean;\n  interveningCondition?: RuleCondition;',
              '  optional?: boolean;\n  /** Minimum amount carried by the triggering event. */\n  minimumEventAmount?: number;\n  interveningCondition?: RuleCondition;',
          )

          # --- Data-driven mode choices + Magnus static permission --------------
          replace_once(
              "lib/rules/choices.ts",
              '''    case "mode":\n      return spec.id === "confirmed"\n        ? [option("yes", "Yes"), option("no", "No")]\n        : [option("power", "B-Power"), option("damage", "Damage")];''',
              '''    case "mode": {\n      if (spec.id === "confirmed") return [option("yes", "Yes"), option("no", "No")];\n      const printed = spec.options?.map((candidate) => option(candidate.id, candidate.label, controller.id, candidate.description))\n        ?? [option("power", "B-Power"), option("damage", "Damage")];\n      const magnusAllowsBoth = /\\bBattle Mastery\\b/i.test(card.effect)\n        && controller.heroes.some((hero) => hero.catalogId === "aa-68");\n      if (magnusAllowsBoth && !printed.some((candidate) => candidate.id === "both")) {\n        printed.push(option("both", "Both effects", controller.id, "Magnus, Living Arm of Tiko"));\n      }\n      return printed;\n    }''',
          )

          # --- Battle Mastery is a semantic branch, not a generic stat mode -----
          replace_once(
              "lib/rules/catalogue-structure.ts",
              'function splitInstructions(card: GameCard, source: string): RuleInstruction[] {',
              '''type BattleMasteryBranch = { id: string; label: string; text: string };\n\nfunction battleMasteryBranches(text: string): BattleMasteryBranch[] | null {\n  const normalized = text.replace(/\\s+/g, " ").trim();\n  const match = normalized.match(\n    /\\bBattle Mastery:\\s*(?:When you play this,\\s*)?Choose one(?: of the following)?\\s*[:,]?\\s*(.+?)\\s+or\\s+(.+?)\\.?$/i,\n  );\n  if (!match) return null;\n  const clean = (value: string) => {\n    const trimmed = value.trim().replace(/\\.$/, "");\n    return /^[a-z]/.test(trimmed) ? trimmed[0].toUpperCase() + trimmed.slice(1) : trimmed;\n  };\n  return [match[1], match[2]].map((value, index) => ({\n    id: `battle-mastery-${index + 1}`,\n    label: clean(value),\n    text: clean(value),\n  }));\n}\n\nfunction splitInstructions(card: GameCard, source: string): RuleInstruction[] {''',
          )
          replace_once(
              "lib/rules/catalogue-structure.ts",
              '  // A sentence-ending "instead" clause replaces the immediately preceding\n',
              '''  // Battle Mastery presents one printed choice before either branch resolves.\n  // Compile the choice as an always-on no-op instruction, then gate each\n  // branch on the selected mode. Earlier instruction choices are deliberately\n  // merged forward by the resolver, so Magnus can make both branch conditions true.\n  for (let index = 0; index < instructions.length; index += 1) {\n    const current = instructions[index];\n    const branches = battleMasteryBranches(current.sourceText);\n    if (!branches) continue;\n    const modeChoice = current.choices.find((candidate) => candidate.id === "mode");\n    if (!modeChoice) continue;\n    const noOp: RuleAction = { kind: "sequence", effects: [] };\n    const chooser: RuleInstruction = {\n      ...current,\n      id: `${ruleCardId(card)}:battle-mastery-choice`,\n      condition: { kind: "always" },\n      effects: [noOp],\n      actions: [noOp],\n      choices: [{\n        ...modeChoice,\n        options: branches.map((branch) => ({ id: branch.id, label: branch.label })),\n      }],\n    };\n    const branchInstructions: RuleInstruction[] = branches.map((branch) => {\n      const effects = parseAtomicEffects(card, branch.text);\n      const actions: RuleAction[] = effects.length ? effects : [{ kind: "sequence", effects: [] }];\n      return {\n        id: `${ruleCardId(card)}:${branch.id}`,\n        condition: { kind: "mode-selected", mode: branch.id },\n        effects: actions,\n        actions,\n        choices: choicesForText(card, branch.text, "resolve").filter((candidate) => candidate.id !== "mode"),\n        sourceText: branch.text,\n      };\n    });\n    instructions.splice(index, 1, chooser, ...branchInstructions);\n    index += branchInstructions.length;\n  }\n\n  // A sentence-ending "instead" clause replaces the immediately preceding\n''',
          )
          replace_once(
              "lib/rules/catalogue-structure.ts",
              '} else if (explicitBakuganTarget && cardId !== "aa-99") {',
              '} else if (explicitBakuganTarget && (cardId !== "aa-99" || defaultTiming === "resolve")) {',
          )

          # --- Runtime condition evaluation for semantic modes ------------------
          replace_once(
              "lib/game.ts",
              '''  if (instruction.condition.kind === "selection-made") {\n    const selected = choices[instruction.condition.choiceId];\n    return Array.isArray(selected) ? selected.length > 0 : Boolean(selected);\n  }\n  if (instruction.condition.kind === "reroll-opened")''',
              '''  if (instruction.condition.kind === "selection-made") {\n    const selected = choices[instruction.condition.choiceId];\n    return Array.isArray(selected) ? selected.length > 0 : Boolean(selected);\n  }\n  if (instruction.condition.kind === "mode-selected") {\n    return choices.mode === instruction.condition.mode || choices.mode === "both";\n  }\n  if (instruction.condition.kind === "reroll-opened")''',
          )
          replace_once(
              "lib/rules/modifiers.ts",
              '    case "selection-made": return true;\n    case "reroll-opened": return false;',
              '    case "selection-made": return true;\n    case "mode-selected": return false;\n    case "reroll-opened": return false;',
          )

          # --- Cee: trigger after actual attack damage, with a threshold --------
          replace_once(
              "lib/rules/catalogue-primitives.ts",
              '''function triggerFor(text: string): TriggerDefinition | undefined {\n  const table:''',
              '''function triggerFor(text: string): TriggerDefinition | undefined {\n  const damageThreshold = text.match(/if you deal (\\d+) or more damage in an attack/i);\n  if (damageThreshold) {\n    return {\n      event: "ATTACK_DAMAGE_DEALT",\n      relationship: "controller",\n      optional: /\\bmay\\b/i.test(text),\n      minimumEventAmount: Number(damageThreshold[1]),\n    };\n  }\n  const table:''',
          )
          replace_once(
              "lib/rules/catalogue-primitives.ts",
              '    [/when one of your Bakugan attacks|if you deal \\d+ or more damage/i, "ATTACK_CREATED", "controller"],',
              '    [/when one of your Bakugan attacks/i, "ATTACK_CREATED", "controller"],',
          )
          replace_once(
              "lib/rules/triggers.ts",
              '  if (trigger.event !== event.name) return false;\n  if (!relationshipMatches(trigger, owner.id, event)) return false;',
              '  if (trigger.event !== event.name) return false;\n  if (trigger.minimumEventAmount != null && (event.amount ?? 0) < trigger.minimumEventAmount) return false;\n  if (!relationshipMatches(trigger, owner.id, event)) return false;',
          )

          # --- Cost helpers used by Pact of Darkness -----------------------------
          replace_once(
              "lib/rules/costs.ts",
              '''export function availableEnergy(player: EnergyTrackedPlayer, turn: number) {\n  return player.energyTapTurn === turn ? Math.max(0, Math.floor(player.energy)) : 0;\n}\n''',
              '''export function availableEnergy(player: EnergyTrackedPlayer, turn: number) {\n  return player.energyTapTurn === turn ? Math.max(0, Math.floor(player.energy)) : 0;\n}\n\n/** Maximum Energy that can be paid now, including currently untapped Energy cards. */\nexport function maximumPayableEnergy(state: MatchState, playerId: string) {\n  const player = playerById(state, playerId) as EnergyTrackedPlayer;\n  const tapped = new Set(activeTappedEnergyIds(player, state.turn));\n  const untapped = player.energyZone.filter((card) => !tapped.has(card.id)).length;\n  return availableEnergy(player, state.turn) + untapped;\n}\n\n/**\n * Recalculate the payable Energy after an effect sets a card's Energy cost to\n * free. Rule 1.15.2 starts free at 0, then normal reductions/increases (including\n * FrostStrike for a Flip) still apply.\n */\nexport function cardCostAfterFreeBase(\n  state: MatchState,\n  playerId: string,\n  card: GameCard,\n  choices: CardChoices = {},\n) {\n  const breakdown = cardCostBreakdown(state, playerId, card, choices);\n  return Math.max(0, 0 - breakdown.reductions + breakdown.increases + breakdown.frostStrike);\n}\n''',
          )

          # --- Damage completion event + Pact eligibility -----------------------
          replace_once(
              "lib/manualDamage.ts",
              'import { beginCardPayment, commitCardPayment, prepareDeclaredEnergyPayment } from "./rules/costs";',
              'import { beginCardPayment, cardCostAfterFreeBase, commitCardPayment, maximumPayableEnergy, prepareDeclaredEnergyPayment } from "./rules/costs";',
          )
          replace_once(
              "lib/manualDamage.ts",
              '''type DamageResumeRules = ReturnType<typeof ensureRulesState> & {\n  damageResume?: { playerId: string; previousPhase: "damage"; revealedFlipId: string };\n  pactOfDarknessPayment?: PactOfDarknessPayment;\n};''',
              '''type DamageResumeRules = ReturnType<typeof ensureRulesState> & {\n  damageResume?: { playerId: string; previousPhase: "damage"; revealedFlipId: string };\n  pactOfDarknessPayment?: PactOfDarknessPayment;\n  attackDamageSequence?: number;\n  attackDamageTracker?: { sequence: number; actorId: string; originId: string; count: number };\n};''',
          )
          replace_once(
              "lib/manualDamage.ts",
              '''function enterPostDamage(state: MatchState) {\n  if (resumePendingEffectAfterDamage(state)) return;''',
              '''function damageDealerId(state: MatchState) {\n  const suspended = state.pendingEffectDamageResume?.sourceEffectId;\n  const sourceObject = suspended ? state.batch.find((object) => object.id === suspended) : undefined;\n  if (sourceObject) return sourceObject.controllerId;\n  return state.players.find((player) => player.bakugan.some((bakugan) => bakugan.id === state.damageOrigin))?.id;\n}\n\nfunction recordDamageCardTaken(state: MatchState) {\n  const rules = ensureRulesState(state) as DamageResumeRules;\n  if (!rules.attackDamageTracker) {\n    const actorId = damageDealerId(state);\n    if (!actorId) return;\n    const sequence = (rules.attackDamageSequence ?? 0) + 1;\n    rules.attackDamageSequence = sequence;\n    rules.attackDamageTracker = { sequence, actorId, originId: state.damageOrigin, count: 0 };\n  }\n  rules.attackDamageTracker.count += 1;\n}\n\nfunction emitCompletedAttackDamage(state: MatchState) {\n  const rules = ensureRulesState(state) as DamageResumeRules;\n  const tracker = rules.attackDamageTracker;\n  if (!tracker) return;\n  delete rules.attackDamageTracker;\n  emitRuleEvent(state, {\n    id: `${state.turn}:attack-damage:${tracker.sequence}:${tracker.actorId}`,\n    name: "ATTACK_DAMAGE_DEALT",\n    actorId: tracker.actorId,\n    controllerId: tracker.actorId,\n    targetBakuganId: state.players.flatMap((player) => player.bakugan).some((bakugan) => bakugan.id === tracker.originId)\n      ? tracker.originId\n      : undefined,\n    amount: tracker.count,\n    createdAt: Date.now(),\n  });\n}\n\nfunction enterPostDamage(state: MatchState) {\n  emitCompletedAttackDamage(state);\n  if (resumePendingEffectAfterDamage(state)) return;''',
          )
          replace_once(
              "lib/manualDamage.ts",
              '''  state.pendingDamage = Math.max(0, state.pendingDamage - 1);\n  player.discard.push(card);''',
              '''  state.pendingDamage = Math.max(0, state.pendingDamage - 1);\n  recordDamageCardTaken(state);\n  player.discard.push(card);''',
          )
          replace_once(
              "lib/manualDamage.ts",
              '''  if (!flipCardId) {\n    const state = cloneMatch(input);''',
              '''  if (!flipCardId) {\n    const existingRules = ensureRulesState(input) as DamageResumeRules;\n    if (flip.catalogId === PACT_OF_DARKNESS_ID\n      && existingRules.pactOfDarknessPayment?.cardId === flip.id\n      && existingRules.pactOfDarknessPayment.stage === "paid") {\n      throw new Error("Pact of Darkness must be played after its Sacrifice cost is paid.");\n    }\n    const state = cloneMatch(input);''',
          )
          replace_once(
              "lib/manualDamage.ts",
              '''    if (!pact || pact.cardId !== stateFlip.id || pact.playerId !== playerId) {\n      if (!statePlayer.hand.length) {\n        damageRules.pactOfDarknessPayment = {\nplayerId,\ncardId: stateFlip.id,\nstage: "declined",\n        };\n      } else {\n        damageRules.pactOfDarknessPayment = {''',
              '''    if (!pact || pact.cardId !== stateFlip.id || pact.playerId !== playerId) {\n      const sacrificeEnergyCost = cardCostAfterFreeBase(state, playerId, stateFlip, choices);\n      const payableEnergy = maximumPayableEnergy(state, playerId);\n      if (!statePlayer.hand.length) {\n        damageRules.pactOfDarknessPayment = {\nplayerId,\ncardId: stateFlip.id,\nstage: "declined",\n        };\n      } else if (payableEnergy < sacrificeEnergyCost) {\n        throw new Error(`Pact of Darkness cannot be played by Sacrifice: its free base still costs ${sacrificeEnergyCost} Energy after cost increases, but only ${payableEnergy} is available.`);\n      } else {\n        damageRules.pactOfDarknessPayment = {''',
          )
          replace_once(
              "lib/manualDamage.ts",
              '''    options: [\n      { id: "yes", label: "Pay Sacrifice" },\n      { id: "no", label: "Keep the 4 Energy cost" },\n    ],''',
              '''    options: [\n      {\n        id: "yes",\n        label: "Pay Sacrifice",\n        description: sacrificeEnergyCost > 0\n          ? `${sacrificeEnergyCost} Energy is still required after cost increases.`\n          : "The Energy cost is 0 after modifiers.",\n      },\n      { id: "no", label: "Keep the 4 Energy cost" },\n    ],''',
          )

          # --- Pact payment immediately commits the required play ---------------
          replace_once(
              "lib/game.ts",
              '''const payEnergy = (state: MatchState, player: PlayerState, amount: number) => {''',
              '''const playPaidPactOfDarkness = (state: MatchState, playerId: string) => {\n  const flip = state.revealedFlip;\n  if (!flip || flip.catalogId !== "bb-152") throw new Error("Pact of Darkness is no longer the revealed Flip.");\n  const player = playerById(state, playerId);\n  const choices: CardChoices = {};\n  const cost = effectiveCost(state, player, flip, choices);\n  payEnergy(state, player, cost);\n  state.nextCardCostReduction[playerId] = 0;\n  player.discard = player.discard.filter((card) => card.id !== flip.id);\n  state.revealedFlip = undefined;\n  recordCardPlayedForTurn(player, flip, state.turn);\n\n  const definition = ruleDefinitionForCard(flip);\n  const ability = definition.abilities.find((candidate) => candidate.kind === "spell") ?? definition.abilities[0];\n  const object = createRuleObject({ controllerId: playerId, card: flip, ability, choices, kind: "card" });\n  state.batch.push(object);\n  const rules = ensureRulesState(state) as ReturnType<typeof ensureRulesState> & {\n    pactOfDarknessPayment?: unknown;\n    damageResume?: { playerId: string; previousPhase: "damage"; revealedFlipId: string };\n  };\n  delete rules.pactOfDarknessPayment;\n  rules.damageResume = { playerId, previousPhase: "damage", revealedFlipId: flip.id };\n\n  state.phase = "postDamage";\n  state.stepLabel = `Damage Step • Respond to ${flip.displayName || flip.name}`;\n  state.priority = playerId;\n  state.passes = [];\n  state.deadline = Date.now() + 25_000;\n  emitGameEvent(state, {\n    id: `${state.turn}:card-play:${flip.id}`,\n    type: "card-play",\n    playerId,\n    cardType: "Flip",\n    sourceCards: [flip],\n    choices,\n  });\n  entry(state, "game", `${player.name} paid Pact of Darkness's Sacrifice cost and added it to the batch for ${cost} Energy.`);\n};\n\nconst payEnergy = (state: MatchState, player: PlayerState, amount: number) => {''',
          )
          # Function declarations are hoisted, but const initializers are not. Move
          # the helper after payEnergy so the closure cannot run before initialization.
          p = Path("lib/game.ts")
          text = p.read_text()
          helper_start = text.index('const playPaidPactOfDarkness = (state: MatchState, playerId: string) => {')
          pay_start = text.index('const payEnergy = (state: MatchState, player: PlayerState, amount: number) => {', helper_start)
          helper = text[helper_start:pay_start]
          text = text[:helper_start] + text[pay_start:]
          marker = '\nexport const prepareCardPlay = (input: MatchState, playerId: string, cardId: string) => {'
          insert_at = text.index(marker)
          text = text[:insert_at] + '\n' + helper + text[insert_at:]
          p.write_text(text)

          replace_once(
              "lib/game.ts",
              '''      pact.stage = "paid";\n      pact.discardedCardId = selected[0];\n      state.pendingChoice = undefined;\n      state.priority = pact.playerId;\n      state.stepLabel = `Damage Step • Flip decision • ${state.pendingDamage} remaining`;\n      state.deadline = Date.now() + 35_000;\n      entry(state, "game", `${playerById(state, pact.playerId).name} paid Pact of Darkness's Sacrifice cost. Its Energy cost is now 0.`);\n      return withVersion(state);''',
              '''      pact.stage = "paid";\n      pact.discardedCardId = selected[0];\n      state.pendingChoice = undefined;\n      entry(state, "game", `${playerById(state, pact.playerId).name} paid Pact of Darkness's Sacrifice cost. Its base Energy cost is now 0 before cost increases.`);\n      playPaidPactOfDarkness(state, pact.playerId);\n      return withVersion(state);''',
          )

          # --- Cross-owner human discard choice must be visibly prompted --------
          replace_once(
              "components/game-screen-v2/ChoiceQueueLayer.tsx",
              '''    field.chooserId === playerId\n    && field.id !== "discardCardIds"\n    && !isTopDeckField(field)''',
              '''    field.chooserId === playerId\n    // Controller-owned discards retain the in-hand interaction. A discard\n    // delegated to the other player needs a modal fallback on that player's\n    // client; otherwise the private chooser transition can be visually silent.\n    && (field.id !== "discardCardIds" || pending?.controllerId !== playerId)\n    && !isTopDeckField(field)''',
          )

          # --- Focused regressions ------------------------------------------------
          Path("tests/gameplay-mechanics-2026-08-14.test.ts").write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import { CARDS, STARTER_DECKS, makePlayer } from "../lib/data";
          import {
            CENTER_CELL,
            createMatch,
            submitCardChoice,
            type GameCard,
            type MatchState,
          } from "../lib/game";
          import { activeTappedEnergyIds } from "../lib/rules/costs";
          import { ruleDefinitionForCard } from "../lib/rules/catalogue";
          import { createRuleObject } from "../lib/rules/objects";
          import { ensureRulesState } from "../lib/rules/state";
          import { resolveStructuredEffect } from "../lib/game";
          import { flipDamageCard, resolveManualDamage } from "../lib/manualDamage";

          function card(catalogId: string, id: string): GameCard {
            const source = CARDS.find((candidate) => candidate.catalogId === catalogId);
            assert.ok(source, `Missing catalogue card ${catalogId}`);
            return { ...source, id };
          }

          function addUntappedEnergy(player: ReturnType<typeof makePlayer>, amount: number) {
            player.energyZone = Array.from({ length: amount }, (_, index) => card("bb-10", `${player.id}-energy-${index}`));
            player.energy = 0;
            player.maxEnergy = amount;
          }

          function effectState(catalogId: string, withMagnus = false) {
            const player = makePlayer("a", "Alpha", STARTER_DECKS[0]);
            const opponent = makePlayer("b", "Beta", STARTER_DECKS[1]);
            if (withMagnus) player.heroes = [card("aa-68", "magnus-live")];
            const source = card(catalogId, `${catalogId}-source`);
            const state = createMatch(`MODE-${catalogId}-${withMagnus}`, "bo1", [player, opponent]);
            state.turn = 2;
            state.phase = "power";
            state.startingPlayer = player.id;
            state.priority = player.id;
            state.selected[player.id] = player.bakugan[0].id;
            state.selected[opponent.id] = opponent.bakugan[0].id;
            player.bakugan[0].open = true;
            opponent.bakugan[0].open = true;
            const definition = ruleDefinitionForCard(source);
            const ability = definition.abilities.find((candidate) => candidate.kind === "spell") ?? definition.abilities[0];
            assert.ok(ability);
            const object = createRuleObject({ controllerId: player.id, card: source, ability, choices: {}, kind: "card" });
            return { state, player, opponent, source, object, definition };
          }

          test("Battle Mastery uses each card's printed choices instead of the generic B-Power/Damage pair", () => {
            const parasitic = effectState("aa-12");
            let state = resolveStructuredEffect(parasitic.state, parasitic.object);
            const field = state.pendingChoice?.schema.fields.find((candidate) => candidate.id === "mode");
            assert.ok(field);
            assert.deepEqual(field.options.map((option) => option.label), [
              "Your opponent discards three cards",
              "You draw three cards",
            ]);

            const phoenix = ruleDefinitionForCard(card("aa-13", "phoenix"));
            const phoenixMode = phoenix.abilities.flatMap((ability) => ability.instructions)
              .flatMap((instruction) => instruction.choices)
              .find((choice) => choice.id === "mode");
            assert.deepEqual(phoenixMode?.options?.map((option) => option.label), ["+3 [FrostStrike]", "+[DoubleStrike]"]);

            const gorthion = ruleDefinitionForCard(card("aa-99", "gorthion"));
            const gorthionInstructions = gorthion.abilities.flatMap((ability) => ability.instructions);
            const gorthionMode = gorthionInstructions.flatMap((instruction) => instruction.choices).find((choice) => choice.id === "mode");
            assert.deepEqual(gorthionMode?.options?.map((option) => option.label), ["A Bakugan gets +600 [B]", "Recharge 6 Energy cards"]);
            assert.ok(gorthionInstructions.some((instruction) => (
              instruction.condition.kind === "mode-selected"
              && instruction.choices.some((choice) => choice.id === "targetBakuganId")
            )));
          });

          test("Magnus, Living Arm of Tiko adds Both and both Battle Mastery branches resolve", () => {
            const bodybreaker = effectState("aa-11", true);
            let state = resolveStructuredEffect(bodybreaker.state, bodybreaker.object);
            const field = state.pendingChoice?.schema.fields.find((candidate) => candidate.id === "mode");
            assert.ok(field);
            assert.deepEqual(field.options.map((option) => option.id), ["battle-mastery-1", "battle-mastery-2", "both"]);
            state = submitCardChoice(state, bodybreaker.player.id, { mode: "both" });
            const activeId = bodybreaker.player.bakugan[0].id;
            assert.equal(state.powerBoost[activeId], 300);
            assert.equal(state.damageBoost[activeId], 4);
          });

          function pactState(frostStrike: number, energy: number) {
            const payer = makePlayer("payer", "Payer", STARTER_DECKS[0]);
            const attacker = makePlayer("attacker", "Attacker", STARTER_DECKS[1]);
            addUntappedEnergy(payer, energy);
            payer.hand = [card("bb-10", "sacrifice-card")];
            const pact = card("bb-152", "pact-reveal");
            payer.discard = [pact];
            const state = createMatch(`PACT-${frostStrike}-${energy}`, "bo1", [payer, attacker]);
            state.turn = 2;
            state.phase = "damage";
            state.pendingLoser = payer.id;
            state.pendingDamage = 3;
            state.revealedFlip = pact;
            state.damageOrigin = attacker.bakugan[0].id;
            state.damageFaction = "Pyrus";
            state.frostStrike[attacker.bakugan[0].id] = frostStrike;
            state.priority = payer.id;
            return { state, payer, attacker, pact };
          }

          test("Pact of Darkness does not offer Sacrifice when the post-free FrostStrike cost is unaffordable", () => {
            const setup = pactState(2, 1);
            assert.throws(
              () => resolveManualDamage(setup.state, setup.payer.id, setup.pact.id),
              /cannot be played by Sacrifice.*2 Energy.*1 is available/i,
            );
            assert.equal(setup.state.pendingChoice, undefined);
          });

          test("paying Pact of Darkness Sacrifice immediately plays it and still pays FrostStrike", () => {
            const setup = pactState(1, 1);
            let state = resolveManualDamage(setup.state, setup.payer.id, setup.pact.id);
            assert.equal(state.pendingChoice?.kind, "payment");
            state = submitCardChoice(state, setup.payer.id, { confirmed: true });
            assert.equal(state.pendingChoice?.schema.fields[0]?.id, "discardCardIds");
            state = submitCardChoice(state, setup.payer.id, { discardCardIds: ["sacrifice-card"] });

            const payer = state.players.find((candidate) => candidate.id === setup.payer.id)!;
            assert.equal(state.pendingChoice, undefined);
            assert.equal(state.revealedFlip, undefined);
            assert.equal(state.phase, "postDamage");
            assert.ok(state.batch.some((object) => object.card.id === setup.pact.id));
            assert.ok(payer.discard.some((candidate) => candidate.id === "sacrifice-card"));
            assert.equal(payer.discard.some((candidate) => candidate.id === setup.pact.id), false);
            assert.equal(activeTappedEnergyIds(payer, state.turn).length, 1);
            assert.equal((ensureRulesState(state) as ReturnType<typeof ensureRulesState> & { pactOfDarknessPayment?: unknown }).pactOfDarknessPayment, undefined);
          });

          function ceeDamageState(amount: number) {
            const dealer = makePlayer("dealer", "Dealer", STARTER_DECKS[0]);
            const damaged = makePlayer("damaged", "Damaged", STARTER_DECKS[1]);
            const cee = card("bb-195", "cee-live");
            dealer.heroes = [cee];
            damaged.deckCards = Array.from({ length: amount + 2 }, (_, index) => card("bb-10", `damage-${amount}-${index}`));
            damaged.deck = damaged.deckCards.length;
            const state = createMatch(`CEE-${amount}`, "bo1", [dealer, damaged]);
            state.turn = 2;
            state.phase = "damage";
            state.pendingLoser = damaged.id;
            state.pendingDamage = amount;
            state.damageOrigin = dealer.bakugan[0].id;
            state.damageFaction = dealer.bakugan[0].faction;
            state.priority = damaged.id;
            state.selected[dealer.id] = dealer.bakugan[0].id;
            return { state, dealer, damaged, cee };
          }

          function takeAllDamage(setup: ReturnType<typeof ceeDamageState>) {
            let state: MatchState = setup.state;
            while (state.phase === "damage" && state.pendingDamage > 0) {
              state = flipDamageCard(state, setup.damaged.id);
            }
            return state;
          }

          test("Cee triggers only after at least 10 cards of attack damage were actually taken", () => {
            const definition = ruleDefinitionForCard(card("bb-195", "cee-definition"));
            const trigger = definition.abilities.find((ability) => ability.kind === "triggered")?.trigger;
            assert.equal(trigger?.event, "ATTACK_DAMAGE_DEALT");
            assert.equal(trigger?.minimumEventAmount, 10);

            const nine = ceeDamageState(9);
            const afterNine = takeAllDamage(nine);
            assert.equal(afterNine.batch.some((object) => object.card.id === nine.cee.id && object.kind === "trigger"), false);

            const ten = ceeDamageState(10);
            const afterTen = takeAllDamage(ten);
            assert.equal(afterTen.batch.some((object) => object.card.id === ten.cee.id && object.kind === "trigger"), true);
          });
          '''.replace("          ", "", 1))
