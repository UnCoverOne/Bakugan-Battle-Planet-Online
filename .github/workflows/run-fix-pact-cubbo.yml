name: Run Pact and Cubbo regression fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply engine fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/fix-pact-cubbo.yml').read_text()
          start = workflow.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          exec(compile(script, 'fix-pact-cubbo.py', 'exec'))
          PY
      - name: Install dependencies
        run: npm run install:ci
      - name: Run focused regressions
        run: node --import tsx --test tests/pact-cubbo-regressions.test.ts tests/reported-regressions-2026-08-02.test.ts
      - name: Build application
        run: npm run build
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "UnCoverOne"
          git config user.email "291861529+UnCoverOne@users.noreply.github.com"
          git rm .github/fix-pact-cubbo
          git rm .github/workflows/fix-pact-cubbo.yml
          git rm .github/workflows/run-fix-pact-cubbo.yml
          git add lib components tests
          git commit -m "Fix Pact sacrifice payment and Hyper Cubbo discard"
          git push origin HEAD:${{ github.head_ref }}
