name: Apply Energy counter pill update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Energy counter pill update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Match Energy zone counter pill shape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/game-screen-v2/GameScreen.module.css')
          css = path.read_text()
          needle = '''.zoneCount {
            position: absolute;
            right: 0;
            bottom: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            width: clamp(1.3rem, 2.15vw, 2rem);
            aspect-ratio: 1;
            margin: 0;
            padding: 0;
            transform: translate(50%, 50%);
            border: 1.5px solid rgba(190, 194, 200, 0.94);
            border-radius: 50%;
            background: rgb(8, 10, 13);
            color: #fff;
            font-size: clamp(0.56rem, 0.9vw, 0.9rem);
            font-style: normal;
            font-weight: 900;
            line-height: 1;
            text-align: center;
            text-shadow: none;
          }
          '''
          override = '''
          .energyZone .zoneCount {
            width: auto;
            min-width: clamp(2.2rem, 3.4vw, 3.6rem);
            min-height: clamp(1.3rem, 2.15vw, 2rem);
            aspect-ratio: auto;
            padding-inline: clamp(0.25rem, 0.45vw, 0.48rem);
            border-radius: 999px;
          }
          '''
          if needle not in css:
              raise SystemExit('Expected zoneCount block not found')
          if '.energyZone .zoneCount {' in css:
              raise SystemExit('Energy counter pill override already present')
          path.write_text(css.replace(needle, needle + override, 1))
          PY

          git diff --check
          rm .github/workflows/apply-energy-counter-pill.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/game-screen-v2/GameScreen.module.css .github/workflows/apply-energy-counter-pill.yml
          git commit -m "Match Energy zone counter pill shape"
          git push origin HEAD:main
