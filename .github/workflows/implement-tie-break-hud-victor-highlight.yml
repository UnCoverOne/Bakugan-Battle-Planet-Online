name: Validate tie-break HUD and Victor stat highlight

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm run install:ci
      - name: Run focused regressions
        run: >-
          node --import tsx --test
          tests/tie-break-hud-victor-highlight.test.ts
          tests/manual-tie-break.test.ts
          tests/match-hud-state.test.ts
          tests/brawl-presentation.test.ts
          tests/victor-core-stop-regressions.test.ts
      - name: Build application
        run: npm run build
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          git config user.name "UnCoverOne"
          git config user.email "291861529+UnCoverOne@users.noreply.github.com"
          git rm .github/workflows/implement-tie-break-hud-victor-highlight.yml
          git commit -m "Clean tie-break HUD validation workflow"
          git push origin HEAD:${{ github.head_ref }}
