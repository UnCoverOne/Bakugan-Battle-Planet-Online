name: Implement tie-break HUD and Victor stat highlight

on:
  push:
    branches:
      - feature/tie-break-hud-victor-stat-highlight-20260803
    paths:
      - .github/apply-tie-break-hud-victor-highlight.py
      - .github/workflows/implement-tie-break-hud-victor-highlight.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tie-break-hud-victor-stat-highlight-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply implementation
        run: python3 .github/apply-tie-break-hud-victor-highlight.py
      - name: Install dependencies
        run: npm run install:ci
      - name: Run focused regressions
        run: >-
          node --import tsx --test
          tests/tie-break-hud-victor-highlight.test.ts
          tests/manual-tie-break.test.ts
          tests/match-hud-state.test.ts
          tests/brawl-presentation.test.ts
          tests/victor-core-stop-regressions.test.ts
      - name: Build application
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "UnCoverOne"
          git config user.email "291861529+UnCoverOne@users.noreply.github.com"
          git rm .github/apply-tie-break-hud-victor-highlight.py
          git rm .github/workflows/implement-tie-break-hud-victor-highlight.yml
          git add components tests
          git commit -m "Add tie-break HUD action and Victor stat highlight"
          git push origin HEAD:feature/tie-break-hud-victor-stat-highlight-20260803
