name: Agent Energize Entry State PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/energize-entry-state-and-hand
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply Energize architecture changes
        run: |
          python scripts/agent-energize-patch.py
          python <<'PY'
          from pathlib import Path

          path = Path("tests/reported-gameplay-regressions-2026-08.test.ts")
          text = path.read_text()
          test_marker = 'test("Ventus Trox Ultra energizes the selected hand card uncharged", () => {'
          next_marker = 'test("unqualified Energize effects add Energy cards charged", () => {'
          start = text.index(test_marker)
          end = text.index(next_marker, start)
          segment = text[start:end]
          line = "  state.brawlWinner = player.id;"
          if line not in segment:
            priority = "  state.priority = player.id;"
            position = text.index(priority, start, end) + len(priority)
            text = text[:position] + "\n" + line + text[position:]
          path.write_text(text)
          PY
      - name: Validate typed content
        run: npm run validate:content
      - name: Run focused Energize regressions
        run: node --import tsx --test --test-name-pattern="typed Energize|Ventus Trox Ultra energizes|unqualified Energize" tests/reported-gameplay-regressions-2026-08.test.ts
      - name: Build production application
        run: npm run build
      - name: Commit implementation
        run: |
          rm .github/workflows/agent-energize-entry-state.yml .github/workflows/agent-energize-entry-state-pr.yml scripts/agent-energize-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/rules/model.ts lib/rules/catalogue-primitives.ts lib/rules/catalogue-structure.ts lib/game.ts tests/reported-gameplay-regressions-2026-08.test.ts .github/workflows/agent-energize-entry-state.yml .github/workflows/agent-energize-entry-state-pr.yml scripts/agent-energize-patch.py
          git commit -m "Distinguish charged and uncharged Energize effects"
          git push origin HEAD:agent/energize-entry-state-and-hand
