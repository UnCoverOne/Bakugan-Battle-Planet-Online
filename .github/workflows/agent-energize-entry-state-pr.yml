name: Agent Energize Entry State PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/energize-entry-state-and-hand
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply Energize architecture changes
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/agent-energize-entry-state.yml').read_text()
          start = "          python <<'PY'\n"
          end = "\n          PY"
          body = source.split(start, 1)[1].split(end, 1)[0]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          exec(compile(script, 'agent-energize-patch.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Validate typed content
        run: npm run validate:content
      - name: Run focused rules and gameplay regressions
        run: node --import tsx --test tests/rules-engine-modernization.test.ts tests/reported-gameplay-regressions-2026-08.test.ts
      - name: Build production application
        run: npm run build
      - name: Commit implementation
        run: |
          rm .github/workflows/agent-energize-entry-state.yml .github/workflows/agent-energize-entry-state-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/rules/model.ts lib/rules/catalogue-primitives.ts lib/rules/catalogue-structure.ts lib/game.ts tests/reported-gameplay-regressions-2026-08.test.ts .github/workflows/agent-energize-entry-state.yml .github/workflows/agent-energize-entry-state-pr.yml
          git commit -m "Distinguish charged and uncharged Energize effects"
          git push origin HEAD:agent/energize-entry-state-and-hand
