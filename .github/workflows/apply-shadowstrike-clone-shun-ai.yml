name: Apply ShadowStrike Clone Shun AI fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shadowstrike-clone-shun-ai-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply implementation patch
        run: |
          python scripts/patch-shadowstrike-clone-shun-ai.py
          python scripts/patch-shadowstrike-clone-shun-ai-v2.py
      - name: Install dependencies
        run: npm run install:ci
      - name: Run rules regressions
        run: node --import tsx --test tests/rules-shadowstrike-clone-shun.test.ts
      - name: Run opponent AI tactics
        run: node --import tsx --test tests/opponent-ai-tactics.test.ts
      - name: Run reported gameplay regressions
        run: node --import tsx --test tests/reported-gameplay-regressions.test.ts
      - name: Record repository typecheck baseline
        run: npx tsc --noEmit 2>&1 | tee /tmp/typecheck.log || true
      - name: Verify diff
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/game.ts lib/rules/modifiers.ts lib/rules/catalogue-primitives.ts lib/rules/triggers.ts lib/opponentAi.ts lib/opponentAiBase.ts tests/rules-shadowstrike-clone-shun.test.ts tests/opponent-ai-tactics.test.ts
          git diff --cached --check
          git commit -m "Fix ShadowStrike scaling triggers and AI combat spending"
          git push origin HEAD:fix/shadowstrike-clone-shun-ai-20260807
