name: Implement AI energize planner

on:
  push:
    branches:
      - ai-energize-planner
    paths:
      - .github/workflows/implement-ai-energize.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply AI energize changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("lib/opponentAiBase.ts")
          source = source_path.read_text()

          old_import = '''import {
            buildChoiceSchema,
            type ChoiceField,
            type ChoiceSchema,
            type PendingCardChoice,
          } from "./rules/choices";'''
          new_import = '''import {
            buildChoiceSchema,
            schemaHasLegalCompletion,
            type ChoiceField,
            type ChoiceSchema,
            type PendingCardChoice,
          } from "./rules/choices";'''
          assert old_import in source, "rules/choices import changed"
          source = source.replace(old_import, new_import, 1)

          old_value = '''function futureCardValue(match: MatchState, playerId: string, card: GameCard) {
            const printedCost = card.cost === "X" ? 2 : card.cost;
            try {
              let value = estimateProgramValue(compileCardEffect(card), match, playerId) - printedCost * 0.4;
              if (card.type === "Hero") value += 2.2;
              if (card.type === "Evo") value += 2.8;
              if (card.type === "Flip") value += 3.2;
              return value;
            } catch {
              // A forced discard must never stall because another card in the AI hand
              // cannot be valued. Use a stable printed fallback and keep resolving.
              return printedCost * 0.4
                + (card.type === "Hero" ? 2.2 : card.type === "Evo" ? 2.8 : card.type === "Flip" ? 3.2 : 0);
            }
          }'''
          new_value = '''function evaluatedFutureCardValue(
            match: MatchState,
            playerId: string,
            card: GameCard,
            includeDeckFlipValue: boolean,
          ) {
            const printedCost = card.cost === "X" ? 2 : card.cost;
            try {
              let value = estimateProgramValue(compileCardEffect(card), match, playerId) - printedCost * 0.4;
              if (card.type === "Hero") value += 2.2;
              if (card.type === "Evo") value += 2.8;
              if (card.type === "Flip" && includeDeckFlipValue) value += 3.2;
              return value;
            } catch {
              // A forced discard must never stall because another card cannot be
              // valued. Keep the previous stable fallback for playable cards.
              return printedCost * 0.4
                + (card.type === "Hero" ? 2.2
                  : card.type === "Evo" ? 2.8
                    : card.type === "Flip" && includeDeckFlipValue ? 3.2 : 0);
            }
          }

          /**
           * A Flip only has functional value while it remains in the deck or is
           * revealed by damage. Once drawn, it cannot be played from hand, so
           * retaining it has no opportunity value for Energize or discard choices.
           */
          function handCardRetentionValue(match: MatchState, playerId: string, card: GameCard) {
            if (card.type === "Flip") return 0;
            return evaluatedFutureCardValue(match, playerId, card, false);
          }

          function deckCardFutureValue(match: MatchState, playerId: string, card: GameCard) {
            return evaluatedFutureCardValue(match, playerId, card, true);
          }'''
          assert old_value in source, "futureCardValue block changed"
          source = source.replace(old_value, new_value, 1)

          source = source.replace(
            "const future = futureCardValue(match, owner?.id ?? chooserId, selected);",
            "const future = handCardRetentionValue(match, owner?.id ?? chooserId, selected);",
            1,
          )
          source = source.replace(
            "return selected ? futureCardValue(match, controllerId, selected) : -100;",
            "return selected ? deckCardFutureValue(match, controllerId, selected) : -100;",
            1,
          )

          old_energy = '''function bestEnergyCard(match: MatchState, playerId: string) {
            const player = playerById(match, playerId)!;
            return [...player.hand].sort(
              (a, b) => futureCardValue(match, playerId, a) - futureCardValue(match, playerId, b),
            )[0];
          }'''
          new_energy = '''type EnergyGoalSource = "hand-card" | "hand-combo" | "deck";
          type EnergyGoal = {
            source: EnergyGoalSource;
            score: number;
            cardIds: string[];
            targetCost: number;
          };
          type EnergyCardAnalysis = {
            card: GameCard;
            cost: number;
            value: number;
            playLikelihood: number;
            affordableNow: boolean;
          };
          export type OpponentEnergizePlan = {
            shouldEnergize: boolean;
            cardId?: string;
            reason: "reachable-hand-card" | "reachable-hand-combo" | "probable-deck-card"
              | "no-energy-goal" | "no-expendable-card";
            goalSource?: EnergyGoalSource;
            goalCardIds?: string[];
          };

          function currentEnergyCapacity(match: MatchState, playerId: string) {
            const player = playerById(match, playerId)! as typeof match.players[number] & {
              tappedEnergyIds?: string[];
              energyTapTurn?: number;
            };
            if (player.energyTapTurn !== match.turn) return player.energyZone.length;
            const tapped = new Set(player.tappedEnergyIds ?? []);
            const untapped = player.energyZone.filter((card) => !tapped.has(card.id)).length;
            return Math.max(0, Math.floor(player.energy)) + untapped;
          }

          function futurePlayLikelihood(
            match: MatchState,
            playerId: string,
            card: GameCard,
            choices: CardChoices,
            zone: "hand" | "deck",
          ) {
            if (card.type === "Character") return 0;
            if (card.type === "Flip") return zone === "deck" ? 0.42 : 0;
            try {
              if (!schemaHasLegalCompletion(buildChoiceSchema(match, playerId, card))) return 0;
            } catch {
              return 0.2;
            }
            if (card.type === "Evo" && !choices.targetBakuganId) return 0;
            if (/\\bReroll\\b/i.test(card.effect)) {
              return match.placements.some((placement) => !placement.attachedTo) ? 0.25 : 0;
            }
            if (/\\b(?:Flow|Fury|Turbo|Domination|Victor)\\b|\\bif\\b/i.test(card.effect)) return 0.65;
            return 1;
          }

          function analyzeEnergyCard(
            match: MatchState,
            playerId: string,
            card: GameCard,
            capacity: number,
            zone: "hand" | "deck",
          ): EnergyCardAnalysis {
            let choices: CardChoices = {};
            try { choices = chooseCardChoices(match, playerId, card); } catch { choices = {}; }
            let cost = card.cost === "X" ? Math.max(1, capacity) : card.cost;
            try {
              cost = cardEnergyPaymentState(match, playerId, card, choices)?.cost ?? cost;
            } catch {
              // Keep the printed planning cost when a conditional choice is not
              // currently constructible. Its reduced likelihood handles uncertainty.
            }
            return {
              card,
              cost,
              value: zone === "hand"
                ? handCardRetentionValue(match, playerId, card)
                : deckCardFutureValue(match, playerId, card),
              playLikelihood: futurePlayLikelihood(match, playerId, card, choices, zone),
              affordableNow: cost <= capacity,
            };
          }

          function comboSynergy(a: GameCard, b: GameCard) {
            let value = a.faction === b.faction ? 0.25 : 0;
            const text = `${a.effect} ${b.effect}`;
            if (/Flow|play .*free|cost .*less|Draw|Energize/i.test(text)) value += 0.5;
            return value;
          }

          function handEnergyGoals(analyses: EnergyCardAnalysis[], capacity: number) {
            const goals: EnergyGoal[] = [];
            for (const analysis of analyses) {
              const shortfall = analysis.cost - capacity;
              if (
                analysis.playLikelihood <= 0
                || shortfall <= 0
                || shortfall > 2
                || analysis.value < 0.75
              ) continue;
              const reachability = shortfall === 1 ? 1 : 0.62;
              const score = Math.max(0, analysis.value) * analysis.playLikelihood * reachability;
              if (score >= 1.1) goals.push({
                source: "hand-card",
                score,
                cardIds: [analysis.card.id],
                targetCost: analysis.cost,
              });
            }

            const comboPieces = analyses.filter((analysis) => (
              analysis.playLikelihood > 0 && analysis.cost > 0 && analysis.value > 0.35
            ));
            for (let left = 0; left < comboPieces.length; left += 1) {
              for (let right = left + 1; right < comboPieces.length; right += 1) {
                const a = comboPieces[left];
                const b = comboPieces[right];
                const targetCost = a.cost + b.cost;
                const shortfall = targetCost - capacity;
                if (shortfall <= 0 || shortfall > 2) continue;
                const reachability = shortfall === 1 ? 1 : 0.62;
                const likelihood = Math.min(a.playLikelihood, b.playLikelihood);
                const score = (
                  Math.max(0, a.value) + Math.max(0, b.value) + comboSynergy(a.card, b.card)
                ) * likelihood * reachability * 0.5;
                if (score >= 1.35) goals.push({
                  source: "hand-combo",
                  score,
                  cardIds: [a.card.id, b.card.id],
                  targetCost,
                });
              }
            }
            return goals;
          }

          function drawAtLeastOneProbability(deckSize: number, copies: number, draws: number) {
            if (deckSize <= 0 || copies <= 0 || draws <= 0) return 0;
            let miss = 1;
            const attempts = Math.min(deckSize, draws);
            for (let index = 0; index < attempts; index += 1) {
              miss *= Math.max(0, deckSize - copies - index) / Math.max(1, deckSize - index);
            }
            return 1 - miss;
          }

          function deckEnergyGoals(match: MatchState, playerId: string, capacity: number) {
            const player = playerById(match, playerId)!;
            const grouped = new Map<string, GameCard[]>();
            for (const card of player.deckCards) {
              const cards = grouped.get(card.catalogId) ?? [];
              cards.push(card);
              grouped.set(card.catalogId, cards);
            }
            const goals: EnergyGoal[] = [];
            for (const cards of grouped.values()) {
              const analysis = analyzeEnergyCard(match, playerId, cards[0], capacity, "deck");
              const shortfall = analysis.cost - capacity;
              if (analysis.playLikelihood <= 0 || shortfall <= 0 || shortfall > 3) continue;
              const drawHorizon = Math.min(3, shortfall + 1);
              const probability = drawAtLeastOneProbability(
                player.deckCards.length,
                cards.length,
                drawHorizon,
              );
              const reachability = shortfall === 1 ? 1 : shortfall === 2 ? 0.62 : 0.28;
              const score = probability
                * Math.max(0, analysis.value)
                * analysis.playLikelihood
                * reachability
                * 0.35;
              if (score >= 0.32) goals.push({
                source: "deck",
                score,
                cardIds: cards.map((card) => card.id),
                targetCost: analysis.cost,
              });
            }
            return goals;
          }

          function energyOpportunityCost(
            match: MatchState,
            playerId: string,
            analysis: EnergyCardAnalysis,
            capacity: number,
          ) {
            const player = playerById(match, playerId)!;
            const handCopies = player.hand.filter(
              (card) => card.catalogId === analysis.card.catalogId,
            ).length;
            const deckCopies = player.deckCards.filter(
              (card) => card.catalogId === analysis.card.catalogId,
            ).length;
            const immediateUrgency = analysis.affordableNow && analysis.playLikelihood >= 0.5 ? 3.5 : 0;
            const nextTurnUrgency = !analysis.affordableNow && analysis.cost <= capacity + 1 ? 1.4 : 0;
            const lateGameDiscount = Math.max(0, analysis.cost - capacity - 1) * 0.9
              + analysis.cost * 0.08;
            const replaceability = Math.max(0, handCopies - 1) * 0.45 + deckCopies * 0.55;
            return Math.max(0, analysis.value)
              + immediateUrgency
              + nextTurnUrgency
              - lateGameDiscount
              - replaceability;
          }

          /**
           * Energize is a two-stage decision: first identify reachable Energy
           * demand, including lower-weight deck composition odds, then sacrifice
           * the least urgent non-goal card. No exact deck order is consulted.
           */
          export function planOpponentEnergize(
            match: MatchState,
            playerId: string,
          ): OpponentEnergizePlan {
            const player = playerById(match, playerId);
            if (!player) return { shouldEnergize: false, reason: "no-energy-goal" };
            const capacity = currentEnergyCapacity(match, playerId);
            const analyses = player.hand.map((card) => (
              analyzeEnergyCard(match, playerId, card, capacity, "hand")
            ));
            const goals = [
              ...handEnergyGoals(analyses, capacity),
              ...deckEnergyGoals(match, playerId, capacity),
            ].sort((a, b) => (
              b.score - a.score
              || ({ "hand-card": 0, "hand-combo": 1, deck: 2 }[a.source]
                - { "hand-card": 0, "hand-combo": 1, deck: 2 }[b.source])
            ));
            const goal = goals[0];
            if (!goal) return { shouldEnergize: false, reason: "no-energy-goal" };

            const protectedIds = new Set(goal.source === "deck" ? [] : goal.cardIds);
            const affordable = analyses.filter((analysis) => (
              analysis.affordableNow && analysis.playLikelihood >= 0.5
            ));
            if (affordable.length === 1) protectedIds.add(affordable[0].card.id);

            const candidates = analyses
              .filter((analysis) => !protectedIds.has(analysis.card.id))
              .map((analysis) => ({
                analysis,
                opportunityCost: energyOpportunityCost(
                  match,
                  playerId,
                  analysis,
                  capacity,
                ),
              }))
              .sort((a, b) => (
                a.opportunityCost - b.opportunityCost
                || b.analysis.cost - a.analysis.cost
                || a.analysis.card.id.localeCompare(b.analysis.card.id)
              ));
            const candidate = candidates[0];
            const maximumOpportunityCost = goal.source === "deck"
              ? 0.9
              : Math.max(1.5, goal.score * 0.85);
            if (!candidate || candidate.opportunityCost > maximumOpportunityCost) {
              return {
                shouldEnergize: false,
                reason: "no-expendable-card",
                goalSource: goal.source,
                goalCardIds: goal.cardIds,
              };
            }
            return {
              shouldEnergize: true,
              cardId: candidate.analysis.card.id,
              reason: goal.source === "hand-card" ? "reachable-hand-card"
                : goal.source === "hand-combo" ? "reachable-hand-combo"
                  : "probable-deck-card",
              goalSource: goal.source,
              goalCardIds: goal.cardIds,
            };
          }'''
          assert old_energy in source, "bestEnergyCard block changed"
          source = source.replace(old_energy, new_energy, 1)

          old_advance = '''  if (input.phase === "energize" && !player.energizedThisTurn) {
            return energizeCard(input, playerId, bestEnergyCard(input, playerId)?.id);
          }'''
          new_advance = '''  if (input.phase === "energize" && !player.energizedThisTurn) {
            const plan = planOpponentEnergize(input, playerId);
            return energizeCard(input, playerId, plan.shouldEnergize ? plan.cardId : undefined);
          }'''
          assert old_advance in source, "energize advance block changed"
          source = source.replace(old_advance, new_advance, 1)

          old_limit = '''    const cards = [...player.hand].sort(
              (a, b) => futureCardValue(input, playerId, a) - futureCardValue(input, playerId, b),
            ).slice(0, amount);'''
          new_limit = '''    const cards = [...player.hand].sort(
              (a, b) => handCardRetentionValue(input, playerId, a)
                - handCardRetentionValue(input, playerId, b),
            ).slice(0, amount);'''
          assert old_limit in source, "hand limit valuation changed"
          source = source.replace(old_limit, new_limit, 1)
          assert "futureCardValue" not in source, "legacy futureCardValue reference remains"
          source_path.write_text(source)

          test_path = Path("tests/ai-energize-planner.test.ts")
          test_path.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { CARDS } from "../lib/data";
          import {
            createMatch,
            type Bakugan,
            type Faction,
            type GameCard,
            type MatchState,
            type PlayerState,
          } from "../lib/game";
          import {
            advanceOpponentAi,
            planOpponentEnergize,
          } from "../lib/opponentAiBase";

          let serial = 0;

          function printedCard(number: number, id?: string): GameCard {
            const source = CARDS.find((card) => card.number === number);
            assert.ok(source, `Missing printed card ${number}`);
            serial += 1;
            return { ...source, id: id ?? `ai-plan-${number}-${serial}` };
          }

          function bakugan(id: string, faction: Faction): Bakugan {
            const character = CARDS.find((card) => (
              card.type === "Character" && card.faction === faction
            ));
            assert.ok(character);
            return {
              id,
              name: id,
              faction,
              bPower: character.bPower ?? 500,
              damage: character.damage ?? 5,
              rollAccuracy: 90,
              doubleCoreChance: 5,
              art: "",
              character: { ...character, id: `${id}-character` },
              open: false,
              heldCoreCells: [],
              evoStack: [],
            };
          }

          function player(
            id: string,
            hand: GameCard[],
            deckCards: GameCard[] = [],
          ): PlayerState {
            return {
              id,
              name: id,
              bakugan: [bakugan(`${id}-bakugan`, id === "ai" ? "Aquos" : "Pyrus")],
              cores: [],
              deck: deckCards.length,
              deckCards,
              hand,
              discard: [],
              energyZone: [],
              heroes: [],
              energy: 0,
              maxEnergy: 0,
              ready: true,
              connected: true,
              lastSeen: Date.now(),
              energizedThisTurn: false,
              cardsPlayedThisTurn: 0,
            };
          }

          function addEnergy(owner: PlayerState, amount: number) {
            owner.energyZone = Array.from({ length: amount }, (_, index) => (
              printedCard(10, `${owner.id}-energy-${index}`)
            ));
            owner.maxEnergy = amount;
          }

          function energizeMatch(ai: PlayerState, human = player("human", [])) {
            const match = createMatch("AIENERGIZE", "bo1", [ai, human]);
            match.turn = 3;
            match.phase = "energize";
            match.priority = ai.id;
            match.startingPlayer = ai.id;
            match.initialStartingPlayer = ai.id;
            match.stepLabel = "Energize Step";
            return match;
          }

          test("a stranded Flip has zero hand value but does not force Energize", () => {
            const flip = printedCard(144, "dead-flip");
            const early = printedCard(17, "early-action");
            const ai = player("ai", [flip, early]);
            addEnergy(ai, 2);
            const plan = planOpponentEnergize(energizeMatch(ai), ai.id);
            assert.equal(plan.shouldEnergize, false);
            assert.equal(plan.reason, "no-energy-goal");
          });

          test("a Flip is naturally the least costly card when a reachable hand goal exists", () => {
            const flip = printedCard(144, "goal-flip");
            const early = printedCard(17, "goal-early");
            const goal = printedCard(35, "four-cost-goal");
            const ai = player("ai", [flip, early, goal]);
            addEnergy(ai, 2);
            const match = energizeMatch(ai);
            const plan = planOpponentEnergize(match, ai.id);
            assert.equal(plan.shouldEnergize, true);
            assert.equal(plan.cardId, flip.id);
            assert.equal(plan.goalSource, "hand-card");

            const next = advanceOpponentAi(match, ai.id);
            assert.ok(next);
            const nextAi = next.players.find((candidate) => candidate.id === ai.id)!;
            assert.ok(nextAi.energyZone.some((card) => card.id === flip.id));
            assert.equal(nextAi.hand.some((card) => card.id === flip.id), false);
          });

          test("the AI protects its sole affordable card and skips without expendable fodder", () => {
            const early = printedCard(17, "sole-playable");
            const goal = printedCard(35, "sole-goal");
            const ai = player("ai", [early, goal]);
            addEnergy(ai, 2);
            const plan = planOpponentEnergize(energizeMatch(ai), ai.id);
            assert.equal(plan.shouldEnergize, false);
            assert.equal(plan.reason, "no-expendable-card");
            assert.equal(plan.goalSource, "hand-card");
          });

          test("the AI recognizes a reachable two-card sequence as Energy demand", () => {
            const first = printedCard(2, "combo-first");
            const second = printedCard(22, "combo-second");
            const flip = printedCard(144, "combo-flip");
            const ai = player("ai", [first, second, flip]);
            addEnergy(ai, 2);
            const plan = planOpponentEnergize(energizeMatch(ai), ai.id);
            assert.equal(plan.shouldEnergize, true);
            assert.equal(plan.cardId, flip.id);
            assert.equal(plan.goalSource, "hand-combo");
            assert.deepEqual(new Set(plan.goalCardIds), new Set([first.id, second.id]));
          });

          test("replaceable late-game cards are energized before early playable cards", () => {
            const earlyA = printedCard(17, "early-a");
            const earlyB = printedCard(26, "early-b");
            const late = printedCard(97, "late-fodder");
            const goal = printedCard(35, "late-goal");
            const deckCopies = [
              printedCard(97, "late-copy-1"),
              printedCard(97, "late-copy-2"),
            ];
            const ai = player("ai", [earlyA, earlyB, late, goal], deckCopies);
            addEnergy(ai, 2);
            const plan = planOpponentEnergize(energizeMatch(ai), ai.id);
            assert.equal(plan.shouldEnergize, true);
            assert.equal(plan.cardId, late.id);
            assert.equal(plan.goalSource, "hand-card");
          });

          test("remaining deck composition creates lower-weight probabilistic Energy demand", () => {
            const flip = printedCard(144, "deck-flip");
            const early = printedCard(17, "deck-early");
            const filler = Array.from({ length: 7 }, (_, index) => (
              printedCard(26, `deck-filler-${index}`)
            ));
            const futureCopies = [
              printedCard(35, "deck-goal-1"),
              printedCard(35, "deck-goal-2"),
              printedCard(35, "deck-goal-3"),
            ];
            const ai = player("ai", [flip, early], [...filler, ...futureCopies]);
            addEnergy(ai, 2);
            const plan = planOpponentEnergize(energizeMatch(ai), ai.id);
            assert.equal(plan.shouldEnergize, true);
            assert.equal(plan.cardId, flip.id);
            assert.equal(plan.goalSource, "deck");
            assert.equal(plan.reason, "probable-deck-card");
          });

          test("a remote low-probability deck card is not enough to justify Energize", () => {
            const flip = printedCard(144, "remote-flip");
            const early = printedCard(17, "remote-early");
            const remote = printedCard(131, "remote-goal");
            const filler = Array.from({ length: 29 }, (_, index) => (
              printedCard(26, `remote-filler-${index}`)
            ));
            const ai = player("ai", [flip, early], [remote, ...filler]);
            addEnergy(ai, 2);
            const plan = planOpponentEnergize(energizeMatch(ai), ai.id);
            assert.equal(plan.shouldEnergize, false);
            assert.equal(plan.reason, "no-energy-goal");
          });

          test("hand-limit discard treats a drawn Flip as zero retention value", () => {
            const flip = printedCard(144, "discard-flip");
            const playable = Array.from({ length: 7 }, (_, index) => (
              printedCard(17, `discard-playable-${index}`)
            ));
            const ai = player("ai", [flip, ...playable]);
            const match = energizeMatch(ai);
            match.phase = "handLimit";
            match.priority = ai.id;
            const next = advanceOpponentAi(match, ai.id);
            assert.ok(next);
            const nextAi = next.players.find((candidate) => candidate.id === ai.id)!;
            assert.ok(nextAi.discard.some((card) => card.id === flip.id));
            assert.equal(nextAi.hand.some((card) => card.id === flip.id), false);
          });
          ''')

          package_path = Path("package.json")
          package = package_path.read_text()
          old_tests = "tests/opponent-ai-tactics.test.ts tests/wave-slash-ai.test.ts"
          new_tests = "tests/opponent-ai-tactics.test.ts tests/ai-energize-planner.test.ts tests/wave-slash-ai.test.ts"
          assert old_tests in package, "package test list changed"
          package_path.write_text(package.replace(old_tests, new_tests, 1))
          PY
      - name: Install dependencies
        run: npm run install:ci
      - name: Run focused AI regressions
        run: node --import tsx --test tests/ai-energize-planner.test.ts tests/opponent-ai-tactics.test.ts tests/pact-cubbo-regressions.test.ts
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          rm .github/workflows/implement-ai-energize.yml
