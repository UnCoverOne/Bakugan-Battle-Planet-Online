name: Run AI reroll and buff-combo fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.head_ref == 'agent/fix-ai-reroll-buff-combos'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ai-reroll-buff-combos
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-ai-reroll-buff-combos.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(index for index in range(start, len(source)) if source[index].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          Path('/tmp/apply-ai-reroll-buff-combos.py').write_text(script)
          PY
          python /tmp/apply-ai-reroll-buff-combos.py
          rm -f .github/workflows/run-ai-reroll-buff-combos.yml
      - name: Validate implementation
        run: |
          git diff --check
          npx eslint lib/opponentAi.ts lib/opponentAiBase.ts tests/opponent-ai-tactics.test.ts
      - name: Run focused AI regressions
        run: >-
          node --import tsx --test
          tests/opponent-ai-tactics.test.ts
          tests/reroll-mechanic.test.ts
          tests/ai-roll-forecast.test.ts
          tests/ai-energize-planner.test.ts
      - name: Build production application
        run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve AI Reroll and B-Power combo tactics"
          git push origin HEAD:agent/fix-ai-reroll-buff-combos
