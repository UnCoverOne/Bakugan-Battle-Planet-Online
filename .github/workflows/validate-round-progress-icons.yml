name: Validate Round Progress Icons

on:
  push:
    branches:
      - agent/use-callout-icons-round-hud
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Run focused progress regressions
        run: node --import tsx --test tests/turn-progress-icons.test.ts tests/roll-phase-presentation.test.ts
      - name: Build
        run: npm run build
