name: Content Lock Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "content/**"
      - "lib/content/**"
      - "scripts/content-lock.mts"
      - "scripts/validate-content.mts"
      - ".github/workflows/content-quality-operations.yml"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "lib/content/**"
      - "scripts/content-lock.mts"
      - "scripts/validate-content.mts"
      - ".github/workflows/content-quality-operations.yml"

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run validate:content
