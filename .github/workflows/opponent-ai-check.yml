name: Opponent AI Regression Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/opponentAi*.ts"
      - "lib/game.ts"
      - "lib/rules/**"
      - "tests/opponent-ai*.test.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "lib/opponentAi*.ts"
      - "lib/game.ts"
      - "lib/rules/**"
      - "tests/opponent-ai*.test.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
