name: One-shot Offline Public Deck Architecture

# Temporary migration workflow; removed automatically after a successful validated run.
on:
  push:
    branches:
      - implement/offline-public-deck-slots
    paths:
      - ".github/workflows/one-shot-offline-public-decks.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implement/offline-public-deck-slots
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Prepare architecture migration
        run: python scripts/fix-offline-public-deck-migration.py
      - name: Apply architecture migration
        run: python scripts/apply-offline-public-deck-architecture.py
      - name: Build
        run: npm run build
      - name: Targeted regression tests
        run: node --import tsx --test tests/administration.test.ts tests/deck-experience.test.ts tests/non-game-workflows.test.ts tests/route-architecture.test.ts
      - name: Lint
        run: npm run lint
      - name: Commit migrated implementation
        run: |
          rm scripts/apply-offline-public-deck-architecture.py
          rm scripts/fix-offline-public-deck-migration.py
          rm .github/workflows/one-shot-offline-public-decks.yml
          git config user.name "UnCoverOne"
          git config user.email "uncover250@gmail.com"
          git add -A
          git commit -m "Separate online public decks from offline fallback slots" -m "Make the server authoritative for the online Public Deck library, add three administrator-managed offline fallback slots with cached client synchronization, and preserve bundled decks strictly as first-run offline defaults."
          git push origin HEAD:implement/offline-public-deck-slots
