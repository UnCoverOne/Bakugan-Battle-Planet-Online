name: Agent Turn to Energy Diagnosis

on:
  push:
    branches:
      - agent/fix-turn-to-energy-chain
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Turn to Energy regression
        run: node --import tsx --test tests/turn-to-energy-chain.test.ts
