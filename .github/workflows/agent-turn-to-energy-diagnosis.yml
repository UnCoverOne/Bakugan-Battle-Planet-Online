name: Agent Turn to Energy Diagnosis

on:
  push:
    branches:
      - agent/fix-turn-to-energy-chain
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect batch and priority integration
        run: |
          echo '--- passPriority callers ---'
          grep -RIn --exclude-dir=node_modules --exclude='*.map' 'passPriority' app components lib tests | head -200 || true
          echo '--- batch presentation ---'
          grep -RIn --exclude-dir=node_modules --exclude='*.map' 'batch' app components | head -240 || true
          echo '--- Turn to Energy references ---'
          grep -RIn --exclude-dir=node_modules --exclude='*.map' 'Turn to Energy\|bb-134' . | head -120 || true
      - name: Run Turn to Energy regression
        run: node --import tsx --test tests/turn-to-energy-chain.test.ts
