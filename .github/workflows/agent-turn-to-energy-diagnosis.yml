name: Agent Turn to Energy Fix

on:
  push:
    branches:
      - agent/fix-turn-to-energy-chain
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-turn-to-energy-chain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply atomic batch settlement fix
        run: python scripts/agent-fix-turn-to-energy-chain.py
      - name: Run focused Turn to Energy regressions
        run: node --import tsx --test tests/turn-to-energy-chain.test.ts
      - name: Build production application
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/agent-fix-turn-to-energy-chain.py .github/workflows/agent-turn-to-energy-diagnosis.yml
          git add lib/game.ts lib/rules/state.ts tests/turn-to-energy-chain.test.ts package.json
          git commit -m "Fix Turn to Energy chain settlement"
          git push origin HEAD:agent/fix-turn-to-energy-chain
