name: Apply complete Brawler Name settings

on:
  push:
    branches:
      - agent/complete-brawler-name-settings

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-brawler-name-settings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Implement complete Brawler Name editing
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "components/application/AppProvider.jsx",
              '  const saveAccountProfile = useCallback(async () => { if (!authUser) return notify("Profile changes are saved on this device."); const response = await fetch("/api/auth", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "update-profile", displayName: profile.name, faction: profile.faction }) }); const result = await response.json(); if (!response.ok) throw new Error(result.error ?? "Could not update account profile."); setAuthUser(result.user); setModifiedAt(Date.now()); }, [authUser, notify, profile.faction, profile.name, setModifiedAt]);\n',
              '''  const saveAccountProfile = useCallback(async (updates = {}) => {\n    const displayName = String(updates.displayName ?? profile.name)\n      .trim()\n      .replace(/\\s+/g, " ");\n    const faction = updates.faction ?? profile.faction;\n    if (!displayName || displayName.length > 20) {\n      throw new Error("Brawler Name must be between 1 and 20 characters.");\n    }\n    if (!authUser) {\n      setProfile((current) => ({\n        ...current,\n        name: displayName,\n        faction,\n        signedIn: false,\n      }));\n      notify("Brawler Name updated on this device.");\n      return { displayName, faction };\n    }\n    const response = await fetch("/api/auth", {\n      method: "POST",\n      headers: { "content-type": "application/json" },\n      body: JSON.stringify({\n        action: "update-profile",\n        displayName,\n        faction,\n      }),\n    });\n    const result = await readJsonResponse(\n      response,\n      "Account profile returned an invalid response.",\n    );\n    if (!response.ok || !result.user) {\n      throw new Error(result.error ?? "Could not update the Brawler Name.");\n    }\n    setAuthUser(result.user);\n    setProfile((current) => ({\n      ...current,\n      name: result.user.displayName,\n      faction: result.user.faction,\n      signedIn: true,\n    }));\n    setModifiedAt(Date.now());\n    notify("Brawler Name updated.");\n    return result.user;\n  }, [authUser, notify, profile.faction, profile.name, setModifiedAt, setProfile]);\n''',
          )

          replace_once(
              "components/routes/SettingsScreen.tsx",
              '''    signOutAccount,\n    requestAccountAccess,\n''',
              '''    signOutAccount,\n    saveAccountProfile,\n    requestAccountAccess,\n''',
          )
          replace_once(
              "components/routes/SettingsScreen.tsx",
              '  const [section, setSection] = useState<Section>("Account");\n',
              '  const [section, setSection] = useState<Section>("Account");\n  const [brawlerName, setBrawlerName] = useState(profile.name);\n',
          )
          replace_once(
              "components/routes/SettingsScreen.tsx",
              '''  useEffect(\n    () => () => {\n      if (savedTimer.current) clearTimeout(savedTimer.current);\n    },\n    [],\n  );\n\n''',
              '''  useEffect(\n    () => () => {\n      if (savedTimer.current) clearTimeout(savedTimer.current);\n    },\n    [],\n  );\n\n  useEffect(() => {\n    setBrawlerName(profile.name);\n  }, [profile.name]);\n\n''',
          )
          replace_once(
              "components/routes/SettingsScreen.tsx",
              '  const submitPassword = async (event: React.FormEvent) => {\n',
              '''  const submitBrawlerName = async (event: React.FormEvent) => {\n    event.preventDefault();\n    const normalizedBrawlerName = brawlerName.trim().replace(/\\s+/g, " ");\n    if (!normalizedBrawlerName || normalizedBrawlerName.length > 20) {\n      setAccountError("Brawler Name must be between 1 and 20 characters.");\n      return;\n    }\n    setAccountBusy(true);\n    setAccountError("");\n    try {\n      await saveAccountProfile({ displayName: normalizedBrawlerName });\n      setBrawlerName(normalizedBrawlerName);\n      setSavedField("Brawler Name updated");\n      if (savedTimer.current) clearTimeout(savedTimer.current);\n      savedTimer.current = setTimeout(() => setSavedField(""), 2200);\n    } catch (error) {\n      setAccountError(\n        error instanceof Error\n          ? error.message\n          : "Could not update the Brawler Name.",\n      );\n    } finally {\n      setAccountBusy(false);\n    }\n  };\n\n  const submitPassword = async (event: React.FormEvent) => {\n''',
          )
          replace_once(
              "components/routes/SettingsScreen.tsx",
              '''            >\n              {authUser ? (\n''',
              '''            >\n              <form\n                className={styles.passwordForm}\n                onSubmit={submitBrawlerName}\n              >\n                <h3>Brawler Name</h3>\n                <Field\n                  label="Brawler Name"\n                  hint={\n                    authUser\n                      ? "Shown on your Profile, published identity, and matches. Use 1–20 characters."\n                      : "Shown on this device in your Profile and matches. Use 1–20 characters."\n                  }\n                >\n                  <input\n                    type="text"\n                    autoComplete="nickname"\n                    minLength={1}\n                    maxLength={20}\n                    value={brawlerName}\n                    onChange={(event) => setBrawlerName(event.target.value)}\n                    required\n                  />\n                </Field>\n                <ActionButton\n                  type="submit"\n                  tone="secondary"\n                  disabled={\n                    accountBusy ||\n                    !brawlerName.trim() ||\n                    brawlerName.trim().replace(/\\s+/g, " ") === profile.name\n                  }\n                >\n                  Update Brawler Name\n                </ActionButton>\n              </form>\n              {authUser ? (\n''',
          )

          replace_once(
              "app/api/auth/route.ts",
              '''      const email = validateAccountInput(String(body.email ?? ""), String(body.password ?? ""), String(body.displayName ?? ""));\n      const displayName = String(body.displayName ?? "").trim();\n''',
              '''      const displayName = String(body.displayName ?? "").trim().replace(/\\s+/g, " ");\n      const email = validateAccountInput(\n        String(body.email ?? ""),\n        String(body.password ?? ""),\n        displayName,\n      );\n''',
          )
          replace_once(
              "app/api/auth/route.ts",
              '''    if (action === "update-profile") {\n      const displayName = String(body.displayName ?? "").trim();\n      if (!displayName || displayName.length > 20) return json({ error: "Brawler name must be between 1 and 20 characters." }, 400);\n''',
              '''    if (action === "update-profile") {\n      const displayName = String(body.displayName ?? "").trim().replace(/\\s+/g, " ");\n      if (!displayName || displayName.length > 20) return json({ error: "Brawler Name must be between 1 and 20 characters." }, 400);\n''',
          )

          replace_once(
              "lib/account-server.ts",
              'throw new Error("Brawler name must be between 1 and 20 characters.");',
              'throw new Error("Brawler Name must be between 1 and 20 characters.");',
          )

          modal = Path("components/application/AccountAccessModal.tsx")
          modal_text = modal.read_text().replace("Brawler name", "Brawler Name")
          if modal_text == modal.read_text():
              raise SystemExit("Expected Brawler name copy in AccountAccessModal.tsx")
          modal.write_text(modal_text)

          test_file = Path("tests/brawler-name-settings.test.ts")
          test_file.write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\n\nconst source = (path: string) => readFileSync(path, "utf8");\n\ntest("Settings Account exposes an editable Brawler Name for account and guest profiles", () => {\n  const settings = source("components/routes/SettingsScreen.tsx");\n  assert.match(settings, /saveAccountProfile,/);\n  assert.match(settings, /onSubmit=\\{submitBrawlerName\\}/);\n  assert.match(settings, /label="Brawler Name"/);\n  assert.match(settings, /autoComplete="nickname"/);\n  assert.match(settings, /maxLength=\\{20\\}/);\n  assert.match(settings, /Update Brawler Name/);\n  assert.match(\n    settings,\n    /saveAccountProfile\\(\\{ displayName: normalizedBrawlerName \\}\\)/,\n  );\n});\n\ntest("profile saving updates local identity and the signed-in account identity", () => {\n  const provider = source("components/application/AppProvider.jsx");\n  assert.match(provider, /saveAccountProfile = useCallback\\(async \\(updates = \\{\\}\\)/);\n  assert.match(provider, /updates\\.displayName \\?\\? profile\\.name/);\n  assert.match(provider, /action: "update-profile"/);\n  assert.match(provider, /setAuthUser\\(result\\.user\\)/);\n  assert.match(provider, /name: result\\.user\\.displayName/);\n  assert.match(provider, /signedIn: true/);\n  assert.match(provider, /Brawler Name updated on this device/);\n});\n\ntest("the account API normalizes and persists Brawler Name changes", () => {\n  const route = source("app/api/auth/route.ts");\n  assert.match(\n    route,\n    /String\\(body\\.displayName \\?\\? ""\\)\\.trim\\(\\)\\.replace\\(\\/\\\\s\\+\\/g, " "\\)/,\n  );\n  assert.match(route, /UPDATE users SET display_name = \\?, faction = \\?, updated_at = \\?/);\n  assert.match(route, /Brawler Name must be between 1 and 20 characters/);\n});\n\ntest("registration and account settings use the Brawler Name label", () => {\n  const modal = source("components/application/AccountAccessModal.tsx");\n  assert.match(modal, /Brawler Name/);\n  assert.doesNotMatch(modal, /Brawler name/);\n});\n''')

          replace_once(
              "package.json",
              "tests/supporting-pages.test.ts tests/guest-first-auth.test.ts",
              "tests/supporting-pages.test.ts tests/brawler-name-settings.test.ts tests/guest-first-auth.test.ts",
          )

          for workflow in [
              ".github/workflows/apply-editable-brawler-name.yml",
              ".github/workflows/run-editable-brawler-name.yml",
              ".github/workflows/apply-complete-brawler-name.yml",
          ]:
              Path(workflow).unlink(missing_ok=True)
          PY
      - run: npm ci
      - name: Validate changed source
        run: |
          git diff --check
          npx eslint \
            app/api/auth/route.ts \
            lib/account-server.ts \
            components/application/AppProvider.jsx \
            components/application/AccountAccessModal.tsx \
            components/routes/SettingsScreen.tsx \
            tests/brawler-name-settings.test.ts
      - name: Run account and profile regression tests
        run: >-
          node --import tsx --test
          tests/brawler-name-settings.test.ts
          tests/supporting-pages.test.ts
          tests/guest-first-auth.test.ts
          tests/persistence-boundaries.test.ts
          tests/account-sync.integration.test.ts
          tests/administration.test.ts
          tests/profile-customization.test.ts
      - name: Build production application
        run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement editable Brawler Name settings"
          git push origin HEAD:agent/complete-brawler-name-settings
