name: Apply navigation and account overlay fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nav-account-overlay-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply implementation patch
        run: python scripts/patch-nav-account-overlay-20260808.py
      - name: Install dependencies
        run: npm run install:ci
      - name: Run shell regression
        run: node --import tsx --test tests/website-overhaul.test.ts
      - name: Run Compendium regressions
        run: node --import tsx --test tests/compendium-experience.test.ts
      - name: Build production app
        run: npm run build
      - name: Verify diff
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/application/AppShell.jsx app/website-overhaul.css app/home-layout.css tests/website-overhaul.test.ts tests/visual/foundation.spec.ts
          git diff --cached --check
          git commit -m "Remove sync nav control and fix account menu layering"
          git push origin HEAD:fix/nav-account-overlay-20260808
