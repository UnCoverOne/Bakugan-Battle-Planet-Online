name: Generalized Value Expressions Bootstrap

on:
  push:
    branches: [feature/generalized-value-expressions]
  pull_request:
    branches: [feature/unified-card-play-pipeline]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/generalized-value-expressions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply remaining value-expression stages
        run: |
          if ! grep -q 'NumberValue' lib/rules/model.ts; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-generalized-value-expressions.py")
          text = path.read_text()
          old = """def regex_once(text: str, pattern: str, replacement, label: str, flags: int = 0) -> str:\n    result, count = re.subn(pattern, replacement, text, count=1, flags=flags)\n    if count != 1:\n        raise RuntimeError(f\"{label}: expected one regex match, found {count}\")\n    return result\n"""
          new = """def regex_once(text: str, pattern: str, replacement, label: str, flags: int = 0) -> str:\n    repl = replacement if callable(replacement) else (lambda _match: replacement)\n    result, count = re.subn(pattern, repl, text, count=1, flags=flags)\n    if count != 1:\n        raise RuntimeError(f\"{label}: expected one regex match, found {count}\")\n    return result\n"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
            python3 scripts/apply-generalized-value-expressions.py
          fi
          if ! grep -q 'captureCardPlayMoment' lib/game.ts; then
            python3 scripts/apply-value-expression-capture.py
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run focused value and rules tests
        run: npx tsx --test tests/value-expressions.test.ts tests/rules-primitives.test.ts tests/card-payment.test.ts tests/card-play-pipeline.test.ts
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib tests
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "Integrate value-expression timing snapshots"
          git push origin HEAD:feature/generalized-value-expressions
