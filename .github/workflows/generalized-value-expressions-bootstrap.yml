name: Generalized Value Expressions Bootstrap

on:
  push:
    branches: [feature/generalized-value-expressions]
  pull_request:
    branches: [feature/unified-card-play-pipeline]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/generalized-value-expressions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply staged value-expression migration
        run: |
          if [ "$(git log -1 --pretty=%s)" = "Implement generalized value expressions" ]; then
            echo "Generated implementation is already present."
          else
            python3 scripts/apply-generalized-value-expressions.py
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run focused value and rules tests
        run: npx tsx --test tests/value-expressions.test.ts tests/rules-primitives.test.ts tests/card-payment.test.ts tests/card-play-pipeline.test.ts
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit implementation
        if: github.event_name == 'pull_request' || github.event.head_commit.message != 'Implement generalized value expressions'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib tests
          if git diff --cached --quiet; then
            echo "No generated implementation changes to commit."
            exit 0
          fi
          git commit -m "Implement generalized value expressions"
          git push origin HEAD:feature/generalized-value-expressions
