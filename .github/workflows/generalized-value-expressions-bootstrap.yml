name: Generalized Value Expressions Bootstrap

on:
  push:
    branches: [feature/generalized-value-expressions]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message != 'Implement generalized value expressions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply staged value-expression migration
        run: python3 scripts/apply-generalized-value-expressions.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused value and rules tests
        run: npx tsx --test tests/value-expressions.test.ts tests/rules-primitives.test.ts tests/card-payment.test.ts tests/card-play-pipeline.test.ts
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib tests
          if git diff --cached --quiet; then
            echo "No generated implementation changes to commit."
            exit 0
          fi
          git commit -m "Implement generalized value expressions"
          git push origin HEAD:feature/generalized-value-expressions
