name: Energy Source Refactor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'refactor/energy-count-source-of-truth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/energy-count-source-of-truth
          fetch-depth: 0
      - name: Audit legacy Energy mirrors
        shell: bash
        run: |
          echo '=== maxEnergy / max-energy references ==='
          grep -R -n -E 'maxEnergy|max-energy' lib tests components app || true
          echo '=== Energy count expressions ==='
          grep -R -n -E 'source: "energy"|source: .energy.' lib tests || true
