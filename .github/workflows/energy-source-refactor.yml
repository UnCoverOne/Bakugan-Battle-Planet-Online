name: Energy Source Refactor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'refactor/energy-count-source-of-truth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/energy-count-source-of-truth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Energy source-of-truth refactor
        run: python .github/scripts/energy-source-refactor.py
      - run: npm ci
      - name: Focused Energy source tests
        run: npx tsx --test tests/energy-count-source.test.ts tests/rules-engine-modernization.test.ts tests/card-payment.test.ts tests/recharge-and-dark-waters.test.ts tests/turn-to-energy-chain.test.ts
      - name: Full rules suite
        run: npm run test:rules
      - name: Full gameplay suite
        run: npm run test:gameplay
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Enforce physical Energy source of truth
        shell: bash
        run: |
          if grep -R -n -E 'maxEnergy|max-energy|energy-zone-size|energy-count' lib --include='*.ts' --include='*.tsx'; then
            echo 'Legacy or redundant Energy count state remains in production.' >&2
            exit 1
          fi
      - name: Commit validated refactor
        shell: bash
        run: |
          git rm .github/workflows/energy-source-refactor.yml .github/scripts/energy-source-refactor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: use physical Energy count as source of truth'
          git push origin HEAD:refactor/energy-count-source-of-truth
