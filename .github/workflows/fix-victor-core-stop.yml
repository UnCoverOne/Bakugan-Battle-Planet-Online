name: Fix victor-stat and conditional Stop mechanics

on:
  pull_request:
    branches: [main]
    paths:
      - .github/fix-victor-core-stop

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply rules-engine fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              if old not in source:
                  raise SystemExit(f"Could not locate patch anchor in {path}: {old[:120]!r}")
              file.write_text(source.replace(old, new, 1))

          replace_once(
              "lib/rules/model.ts",
              '  | { kind: "held-core-type"; coreTypes: CoreType[] }',
              '  | { kind: "held-core-type"; coreTypes: CoreType[]; subject?: "target" | "controller-team" | "opponent-active" | "attacker" }',
          )

          replace_once(
              "lib/rules/catalogue-primitives.ts",
              '''  const heldCorePrefix = text.match(
    /^\\s*(\\[(?:FT|FF|SD|MS|HE)\\](?:\\s*(?:or|and)\\s*\\[(?:FT|FF|SD|MS|HE)\\])*)\\s*:/i,
  )?.[1];
  if (heldCorePrefix) {
    return { kind: "held-core-type", coreTypes: coreTypesFor(heldCorePrefix) };
  }
  const heldCoreCondition = text.match(
    /\\bif\\s+(?:that|your|the)\\s+Bakugan\\s+(?:is\\s+)?holding\\s+(\\[(?:FT|FF|SD|MS|HE)\\](?:\\s*(?:or|and)\\s*\\[(?:FT|FF|SD|MS|HE)\\])*)/i,
  )?.[1];
  if (heldCoreCondition) return { kind: "held-core-type", coreTypes: coreTypesFor(heldCoreCondition) };''',
              '''  const heldCorePrefix = text.match(
    /^\\s*(\\[(?:FT|FF|SD|MS|HE)\\](?:\\s*(?:or|and)\\s*\\[(?:FT|FF|SD|MS|HE)\\])*)\\s*:/i,
  )?.[1];
  if (heldCorePrefix) {
    return { kind: "held-core-type", coreTypes: coreTypesFor(heldCorePrefix), subject: "target" };
  }
  const stopHeldCoreCondition = text.match(
    /\\[Stop\\]\\s+(?:an?|the)\\s+Bakugan\\s+(?:is\\s+)?holding\\s+(\\[(?:FT|FF|SD|MS|HE)\\](?:\\s*(?:or|and)\\s*\\[(?:FT|FF|SD|MS|HE)\\])*)/i,
  )?.[1];
  if (stopHeldCoreCondition) {
    return { kind: "held-core-type", coreTypes: coreTypesFor(stopHeldCoreCondition), subject: "attacker" };
  }
  const teamHeldCoreCondition = text.match(
    /\\bif\\s+(?:one|any)\\s+of\\s+your\\s+Bakugan\\s+(?:is|are)\\s+holding\\s+(\\[(?:FT|FF|SD|MS|HE)\\](?:\\s*(?:or|and)\\s*\\[(?:FT|FF|SD|MS|HE)\\])*)/i,
  )?.[1];
  if (teamHeldCoreCondition) {
    return { kind: "held-core-type", coreTypes: coreTypesFor(teamHeldCoreCondition), subject: "controller-team" };
  }
  const heldCoreCondition = text.match(
    /\\bif\\s+(that|your|the|an?|opposing|enemy)\\s+Bakugan\\s+(?:is\\s+)?holding\\s+(\\[(?:FT|FF|SD|MS|HE)\\](?:\\s*(?:or|and)\\s*\\[(?:FT|FF|SD|MS|HE)\\])*)/i,
  );
  if (heldCoreCondition) {
    const subject = /opposing|enemy/i.test(heldCoreCondition[1]) ? "opponent-active" : "target";
    return { kind: "held-core-type", coreTypes: coreTypesFor(heldCoreCondition[2]), subject };
  }''',
          )
          replace_once(
              "lib/rules/catalogue-primitives.ts",
              '  if (/\\bVictor\\b/i.test(text)) return { kind: "victor" };',
              '  if (/\\bVictor\\s*[-:]/i.test(text)) return { kind: "victor" };',
          )

          replace_once(
              "lib/rules/modifiers.ts",
              '''    case "held-core-type":
      return Boolean(bakugan && bakugan.heldCoreCells.some((cell) => {
        const core = state.placements.find((placement) => placement.cell === cell)?.core;
        return Boolean(core && condition.coreTypes.includes(core.type));
      }));''',
              '''    case "held-core-type": {
      const hasRequiredCore = (candidate?: Bakugan) => Boolean(candidate && candidate.heldCoreCells.some((cell) => {
        const core = state.placements.find((placement) => placement.cell === cell)?.core;
        return Boolean(core && condition.coreTypes.includes(core.type));
      }));
      if (condition.subject === "controller-team") return player.bakugan.some((candidate) => hasRequiredCore(candidate));
      if (condition.subject === "opponent-active") {
        const opposing = opponent?.bakugan.find((candidate) => candidate.id === state.selected[opponent.id])
          ?? opponent?.bakugan.find((candidate) => candidate.open);
        return hasRequiredCore(opposing);
      }
      if (condition.subject === "attacker") {
        const attacker = state.players.flatMap((candidate) => candidate.bakugan)
          .find((candidate) => candidate.id === state.damageOrigin);
        return hasRequiredCore(attacker);
      }
      return hasRequiredCore(bakugan);
    }''',
          )

          replace_once(
              "lib/game.ts",
              '''const flipStopsDamage = (state: MatchState, card: GameCard) => {
  const text = card.effect; const faction = state.damageFaction!;
  if (/\\[Stop\\] an attack/i.test(text)) return true;
  const non = text.match(/\\[Stop\\] non-\\[(Aquos|Pyrus|Darkus|Haos|Ventus|Aurelus)\\]/i); if (non) return faction !== non[1];
  const listed = [...text.matchAll(/\\[(Aquos|Pyrus|Darkus|Haos|Ventus|Aurelus)\\]/gi)].map((match) => match[1]); return /\\[Stop\\]/i.test(text) && listed.includes(faction);
};''',
              '''export const flipStopsDamage = (state: MatchState, card: GameCard) => {
  const text = card.effect;
  const coreTypes = [...text.matchAll(/\\[(MS|FF|FT|SD|HE)\\]/gi)]
    .map((match) => coreCode[match[1].toUpperCase()])
    .filter((type): type is CoreType => Boolean(type));
  if (/\\[Stop\\]\\s+(?:an?|the)\\s+Bakugan\\s+(?:is\\s+)?holding/i.test(text)) {
    const attacker = state.players.flatMap((player) => player.bakugan)
      .find((bakugan) => bakugan.id === state.damageOrigin);
    return Boolean(attacker && coreTypes.some((type) => hasCoreType(state, attacker, type)));
  }
  if (/\\[Stop\\] an attack/i.test(text)) return true;
  const faction = state.damageFaction;
  if (!faction) return false;
  const non = text.match(/\\[Stop\\] non-\\[(Aquos|Pyrus|Darkus|Haos|Ventus|Aurelus)\\]/i);
  if (non) return faction !== non[1];
  const listed = [...text.matchAll(/\\[(Aquos|Pyrus|Darkus|Haos|Ventus|Aurelus)\\]/gi)]
    .map((match) => match[1]);
  return /\\[Stop\\]/i.test(text) && listed.includes(faction);
};

export function revealedFlipCanBePlayed(
  state: MatchState | null | undefined,
  playerId: string | undefined,
  card: GameCard | undefined = state?.revealedFlip,
) {
  if (!state || !playerId || !card) return false;
  if (state.phase !== "damage" || state.pendingLoser !== playerId || state.revealedFlip?.id !== card.id) return false;
  return !/\\[Stop\\]/i.test(card.effect) || flipStopsDamage(state, card);
}''',
          )

          replace_once(
              "lib/manualDamage.ts",
              '''  recordCardPlayedForTurn,
  resumePendingEffectAfterDamage,''',
              '''  recordCardPlayedForTurn,
  revealedFlipCanBePlayed,
  resumePendingEffectAfterDamage,''',
          )
          replace_once(
              "lib/manualDamage.ts",
              '''  if (flip.id !== flipCardId) throw new Error("Only the currently revealed Flip card may be played.");

  const state = cloneMatch(input);''',
              '''  if (flip.id !== flipCardId) throw new Error("Only the currently revealed Flip card may be played.");
  if (!revealedFlipCanBePlayed(input, playerId, flip)) {
    throw new Error("This Flip card's Stop condition is not met by the attacking Bakugan.");
  }

  const state = cloneMatch(input);''',
          )

          replace_once(
              "components/game-screen-v2/matchHudState.ts",
              '''  playerCanActivateIntrinsicReroll,
  type CardChoices,''',
              '''  playerCanActivateIntrinsicReroll,
  revealedFlipCanBePlayed,
  type CardChoices,''',
          )
          replace_once(
              "components/game-screen-v2/matchHudState.ts",
              '    "play-flip": !completed && flipDecision && !cardPlayLocked,',
              '    "play-flip": !completed && flipDecision && !cardPlayLocked && revealedFlipCanBePlayed(match, player?.id),',
          )

          replace_once(
              "lib/opponentAiBase.ts",
              '''  resolveRollOutcome,
  rotationPhaseOpenCell,''',
              '''  resolveRollOutcome,
  revealedFlipCanBePlayed,
  rotationPhaseOpenCell,''',
          )
          replace_once(
              "lib/opponentAiBase.ts",
              '''      !alternateWinEffectPending(input) && payment && payment.kind !== "insufficient" && useful
        ? input.revealedFlip.id''',
              '''      !alternateWinEffectPending(input)
        && revealedFlipCanBePlayed(input, playerId, input.revealedFlip)
        && payment
        && payment.kind !== "insufficient"
        && useful
        ? input.revealedFlip.id''',
          )

          Path("tests/victor-core-stop-regressions.test.ts").write_text(r'''import assert from "node:assert/strict";
import test from "node:test";
import { CARD_BY_ID, CARDS, CORES, STARTER_DECKS, makePlayer } from "../lib/data";
import {
  createMatch,
  flipStopsDamage,
  passPriority,
  revealedFlipCanBePlayed,
  type GameCard,
  type MatchState,
} from "../lib/game";
import { resolveManualDamage } from "../lib/manualDamage";
import { advanceOpponentAi } from "../lib/opponentAi";
import { compileCardEffect } from "../lib/rules/effects";
import { ruleConditionActive } from "../lib/rules/modifiers";
import { ruleDefinitionForCard } from "../lib/rules/catalogue";
import { createRuleObject } from "../lib/rules/objects";
import { visibleMatchHudActions } from "../components/game-screen-v2/matchHudState";

function cardInstance(catalogId: string, suffix = "test") {
  const template = CARD_BY_ID.get(catalogId);
  assert.ok(template, `Missing ${catalogId}`);
  return { ...structuredClone(template), id: `${catalogId}-${suffix}` };
}

function openBrawl() {
  const first = makePlayer("first", "First", STARTER_DECKS[0]);
  const second = makePlayer("second", "Second", STARTER_DECKS[1]);
  const state = createMatch("VICTOR-STAT", "bo1", [first, second]);
  const firstBakugan = first.bakugan[0];
  const secondBakugan = second.bakugan[0];
  firstBakugan.open = true;
  secondBakugan.open = true;
  firstBakugan.bPower = 1200;
  firstBakugan.damage = 1;
  firstBakugan.character.bPower = 1200;
  firstBakugan.character.damage = 1;
  secondBakugan.bPower = 100;
  secondBakugan.damage = 9;
  secondBakugan.character.bPower = 100;
  secondBakugan.character.damage = 9;
  state.turn = 3;
  state.phase = "power";
  state.startingPlayer = first.id;
  state.priority = first.id;
  state.selected = { [first.id]: firstBakugan.id, [second.id]: secondBakugan.id };
  state.rolls = {
    [first.id]: { result: "intended-core" } as MatchState["rolls"][string],
    [second.id]: { result: "intended-core" } as MatchState["rolls"][string],
  };
  return { state, first, second, firstBakugan, secondBakugan };
}

for (const catalogId of ["bb-104", "bb-210"] as const) {
  test(`${catalogId} makes Damage Rating decide the current Brawl`, () => {
    const { state, first, second } = openBrawl();
    const card = cardInstance(catalogId, "victor");
    const program = compileCardEffect(card);
    const victorRule = program.instructions.find((instruction) => instruction.actions.some((action) => (
      action.kind === "set-rule" && action.rule === "victor-stat"
    )));
    assert.ok(victorRule);
    assert.equal(victorRule.condition.kind, "always");

    const definition = ruleDefinitionForCard(card);
    const ability = definition.abilities.find((candidate) => candidate.kind === "spell")
      ?? definition.abilities.find((candidate) => candidate.kind !== "triggered");
    assert.ok(ability);
    state.batch = [createRuleObject({
      controllerId: first.id,
      card,
      ability,
      kind: "card",
      sourceId: card.id,
    })];

    let next = passPriority(state, first.id);
    next = passPriority(next, second.id);
    assert.equal(next.victorByDamage, true);

    next = passPriority(next, first.id);
    next = passPriority(next, second.id);
    assert.equal(next.phase, "victor");
    assert.equal(next.brawlWinner, second.id);
    assert.match(next.log.at(-1)?.message ?? "", /Damage Rating/);
  });
}

function damageState(defenderId = "defender") {
  const attacker = makePlayer("attacker", "Attacker", STARTER_DECKS[0]);
  const defender = makePlayer(defenderId, defenderId === "training-bot" ? "Training AI" : "Defender", STARTER_DECKS[1]);
  const state = createMatch("CORE-STOP", "bo1", [attacker, defender]);
  const attackingBakugan = attacker.bakugan[0];
  attackingBakugan.open = true;
  state.turn = 4;
  state.phase = "damage";
  state.startingPlayer = attacker.id;
  state.priority = defender.id;
  state.selected = { [attacker.id]: attackingBakugan.id, [defender.id]: defender.bakugan[0].id };
  state.pendingLoser = defender.id;
  state.pendingDamage = 3;
  state.damageOrigin = attackingBakugan.id;
  state.damageFaction = attackingBakugan.faction;
  return { state, attacker, defender, attackingBakugan };
}

function attachCore(state: MatchState, playerId: string, bakuganId: string, coreType: GameCard extends never ? never : (typeof CORES)[number]["type"]) {
  const template = CORES.find((core) => core.type === coreType);
  assert.ok(template, `Missing ${coreType} core`);
  const core = { ...structuredClone(template), id: `${template.id}-${bakuganId}-${state.placements.length}` };
  const cell = `test-core-${state.placements.length}`;
  state.placements.push({ playerId, core, cell, order: state.placements.length + 1, attachedTo: bakuganId });
  const bakugan = state.players.flatMap((player) => player.bakugan).find((candidate) => candidate.id === bakuganId);
  assert.ok(bakugan);
  bakugan.heldCoreCells.push(cell);
}

const CORE_CODE = {
  FT: "Fist",
  FF: "Flaming Fist",
  SD: "Shield",
  MS: "Magic Shield",
  HE: "Helix",
} as const;

const CORE_STOP_IDS = [
  "br-60", "br-61", "br-64", "br-66", "br-67",
  "br-68", "br-71", "br-72", "br-74", "br-76",
];

test("every BakuCore-conditioned Stop Flip checks the attacking Bakugan", () => {
  const cards = CARDS.filter((card) => (
    card.type === "Flip"
    && /\[Stop\]\s+(?:an?|the)\s+Bakugan\s+(?:is\s+)?holding/i.test(card.effect)
  ));
  assert.deepEqual(cards.map((card) => card.catalogId), CORE_STOP_IDS);

  for (const template of cards) {
    const { state, defender, attackingBakugan } = damageState();
    const card = { ...structuredClone(template), id: `${template.catalogId}-revealed` };
    defender.discard = [card];
    state.revealedFlip = card;
    assert.equal(revealedFlipCanBePlayed(state, defender.id, card), false, `${template.catalogId} was legal without its core`);
    assert.equal(flipStopsDamage(state, card), false);

    const code = card.effect.match(/\[(FT|FF|SD|MS|HE)\]/i)?.[1] as keyof typeof CORE_CODE | undefined;
    assert.ok(code);
    attachCore(state, state.players[0].id, attackingBakugan.id, CORE_CODE[code]);
    assert.equal(revealedFlipCanBePlayed(state, defender.id, card), true, `${template.catalogId} rejected its required core`);
    assert.equal(flipStopsDamage(state, card), true);
  }
});

test("an unmet Stop condition disables Play Flip but preserves Skip", () => {
  const { state, defender } = damageState();
  const freeze = cardInstance("br-61", "revealed");
  defender.discard = [freeze];
  state.revealedFlip = freeze;

  const actions = visibleMatchHudActions({
    match: state,
    playerId: defender.id,
    mode: null,
    selectedCardId: "",
    selectionPending: false,
  });
  assert.equal(actions["play-flip"], false);
  assert.equal(actions["skip-flip"], true);
  assert.throws(
    () => resolveManualDamage(state, defender.id, freeze.id),
    /Stop condition is not met/,
  );
});

test("a core-conditioned Stop resolves after its required core is present", () => {
  const { state, attacker, defender, attackingBakugan } = damageState();
  const freeze = cardInstance("br-61", "revealed");
  defender.discard = [freeze];
  state.revealedFlip = freeze;
  attachCore(state, attacker.id, attackingBakugan.id, "Fist");

  let next = resolveManualDamage(state, defender.id, freeze.id);
  assert.equal(next.batch.some((effect) => effect.card.id === freeze.id), true);
  next = passPriority(next, defender.id);
  next = passPriority(next, attacker.id);
  assert.equal(next.pendingDamage, 0);
});

test("faction-conditioned Stop Flips use the same play-legality gate", () => {
  const { state, defender } = damageState();
  const counterAquos = cardInstance("bb-140", "revealed");
  defender.discard = [counterAquos];
  state.revealedFlip = counterAquos;
  state.damageFaction = "Pyrus";
  assert.equal(revealedFlipCanBePlayed(state, defender.id, counterAquos), false);
  state.damageFaction = "Aquos";
  assert.equal(revealedFlipCanBePlayed(state, defender.id, counterAquos), true);
});

test("the Training AI skips a Stop Flip whose condition is not met", () => {
  const { state, defender } = damageState("training-bot");
  const freeze = cardInstance("br-61", "ai-revealed");
  defender.discard = [freeze];
  state.revealedFlip = freeze;
  const next = advanceOpponentAi(state, defender.id);
  assert.ok(next);
  assert.equal(next.revealedFlip, undefined);
  assert.equal(next.batch.some((effect) => effect.card.id === freeze.id), false);
});

test("team-held-core riders are typed instead of resolving unconditionally", () => {
  const twistingInferno = cardInstance("br-47", "audit");
  const instruction = compileCardEffect(twistingInferno).instructions.find((candidate) => (
    /one of your Bakugan are holding/i.test(candidate.sourceText)
  ));
  assert.ok(instruction);
  assert.deepEqual(instruction.condition, {
    kind: "held-core-type",
    coreTypes: ["Fist"],
    subject: "controller-team",
  });

  const { state, attacker, attackingBakugan } = damageState();
  const otherFriendly = attacker.bakugan[1];
  attachCore(state, attacker.id, otherFriendly.id, "Fist");
  assert.equal(ruleConditionActive(state, attacker, instruction.condition, attackingBakugan), true);
});

test("all printed core-condition clauses compile to held-core conditions", () => {
  const conditionalCoreText = /(?:^\s*\[(?:FT|FF|SD|MS|HE)\].*:|\bif\b.*\bholding\b.*\[(?:FT|FF|SD|MS|HE)\]|\[Stop\].*\bholding\b.*\[(?:FT|FF|SD|MS|HE)\])/i;
  const failures = CARDS.flatMap((card) => compileCardEffect(card).instructions
    .filter((instruction) => conditionalCoreText.test(instruction.sourceText) && instruction.condition.kind !== "held-core-type")
    .map((instruction) => `${card.catalogId}: ${instruction.sourceText}`));
  assert.deepEqual(failures, []);
});
''')
          PY
      - name: Install dependencies
        run: npm run install:ci
      - name: Audit affected card families
        shell: bash
        run: |
          node --import tsx --input-type=module - <<'TS'
          import { CARDS } from "./lib/data.ts";
          import { compileCardEffect } from "./lib/rules/effects.ts";
          const coreStops = CARDS.filter((card) => card.type === "Flip" && /\[Stop\].*Bakugan.*holding.*\[(FT|FF|SD|MS|HE)\]/i.test(card.effect));
          const factionStops = CARDS.filter((card) => card.type === "Flip" && /\[Stop\]/i.test(card.effect) && !coreStops.includes(card));
          const coreClauses = CARDS.flatMap((card) => compileCardEffect(card).instructions
            .filter((instruction) => /(?:^\s*\[(FT|FF|SD|MS|HE)\].*:|\bif\b.*\bholding\b.*\[(FT|FF|SD|MS|HE)\]|\[Stop\].*\bholding\b.*\[(FT|FF|SD|MS|HE)\])/i.test(instruction.sourceText))
            .map((instruction) => ({ id: card.catalogId, condition: instruction.condition.kind, text: instruction.sourceText })));
          console.log("Core-conditioned Stop Flips:", coreStops.map((card) => `${card.catalogId} ${card.displayName}`).join(" | "));
          console.log("Other conditional/unconditional Stop Flips audited:", factionStops.length);
          console.log("Typed held-core clauses:", coreClauses.length);
          console.log("Untyped held-core clauses:", coreClauses.filter((item) => item.condition !== "held-core-type"));
          TS
      - name: Run focused regressions
        run: node --import tsx --test tests/victor-core-stop-regressions.test.ts tests/reported-regressions-2026-08-02.test.ts tests/pact-cubbo-regressions.test.ts tests/opponent-ai-tactics.test.ts
      - name: Build application
