name: Agent Desktop Chat Brawl Resize

on:
  push:
    branches:
      - agent/desktop-chat-brawl-resize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-chat-brawl-resize
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply desktop interface refinements
        run: python scripts/agent-desktop-chat-brawl-resize.py
      - name: Run focused communication and Brawl Preview regressions
        run: node --import tsx --test tests/match-communication.test.ts tests/brawl-presentation.test.ts
      - name: Build production application
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/agent-desktop-chat-brawl-resize.py .github/workflows/agent-desktop-chat-brawl-resize.yml
          git add components/game-screen-v2/BrawlExperienceLayer.tsx components/game-screen-v2/BrawlPreviewEnhancements.module.css components/game-screen-v2/MatchCommunicationLayer.module.css components/game-screen-v2/brawlHudPosition.ts tests/match-communication.test.ts tests/brawl-presentation.test.ts
          git commit -m "Refine desktop chat and Brawl Preview"
          git push origin HEAD:agent/desktop-chat-brawl-resize
