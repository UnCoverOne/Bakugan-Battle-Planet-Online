name: Canonical Rules Cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'feature/unified-card-play-pipeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-card-play-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply canonical cleanup
        shell: bash
        run: |
          sed -n "/python <<'PY'/,/^          PY$/p" .github/workflows/generalized-value-expressions-final-validation.yml | sed '1d;$d;s/^          //' > /tmp/migrate.py
          python /tmp/migrate.py
          sed -n "/^          python <<'PY'$/,/^          PY$/p" .github/workflows/gve-debug.yml | sed '1d;$d;s/^          //' > /tmp/fixes.py
          python /tmp/fixes.py
          python <<'PY'
          from pathlib import Path
          import re

          # Catalogue grammar may construct NumberValue expressions, but it must not expose
          # a second "scale" representation alongside the canonical value AST.
          path = Path('lib/rules/catalogue-primitives.ts')
          text = path.read_text()
          text = text.replace('numberValueForScale', 'numberValueForDynamicAmount')
          marker = 'function numberValueForDynamicAmount('
          start = text.find(marker)
          if start < 0:
              raise SystemExit('canonical dynamic-amount helper missing')
          end = text.find('\n}\n\n', start)
          if end < 0:
              raise SystemExit('canonical dynamic-amount helper end missing')
          block = text[start:end + 3]
          block = re.sub(r'\bscale\b', 'dynamicSource', block)
          text = text[:start] + block + text[end + 3:]
          path.write_text(text)

          # Remove the now-dead runtime amount parser/multiplier. Dynamic amounts are
          # compiled to NumberValue and evaluated only by evaluateNumberValue.
          path = Path('lib/game.ts')
          text = path.read_text()
          text, count = re.subn(
              r'\nconst statValues = \(text: string, pattern: RegExp, condition: boolean\) => \{[\s\S]*?\n\};\n\nconst scaleStat = \(state: MatchState, player: PlayerState, text: string, value: number, stat: "power" \| "damage" \| "frost" \| "draw", scale\?: string\) => \{[\s\S]*?\n\};\n',
              '\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('obsolete runtime scaling helpers were not found exactly once')
          path.write_text(text)

          # Remove the deprecated choice-zone ownership alias. Current definitions use owner.
          path = Path('lib/rules/model.ts')
          text = path.read_text()
          text = text.replace('  /** @deprecated Compatibility alias. New definitions should use owner. */\n  targetOwner?: ZoneOwner;\n', '')
          path.write_text(text)

          path = Path('lib/rules/choices.ts')
          text = path.read_text()
          text = text.replace('spec.owner ?? spec.targetOwner ?? "any"', 'spec.owner ?? "any"')
          text = text.replace('spec.owner ?? spec.targetOwner ?? "opponent"', 'spec.owner ?? "opponent"')
          path.write_text(text)

          # Keep the architectural invariant in the permanent rules test suite.
          architecture_test = '''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\n\nconst productionRulesSources = [\n  "../lib/game.ts",\n  "../lib/rules/model.ts",\n  "../lib/rules/primitives.ts",\n  "../lib/rules/catalogue-primitives.ts",\n  "../lib/rules/catalogue-structure.ts",\n  "../lib/rules/costs.ts",\n  "../lib/rules/modifiers.ts",\n].map((path) => readFileSync(new URL(path, import.meta.url), "utf8")).join("\\n");\n\ntest("the rules engine has one canonical dynamic-value representation", () => {\n  assert.doesNotMatch(productionRulesSources, /\\b(?:AmountExpression|AmountCountSource|AmountEvaluationContext|evaluateAmountExpression|amountExpressionForScale|CostScale|printedScaleMultiplier|scaleStat|statValues|targetOwner)\\b/);\n  assert.doesNotMatch(productionRulesSources, /\\b(?:action|modifier)\\.scale\\b|\\bscale\\?:\\s*(?:string|CostScale)/);\n});\n'''
          Path('tests/rules-architecture-cleanup.test.ts').write_text(architecture_test)

          path = Path('package.json')
          text = path.read_text()
          old = 'tests/magnus-ultimate-rival.test.ts\",\n    \"test:gameplay\"'
          new = 'tests/magnus-ultimate-rival.test.ts tests/value-expressions.test.ts tests/dynamic-value-catalogue.test.ts tests/rules-architecture-cleanup.test.ts\",\n    \"test:gameplay\"'
          if old not in text:
              raise SystemExit('test:rules script tail not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: npm ci
      - name: Focused canonical value coverage
        run: npx tsx --test tests/value-expressions.test.ts tests/dynamic-value-catalogue.test.ts tests/rules-architecture-cleanup.test.ts tests/rules-primitives.test.ts tests/card-payment.test.ts tests/card-play-pipeline.test.ts tests/pact-cubbo-regressions.test.ts tests/rules-engine-modernization.test.ts
      - name: Full rules suite
        run: npm run test:rules
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Enforce one canonical numeric implementation
        shell: bash
        run: |
          if grep -R -n -E 'AmountExpression|AmountCountSource|AmountEvaluationContext|amountExpression|evaluateAmountExpression|amountExpressionForScale|CostScale|printedScaleMultiplier|scaleStat|statValues|targetOwner' lib --include='*.ts'; then
            echo 'Legacy rules compatibility implementation remains.' >&2
            exit 1
          fi
          if grep -R -n -E 'scale\?: (string|CostScale)|modifier\.scale|action\.scale' lib/rules lib/game.ts --include='*.ts'; then
            echo 'Legacy numeric scale side channel remains.' >&2
            exit 1
          fi
      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib tests package.json
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
          else
            git commit -m 'refactor: remove legacy rules compatibility paths'
            git push origin HEAD:feature/unified-card-play-pipeline
          fi
