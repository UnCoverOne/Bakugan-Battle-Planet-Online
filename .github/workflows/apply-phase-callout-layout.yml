name: Apply Phase Callout Layout

on:
  push:
    branches:
      - agent/simplify-phase-callout
    paths:
      - scripts/apply-phase-callout-layout.mjs
      - .github/workflows/apply-phase-callout-layout.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplify-phase-callout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply callout layout
        run: node scripts/apply-phase-callout-layout.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run transition presentation regression
        run: node --import tsx --test tests/roll-phase-presentation.test.ts
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git rm -f scripts/apply-phase-callout-layout.mjs .github/workflows/apply-phase-callout-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components tests
          git commit -m "Simplify Phase Transition callout"
          git push origin HEAD:agent/simplify-phase-callout
