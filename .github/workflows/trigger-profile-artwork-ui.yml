name: One-time profile artwork UI trigger

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Trigger original profile artwork UI job'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-original-artwork-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Execute staged profile artwork implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/apply-profile-original-artwork-ui.yml').read_text())
          scripts = [
              step['run']
              for step in workflow['jobs']['apply']['steps']
              if step.get('run')
          ]
          for script in scripts:
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY
