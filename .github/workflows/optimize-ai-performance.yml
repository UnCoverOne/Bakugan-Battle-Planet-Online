name: Optimize AI forecast performance

on:
  push:
    branches:
      - agent/optimize-ai-forecast-performance

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-ai-forecast-performance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply exact AI optimizations
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: {old[:80]!r}; found {text.count(old)}")
              write(path, text.replace(old, new, 1))

          def replace_region(path, start, end, replacement):
              text = read(path)
              left = text.find(start)
              if left < 0:
                  raise SystemExit(f"Missing start marker in {path}: {start!r}")
              right = text.find(end, left)
              if right < 0:
                  raise SystemExit(f"Missing end marker in {path}: {end!r}")
              write(path, text[:left] + replacement + text[right:])

          def replace_in_region(path, start, end, old, new):
              text = read(path)
              left = text.find(start)
              right = text.find(end, left)
              if left < 0 or right < 0:
                  raise SystemExit(f"Missing region in {path}: {start!r} -> {end!r}")
              region = text[left:right]
              if region.count(old) != 1:
                  raise SystemExit(f"Expected one regional match in {path}: {old!r}; found {region.count(old)}")
              region = region.replace(old, new, 1)
              write(path, text[:left] + region + text[right:])

