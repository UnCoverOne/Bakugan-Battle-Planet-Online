const forecastCacheByMatch = new WeakMap<MatchState, MatchForecastCache>();

function matchForecastCache(match: MatchState) {
  let cache = forecastCacheByMatch.get(match);
  if (!cache) {
    cache = { rolls: new Map(), best: new Map() };
