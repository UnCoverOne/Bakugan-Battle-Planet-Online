name: Agent AI Reservation Debug

on:
  push:
    branches:
      - agent/ai-energy-reservation
    paths-ignore:
      - .github/ai-reservation-debug-output.txt

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-energy-reservation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate diagnostic build
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent-ai-energy-reservation.py')
          text = path.read_text()
          text = text.replace('          5.5\n', '          7.5\n', 1)
          text = text.replace(
              '  const likelihood = futurePlayLikelihood(match, playerId, card, choices, "hand");\n',
              '''  const likelihood = /\\b(?:Flow|Fury|Turbo|Domination|Victor)\\b|\\bif\\b/i.test(card.effect)\n    ? 0.65\n    : 1;\n''',
              1,
          )
          path.write_text(text)
          PY
          python scripts/agent-ai-energy-reservation.py
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/opponentAiBase.ts')
          text = path.read_text()
          text = text.replace(
              '  if (budget <= 0 || !forecast.own || !forecast.opponent) return 0;\n',
              '''  console.log("AI_CONT_START", { budget, own: Boolean(forecast.own), opponent: Boolean(forecast.opponent), selected: match.selected });
  if (budget <= 0 || !forecast.own || !forecast.opponent) return 0;
''',
              1,
          )
          text = text.replace(
              '  if (!options.length) return 0;\n',
              '''  console.log("AI_CONT_OPTIONS", options);
  if (!options.length) return 0;
''',
              1,
          )
          path.write_text(text)
          PY
      - name: Capture focused diagnostics
        run: |
          set +e
          node --import tsx --test tests/opponent-ai-tactics.test.ts > .github/ai-reservation-debug-output.txt 2>&1
          exit 0
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ai-reservation-debug-output.txt
          git commit -m "Record AI reservation diagnostics" || exit 0
          git push origin HEAD:agent/ai-energy-reservation
