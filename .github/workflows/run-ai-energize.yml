name: Run AI energize planner implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply AI energize changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/implement-ai-energize.yml').read_text()
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          script = script.replace(
          """old_advance = '''  if (input.phase === \"energize\" && !player.energizedThisTurn) {
            return energizeCard(input, playerId, bestEnergyCard(input, playerId)?.id);
          }'''""",
          """old_advance = '''  if (input.phase === \"energize\" && !player.energizedThisTurn) {
              return energizeCard(input, playerId, bestEnergyCard(input, playerId)?.id);
            }'''""",
          )
          script = script.replace(
          """new_advance = '''  if (input.phase === \"energize\" && !player.energizedThisTurn) {
            const plan = planOpponentEnergize(input, playerId);
            return energizeCard(input, playerId, plan.shouldEnergize ? plan.cardId : undefined);
          }'''""",
          """new_advance = '''  if (input.phase === \"energize\" && !player.energizedThisTurn) {
              const plan = planOpponentEnergize(input, playerId);
              return energizeCard(input, playerId, plan.shouldEnergize ? plan.cardId : undefined);
            }'''""",
          )
          script = script.replace(
          """old_limit = '''    const cards = [...player.hand].sort(
              (a, b) => futureCardValue(input, playerId, a) - futureCardValue(input, playerId, b),
            ).slice(0, amount);'''""",
          """old_limit = '''    const cards = [...player.hand].sort(
                (a, b) => futureCardValue(input, playerId, a) - futureCardValue(input, playerId, b),
              ).slice(0, amount);'''""",
          )
          script = script.replace(
          """new_limit = '''    const cards = [...player.hand].sort(
              (a, b) => handCardRetentionValue(input, playerId, a)
                - handCardRetentionValue(input, playerId, b),
            ).slice(0, amount);'''""",
          """new_limit = '''    const cards = [...player.hand].sort(
                (a, b) => handCardRetentionValue(input, playerId, a)
                  - handCardRetentionValue(input, playerId, b),
              ).slice(0, amount);'''""",
          )
          exec(compile(script, 'implement-ai-energize.py', 'exec'))
          PY
      - name: Install dependencies
        run: npm run install:ci
      - name: Run focused AI regressions
        run: node --import tsx --test tests/ai-energize-planner.test.ts tests/opponent-ai-tactics.test.ts tests/pact-cubbo-regressions.test.ts
      - name: Build application
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "UnCoverOne"
          git config user.email "291861529+UnCoverOne@users.noreply.github.com"
          git rm .github/workflows/implement-ai-energize.yml
          git rm .github/workflows/run-ai-energize.yml
          git add lib/opponentAiBase.ts tests/ai-energize-planner.test.ts package.json
          git commit -m "Improve AI Energize planning"
          git push origin HEAD:${{ github.head_ref }}
