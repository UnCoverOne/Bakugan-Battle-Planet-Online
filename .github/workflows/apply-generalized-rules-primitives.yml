name: Apply generalized rules primitives

on:
  push:
    branches:
      - feature/generalized-rules-primitives
    paths:
      - scripts/apply-generalized-rules-primitives.py
      - .github/workflows/apply-generalized-rules-primitives.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generalized-rules-primitives
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python3 scripts/apply-generalized-rules-primitives.py
      - name: Targeted primitive tests
        run: node --import tsx --test tests/rules-primitives.test.ts tests/turn-draw-mechanic.test.ts tests/bakucore-choice-regressions.test.ts
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit implementation
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/rules/primitives.ts lib/rules/model.ts lib/rules/objects.ts lib/rules/choices.ts lib/rules/catalogue-structure.ts lib/rules/catalogue-primitives.ts lib/rules/index.ts lib/game.ts tests/rules-primitives.test.ts package.json
          git commit -m "Implement generalized rules primitives"
          git push origin HEAD:feature/generalized-rules-primitives
# retrigger after workflow exists on branch
