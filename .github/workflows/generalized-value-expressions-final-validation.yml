name: Dynamic Value Migration Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feature/unified-card-play-pipeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-card-play-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print remaining card definitions and runtime context
        shell: bash
        run: |
          npx tsx -e 'import { CARDS } from "./lib/data"; import { ruleDefinitionForCard } from "./lib/rules/catalogue"; for (const card of CARDS.filter(c => c.number === 152 || ["aa-75","aa-106","br-201","bb-207"].includes(c.catalogId))) { console.log("===CARD===", card.catalogId, card.number, card.name, JSON.stringify(card.effect)); console.log(JSON.stringify(ruleDefinitionForCard(card), null, 2)); }'
          echo '=== STAGE CARD PLAY ==='
          sed -n '1480,1660p' lib/game.ts
          echo '=== CHOICE COMPILER START ==='
          sed -n '200,380p' lib/rules/catalogue-structure.ts
          echo '=== COST COMPILER ==='
          sed -n '440,560p' lib/rules/catalogue-structure.ts
          echo '=== AI PENDING CHOICE ==='
          grep -n -B 10 -A 35 'runTrainingAiStep\|pendingChoice' lib/ai*.ts lib/game.ts | tail -n 500 || true
