name: Dynamic Value Migration Audit

on:
  push:
    branches: [feature/unified-card-play-pipeline]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy dynamic-value references
        shell: bash
        run: |
          echo '=== LEGACY REFERENCES ==='
          git grep -n -E 'AmountExpression|amountExpression|amountExpressionForScale|evaluateAmountExpression' -- lib tests || true
          echo '=== SCALE REFERENCES ==='
          git grep -n -E '\bscale\b' -- lib/rules tests | head -300 || true
          echo '=== NUMBER VALUE REFERENCES ==='
          git grep -n -E 'NumberValue|evaluateNumberValue' -- lib/rules tests | head -500 || true
          echo '=== END AUDIT ==='
