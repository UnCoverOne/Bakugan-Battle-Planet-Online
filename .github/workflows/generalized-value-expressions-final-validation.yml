name: Complete Dynamic Value Migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  complete:
    if: github.head_ref == 'feature/unified-card-play-pipeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-card-play-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove compatibility paths and finish canonical value migration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing expected text for {label}")
              return text.replace(old, new, 1)

          # primitives.ts: ownership primitives only; dynamic numbers live exclusively in values.ts.
          path = 'lib/rules/primitives.ts'
          text = read(path)
          text = replace_once(text, 'import type { CardChoices, Faction, MatchState } from "../game";\nimport {\n  evaluateNumberValue,\n  type NumberExpression,\n  type ValueCountSource,\n} from "./values";\n', 'import type { CardChoices, MatchState } from "../game";\n', 'primitives imports')
          text, count = re.subn(r'/\*\* @deprecated Use ValueCountSource[\s\S]*?\n}\n\nexport function playerScopeForText', 'export function playerScopeForText', text, count=1)
          if count != 1: raise SystemExit('failed to remove AmountExpression compatibility block')
          write(path, text)

          # model.ts: one NumberValue field per numeric slot; no parallel amount/scale representation.
          path = 'lib/rules/model.ts'
          text = read(path)
          text = replace_once(text, 'import type { AmountExpression, ChooserOwner, PlayerScope, ZoneOwner } from "./primitives";', 'import type { ChooserOwner, PlayerScope, ZoneOwner } from "./primitives";', 'model primitive import')
          text = text.replace('export type CostScale = "cards-played-this-turn" | "held-bakucore";\n\n', '')
          text = text.replace('appliesTo?: "self" | "controller"; scale?: CostScale }', 'appliesTo?: "self" | "controller" }')
          text = text.replace('amount: NumberValue; amountExpression?: AmountExpression; scale?: string; duration:', 'amount: NumberValue; duration:')
          text = text.replace('amount: NumberValue; amountExpression?: AmountExpression; scale?: string; playerScope?:', 'amount: NumberValue; playerScope?:')
          text = text.replace('amount: NumberValue; amountExpression?: AmountExpression; minimum:', 'amount: NumberValue; minimum:')
          write(path, text)

          # catalogue-primitives.ts: compile printed scaling grammar straight into NumberValue.
          path = 'lib/rules/catalogue-primitives.ts'
          text = read(path)
          text = replace_once(text, 'import { amountExpressionForScale, playerScopeForText } from "./primitives";\n', 'import { playerScopeForText } from "./primitives";\nimport type { NumberValue } from "./values";\n', 'catalogue primitive imports')
          marker = 'export function parseAtomicEffects(card: GameCard, text: string): RuleAction[] {'
          helper = r'''const multiplyValue = (baseAmount: number, factor: NumberValue): NumberValue => ({
  kind: "product",
  factors: [baseAmount, factor],
});

function numberValueForScale(text: string, baseAmount: number, scale?: string): NumberValue {
  if (!scale) return baseAmount;
  const grammar = `${scale} ${text}`;
  if (/sacrificed-card|sacrifice/i.test(scale)) {
    return multiplyValue(baseAmount, { kind: "choice-count", choiceId: "discardCardIds" });
  }
  if (/other-card-played/i.test(scale) || /other card.*played this turn/i.test(grammar)) {
    return multiplyValue(baseAmount, { kind: "count", source: "cards-played", owner: "controller", offset: -1, minimum: 0 });
  }
  const faction = grammar.match(/\[(Aquos|Pyrus|Darkus|Haos|Ventus|Aurelus)\]\s+Bakugan/i)?.[1] as Faction | undefined;
  if (faction && /Bakugan on your team/i.test(grammar)) {
    return multiplyValue(baseAmount, { kind: "count", source: "bakugan", owner: "controller", faction });
  }
  if (/Flip card.*discard/i.test(grammar)) return multiplyValue(baseAmount, { kind: "count", source: "discard", owner: "controller", cardType: "Flip" });
  if (/Hero(?: card)?s? (?:you )?(?:have|control)?\s*in play|Hero you have in play/i.test(grammar)) return multiplyValue(baseAmount, { kind: "count", source: "hero", owner: "controller" });
  if (/Energy card.*you have|Energy cards? in play/i.test(grammar)) return multiplyValue(baseAmount, { kind: "count", source: "energy", owner: "controller" });
  if (/BakuCore.*your Bakugan hold/i.test(grammar)) return multiplyValue(baseAmount, { kind: "count", source: "held-bakucore", owner: "controller" });
  if (/open Bakugan/i.test(grammar)) return multiplyValue(baseAmount, { kind: "count", source: "open-bakugan", owner: "controller" });
  if (/cards? (?:you have )?played this turn/i.test(grammar)) return multiplyValue(baseAmount, { kind: "count", source: "cards-played", owner: "controller" });
  if (/different factions?.*played this turn/i.test(grammar)) return multiplyValue(baseAmount, { kind: "count", source: "factions-played", owner: "controller" });
  return baseAmount;
}

'''
          if marker not in text: raise SystemExit('parseAtomicEffects marker missing')
          text = text.replace(marker, helper + marker, 1)
          text = replace_once(text,
              '      amount: amountExpressionForScale(text, Number(match[1]), scaleForStat(text, match)) ?? Number(match[1]),\n      scale: amountExpressionForScale(text, Number(match[1]), scaleForStat(text, match)) ? undefined : scaleForStat(text, match),',
              '      amount: numberValueForScale(text, Number(match[1]), scaleForStat(text, match)),', 'power scale')
          text = replace_once(text,
              '      amount: amountExpressionForScale(text, Number(match[1]), scaleForStat(text, match)) ?? Number(match[1]),\n      scale: amountExpressionForScale(text, Number(match[1]), scaleForStat(text, match)) ? undefined : scaleForStat(text, match),',
              '      amount: numberValueForScale(text, Number(match[1]), scaleForStat(text, match)),', 'damage scale')
          text = replace_once(text,
              '    actions.push({ kind: "modify-stat", stat: "frost", amount: amountExpressionForScale(text, Number(match[1]), frostScale) ?? Number(match[1]), scale: amountExpressionForScale(text, Number(match[1]), frostScale) ? undefined : frostScale, duration, scope });',
              '    actions.push({ kind: "modify-stat", stat: "frost", amount: numberValueForScale(text, Number(match[1]), frostScale), duration, scope });', 'frost scale')
          text = replace_once(text,
              '        : amountExpressionForScale(text, fixedAmount, scale) ?? fixedAmount,\n      scale: /^x$/i.test(draw[1]) || amountExpressionForScale(text, fixedAmount, scale) ? undefined : scale,',
              '        : numberValueForScale(text, fixedAmount, scale),', 'draw scale')
          text = replace_once(text,
              '  if (generatedEnergy) actions.push({ kind: "generate-energy", amount: amountExpressionForScale(text, Number(generatedEnergy[1]), scale) ?? Number(generatedEnergy[1]), scale: amountExpressionForScale(text, Number(generatedEnergy[1]), scale) ? undefined : scale, playerScope: playerScopeForText(text) });',
              '  if (generatedEnergy) actions.push({ kind: "generate-energy", amount: numberValueForScale(text, Number(generatedEnergy[1]), scale), playerScope: playerScopeForText(text) });', 'energy scale')
          write(path, text)

          # game.ts: execute every numeric action through resolveNumber/evaluateNumberValue exactly once.
          path = 'lib/game.ts'
          text = read(path)
          text = replace_once(text, 'import { evaluateAmountExpression, playerIdsForScope, zoneOwnerIdsFor } from "./rules/primitives";', 'import { playerIdsForScope, zoneOwnerIdsFor } from "./rules/primitives";', 'game primitive import')
          text = replace_once(text,
              '      const baseAmount = resolveNumber(action.amount);\n      let amount = action.amountExpression\n        ? evaluateAmountExpression(state, action.amountExpression, { controllerId, choices, chosenPlayerId: choices.targetPlayerId })\n        : action.scale ? scaleStat(state, player, text, baseAmount, action.stat, action.scale) : baseAmount;\n      if (!action.amountExpression && action.scale === "sacrificed-card") amount *= choices.discardCardIds?.length ?? 0;',
              '      const amount = resolveNumber(action.amount);', 'modify-stat execution')
          text = replace_once(text,
              '      const baseAmount = resolveNumber(action.amount);\n      const amount = Math.max(0, Math.floor(action.amountExpression\n        ? evaluateAmountExpression(state, action.amountExpression, { controllerId, choices, chosenPlayerId: choices.targetPlayerId })\n        : action.scale ? scaleStat(state, player, text, baseAmount, "draw", action.scale) : baseAmount));',
              '      const amount = Math.max(0, Math.floor(resolveNumber(action.amount)));', 'draw execution')
          text = replace_once(text,
              '        const expressionAmount = action.amountExpression\n          ? Math.max(0, Math.floor(evaluateAmountExpression(state, action.amountExpression, { controllerId, chooserId: affectedId, chosenPlayerId: affectedId, choices: scopedChoices })))\n          : Math.max(0, Math.floor(resolveNumber(action.amount, scopedChoices, affectedId)));',
              '        const expressionAmount = Math.max(0, Math.floor(resolveNumber(action.amount, scopedChoices, affectedId)));', 'discard execution')
          text = replace_once(text,
              '        const amount = action.amountExpression\n          ? evaluateAmountExpression(state, action.amountExpression, { controllerId, chooserId: recipientId, chosenPlayerId: recipientId, choices })\n          : action.scale ? scaleStat(state, player, text, resolveNumber(action.amount, choices, recipientId), "draw", action.scale) : resolveNumber(action.amount, choices, recipientId);',
              '        const amount = resolveNumber(action.amount, choices, recipientId);', 'energy execution')
          text = text.replace('const amount = Math.max(0, Math.floor(resolveNumber(amount)));', 'const amount = Math.max(0, Math.floor(resolveNumber(action.amount)));')
          write(path, text)

          # modifiers.ts: continuous dynamic values stay live instead of being pre-scaled/frozen.
          path = 'lib/rules/modifiers.ts'
          text = read(path)
          text, count = re.subn(r'function printedScaleMultiplier\([\s\S]*?\n}\n\nfunction printedTarget', 'function printedTarget', text, count=1)
          if count != 1: raise SystemExit('printedScaleMultiplier block missing')
          old = '''    amount: action.kind === "grant-keyword"\n      ? evaluateNumberValue(state, action.value ?? 1, { controllerId: player.id, choices: { targetBakuganId: bakugan.id }, moment: "continuous" })\n      : evaluateNumberValue(state, action.amount, { controllerId: player.id, choices: { targetBakuganId: bakugan.id }, moment: "continuous" }) * printedScaleMultiplier(action.scale, player),'''
          new = '''    amount: action.kind === "grant-keyword" ? action.value ?? 1 : action.amount,\n    choices: { targetBakuganId: bakugan.id },'''
          text = replace_once(text, old, new, 'continuous modifier amount')
          write(path, text)

          # Cost reductions compile their multiplier into the same NumberValue AST.
          path = 'lib/rules/catalogue-structure.ts'
          text = read(path)
          pattern = r'function reductionScaleFor\([\s\S]*?\n}\n\nfunction reductionAmountFor\(text: string, amount: number\): CostEffect extends infer _ \? import\("\./values"\)\.NumberValue : never \{[\s\S]*?\n}\n'
          replacement = '''function reductionAmountFor(text: string, amount: number): import("./values").NumberValue {\n  if (/for each card you (?:have )?played this turn/i.test(text)) return { kind: "product", factors: [amount, { kind: "count", source: "cards-played", owner: "controller" }] };\n  if (/for each BakuCore that your Bakugan hold/i.test(text)) return { kind: "product", factors: [amount, { kind: "count", source: "held-bakucore", owner: "controller" }] };\n  return amount;\n}\n'''
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1: raise SystemExit('cost reduction scale block missing')
          write(path, text)

          path = 'lib/rules/costs.ts'
          text = read(path)
          old = '''    if (modifier.kind === "cost-reduce") {\n      const variableMultiplier = modifier.scale === "cards-played-this-turn"\n        ? Math.max(0, player.cardsPlayedThisTurn)\n        : modifier.scale === "held-bakucore"\n          ? player.bakugan.reduce((sum, bakugan) => sum + bakugan.heldCoreCells.length, 0)\n          : 1;\n      reductions += costValue(state, playerId, modifier.amount, choices, context.capturedValues) * variableMultiplier;\n    }'''
          new = '''    if (modifier.kind === "cost-reduce") {\n      reductions += costValue(state, playerId, modifier.amount, choices, context.capturedValues);\n    }'''
          text = replace_once(text, old, new, 'cost reduction execution')
          write(path, text)

          # Tests use only the canonical public value API.
          path = 'tests/rules-primitives.test.ts'
          text = read(path)
          text = text.replace('  evaluateAmountExpression,\n', '').replace('  type AmountExpression,\n', '')
          text = text.replace('import { evaluateNumberValue } from "../lib/rules/values";', 'import { evaluateNumberValue, type NumberExpression } from "../lib/rules/values";')
          pattern = r'test\("dynamic amount expressions evaluate typed counts and arithmetic", \(\) => \{[\s\S]*?\n\}\);'
          replacement = '''test("dynamic number expressions evaluate typed counts and arithmetic", () => {\n  const state = stateWithPlayers();\n  state.players[0].heroes = [instance(CARDS.find((card) => card.type === "Hero")!, "hero-a"), instance(CARDS.find((card) => card.type === "Hero")!, "hero-b")];\n  const expression: NumberExpression = {\n    kind: "product",\n    factors: [100, { kind: "count", source: "hero", owner: "controller" }],\n  };\n  assert.equal(evaluateNumberValue(state, expression, { controllerId: "first" }), 200);\n  assert.equal(evaluateNumberValue(state, { kind: "choice-value", choiceId: "xValue" }, { controllerId: "first", choices: { xValue: 4 } }), 4);\n});'''
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1: raise SystemExit('legacy primitive value test missing')
          write(path, text)

          path = 'tests/value-expressions.test.ts'
          text = read(path).replace('  assert.equal(action.amountExpression, undefined);\n', '')
          write(path, text)

          path = 'tests/rules-engine-modernization.test.ts'
          text = read(path)
          old = '''    amount: 2,\n    duration: "instant",\n    condition: { kind: "always" },\n    appliesTo: "self",\n    scale: "cards-played-this-turn",'''
          new = '''    amount: { kind: "product", factors: [2, { kind: "count", source: "cards-played", owner: "controller" }] },\n    duration: "instant",\n    condition: { kind: "always" },\n    appliesTo: "self",'''
          text = replace_once(text, old, new, 'Everett dynamic reduction expectation')
          write(path, text)

          # Catalogue-wide audit: every serialized NumberExpression on every card must be evaluable and finite.
          Path('tests/dynamic-value-catalogue.test.ts').write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import { CARDS, STARTER_DECKS, makePlayer } from "../lib/data";
          import { createMatch } from "../lib/game";
          import { ruleDefinitionForCard } from "../lib/rules/catalogue";
          import { evaluateNumberValue, type NumberExpression } from "../lib/rules/values";

          const countSources = new Set(["hand", "deck", "discard", "energy", "hero", "bakugan", "open-bakugan", "held-bakucore", "cards-played", "factions-played"]);
          const unaryKinds = new Set(["floor", "ceil", "absolute", "negate"]);

          function isNumberExpression(value: unknown): value is NumberExpression {
            if (!value || typeof value !== "object" || Array.isArray(value)) return false;
            const node = value as Record<string, unknown>;
            switch (node.kind) {
              case "constant": return typeof node.value === "number";
              case "choice-value": case "choice-count": return typeof node.choiceId === "string";
              case "count": return typeof node.source === "string" && countSources.has(node.source);
              case "property": return Boolean(node.subject) && typeof node.property === "string";
              case "event-value": return node.property === "amount";
              case "sum": return Array.isArray(node.terms);
              case "subtract": return "left" in node && "right" in node;
              case "product": return Array.isArray(node.factors);
              case "divide": return "numerator" in node && "denominator" in node;
              case "minimum": case "maximum": return Array.isArray(node.values);
              case "clamp": return "value" in node;
              case "conditional": return !Array.isArray(node.whenTrue) && "whenTrue" in node && "whenFalse" in node;
              case "captured": return typeof node.key === "string" && typeof node.at === "string" && "value" in node;
              default: return typeof node.kind === "string" && unaryKinds.has(node.kind) && "value" in node;
            }
          }

          function expressionsIn(value: unknown, found: NumberExpression[] = []): NumberExpression[] {
            if (isNumberExpression(value)) found.push(value);
            if (Array.isArray(value)) value.forEach((item) => expressionsIn(item, found));
            else if (value && typeof value === "object") Object.values(value as Record<string, unknown>).forEach((item) => expressionsIn(item, found));
            return found;
          }

          test("every card using generalized numeric values serializes without legacy paths and evaluates finitely", () => {
            const state = createMatch("VALUE-CATALOGUE", "bo1", [
              makePlayer("first", "First", STARTER_DECKS[0]),
              makePlayer("second", "Second", STARTER_DECKS[1]),
            ]);
            state.players[0].cardsPlayedThisTurn = 3;
            state.players[0].factionsPlayedThisTurn = ["Aquos", "Pyrus", "Darkus"];
            state.players[0].heroes = CARDS.filter((card) => card.type === "Hero").slice(0, 2).map((card, index) => ({ ...card, id: `audit-hero-${index}` }));
            state.players[0].discard = CARDS.slice(0, 4).map((card, index) => ({ ...card, id: `audit-discard-${index}` }));

            let cardsWithExpressions = 0;
            let evaluated = 0;
            for (const card of CARDS) {
              const definition = ruleDefinitionForCard(card);
              const serialized = JSON.stringify(definition);
              assert.equal(serialized.includes("amountExpression"), false, `${card.catalogId} still serializes amountExpression`);
              assert.equal(/\"scale\"\s*:/.test(serialized), false, `${card.catalogId} still serializes a numeric scale side channel`);
              const expressions = expressionsIn(definition);
              if (expressions.length) cardsWithExpressions += 1;
              for (const expression of expressions) {
                const value = evaluateNumberValue(state, expression, {
                  controllerId: "first",
                  chooserId: "first",
                  choices: { xValue: 2, discardCardIds: ["audit-discard-0", "audit-discard-1"] },
                  sourceCardId: card.id,
                  moment: "resolve",
                  event: { amount: 5 },
                });
                assert.equal(Number.isFinite(value), true, `${card.catalogId} produced a non-finite value`);
                evaluated += 1;
              }
            }
            assert.ok(cardsWithExpressions > 0, "catalogue should contain cards using generalized numeric expressions");
            assert.ok(evaluated > 0, "catalogue audit should evaluate serialized numeric expressions");
          });
          '''.replace(/^          /gm, ''))
          PY
      - run: npm ci
      - name: Focused generalized-value and card-play coverage
        run: npx tsx --test tests/value-expressions.test.ts tests/dynamic-value-catalogue.test.ts tests/rules-primitives.test.ts tests/card-payment.test.ts tests/card-play-pipeline.test.ts tests/pact-cubbo-regressions.test.ts tests/rules-engine-modernization.test.ts
      - name: Full rules suite
        run: npm run test:rules
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Enforce one canonical numeric value path
        shell: bash
        run: |
          if git grep -n -E 'AmountExpression|amountExpression|amountExpressionForScale|evaluateAmountExpression' -- lib tests; then
            echo 'Legacy amount-expression compatibility path remains.' >&2
            exit 1
          fi
          if git grep -n -E 'printedScaleMultiplier|modifier\.scale|action\.scale|scale\?: CostScale' -- lib tests; then
            echo 'Legacy numeric scale execution path remains.' >&2
            exit 1
          fi
      - name: Commit validated migration
        shell: bash
        run: |
          rm .github/workflows/generalized-value-expressions-final-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: complete generalized dynamic value system'
          git push origin HEAD:feature/unified-card-play-pipeline
