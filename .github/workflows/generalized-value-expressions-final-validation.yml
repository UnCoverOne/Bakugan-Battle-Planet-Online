name: Dynamic Value Migration Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remaining migration context
        shell: bash
        run: |
          echo '=== GAME IMPORTS ==='; sed -n '1,45p' lib/game.ts
          echo '=== SCALESTAT ==='; grep -n -B 8 -A 45 'function scaleStat' lib/game.ts || true
          echo '=== RESOLVENUMBER ==='; grep -n -B 8 -A 35 'const resolveNumber\|function resolveNumber' lib/game.ts || true
          echo '=== COST SCALE TESTS ==='; grep -n -B 15 -A 25 'scale: "cards-played-this-turn"\|scale: "held-bakucore"' tests/*.test.ts || true
