name: Dynamic Value Migration Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migration source context
        shell: bash
        run: |
          for spec in \
            'lib/rules/primitives.ts:80:180' \
            'lib/game.ts:2180:2350' \
            'lib/rules/catalogue-primitives.ts:1:320' \
            'lib/rules/modifiers.ts:150:240' \
            'lib/rules/costs.ts:75:120' \
            'lib/rules/catalogue-structure.ts:440:480' \
            'tests/rules-primitives.test.ts:1:140' \
            'tests/value-expressions.test.ts:1:180'; do
            file=${spec%%:*}; rest=${spec#*:}; start=${rest%%:*}; end=${rest##*:}
            echo "=== $file $start-$end ==="
            sed -n "${start},${end}p" "$file"
          done
