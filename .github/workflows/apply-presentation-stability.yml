name: Apply presentation stability improvements

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply presentation stability changes
        run: python3 scripts/apply-presentation-stability.py
      - name: Install dependencies
        run: npm run install:ci
      - name: Run focused presentation regressions
        run: >-
          node --import tsx --test
          tests/presentation-stability.test.ts
          tests/deck-interaction-animation.test.ts
          tests/game-screen-state.test.ts
          tests/brawl-presentation.test.ts
          tests/roll-phase-presentation.test.ts
          tests/tie-break-hud-victor-highlight.test.ts
          tests/mobile-overlay-layering.test.ts
          tests/card-preview-interactions.test.ts
      - name: Build application
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "UnCoverOne"
          git config user.email "291861529+UnCoverOne@users.noreply.github.com"
          git rm scripts/apply-presentation-stability.py
          git rm .github/workflows/apply-presentation-stability.yml
          git add components tests package.json
          git commit -m "Stabilize gameplay animations and transitions"
          git push origin HEAD:${{ github.head_ref }}
