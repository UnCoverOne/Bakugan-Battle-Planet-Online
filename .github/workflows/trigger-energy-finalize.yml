name: Trigger Energy model validation

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.issue.title == 'chatgpt-energy-production-final-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture base
        shell: bash
        run: |
          git fetch origin main
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Apply Energy model
        shell: bash
        run: |
          set -o pipefail
          python <<'PY' 2>&1 | tee energy-apply.log
          from pathlib import Path
          import re
          workflow = Path('.github/workflows/finalize-energy-production.yml').read_text()
          match = re.search(r"          python <<'PY'\n(.*?)\n          PY\n", workflow, re.S)
          if not match:
              raise SystemExit('Could not extract Energy patch script')
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in match.group(1).splitlines()
          )
          script = script.replace(
              'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)',
              'updated, count = re.subn(pattern, replacement if callable(replacement) else lambda _m: replacement, text, count=1, flags=flags)',
          )
          script = script.replace(
              'text, count = pattern.subn(replacement, text, count=1)',
              'text, count = pattern.subn(lambda _m: replacement, text, count=1)',
          ).replace(
              'text, count = recharge_pattern.subn(recharge_replacement, text, count=1)',
              'text, count = recharge_pattern.subn(lambda _m: recharge_replacement, text, count=1)',
          ).replace(
              'text, count = payment_pattern.subn(payment_replacement, text, count=1)',
              'text, count = payment_pattern.subn(lambda _m: payment_replacement, text, count=1)',
          )
          exec(compile(script, 'energy-production-patch.py', 'exec'), {})

          # Keep Energy Drain's recharge-prevention sentence in the same typed instruction.
          path = Path('lib/rules/catalogue-structure.ts')
          text = path.read_text()
          old = 'normalized.split(/(?<=\\.)\\s+/)'
          new = 'normalized.split(/(?<=\\.)\\s+(?!They do not recharge at the end of the turn\\.)/i)'
          if text.count(old) != 1:
              raise SystemExit('Could not patch Energy Drain instruction grouping')
          path.write_text(text.replace(old, new, 1))

          # Focused test cards must keep reviewed catalogue text while selecting a printed cost.
          path = Path('tests/energy-production-model.test.ts')
          text = path.read_text()
          old = '''function actionCard(cost: number): GameCard {
  const source = CARDS.find((card) => card.type === "Action" && card.cost !== "X");
  assert.ok(source);
  return { ...source, id: `energy-action-${cost}`, cost };
}'''
          new = '''function actionCard(cost: number): GameCard {
  const source = CARDS.find((card) => card.type === "Action" && card.cost === cost);
  assert.ok(source, `Missing Action card with printed cost ${cost}`);
  return { ...source, id: `energy-action-${cost}` };
}'''
          if text.count(old) != 1:
              raise SystemExit('Could not patch Energy test card fixture')
          path.write_text(text.replace(old, new, 1))

          # Update the pre-existing presentation regression to the authoritative payment-only Energy ability.
          path = Path('tests/game-screen-state.test.ts')
          text = path.read_text()
          import_anchor = 'import { energizeTransitions } from "../components/game-screen-v2/energizeAnimationState";\n'
          if import_anchor not in text:
              raise SystemExit('Could not locate game-screen Energy test imports')
          text = text.replace(import_anchor, import_anchor + 'import { beginCardPayment } from "../lib/rules/costs";\n', 1)
          old_setup = '''  const energyCard = player.hand.shift();
  assert.ok(energyCard);
  player.energyZone.push(energyCard);
  setPhysicalEnergy(player, 1);
  player.energy = 1;

  const match = createMatch("ENERGY", "bo1", [player, opponent]);
  match.turn = 1;
  match.phase = "power";
'''
          new_setup = '''  const energyCard = player.hand.shift();
  assert.ok(energyCard);
  player.energyZone = [energyCard];
  player.energy = 0;
  const paymentSource = CARDS.find((card) => card.type === "Action" && card.cost === 1);
  assert.ok(paymentSource);
  const paymentCard = { ...paymentSource, id: "energy-payment-card" };
  player.hand.push(paymentCard);

  const match = createMatch("ENERGY", "bo1", [player, opponent]);
  match.turn = 1;
  match.phase = "power";
  match.priority = player.id;
  beginCardPayment(match, player.id, paymentCard);
'''
          if text.count(old_setup) != 1:
              raise SystemExit('Could not patch game-screen Energy setup')
          text = text.replace(old_setup, new_setup, 1)
          text = text.replace('assert.match(tapped.log.at(-1)?.message ?? "", /generated 1 Energy/);', 'assert.match(tapped.log.at(-1)?.message ?? "", /uncharged an Energy card/);', 1)
          text = text.replace('/already tapped/,', '/already uncharged/,', 1)
          old_phase = '''
  const startStep = structuredClone(match);
  startStep.phase = "energize";
  assert.equal(energyCardCanTap(startStep, player.id, energyCard.id), false);
  assert.throws(
    () => tapEnergyCard(startStep, player.id, energyCard.id),
    /cannot be tapped during this phase/,
  );
'''
          if text.count(old_phase) != 1:
              raise SystemExit('Could not remove obsolete speculative Energy phase assertion')
          text = text.replace(old_phase, '\n', 1)
          old_float = '  assert.equal(roomy.spanDegrees, handFanSpanDegrees(40));\n'
          new_float = '  assert.ok(Math.abs(roomy.spanDegrees - handFanSpanDegrees(40)) < 1e-9);\n'
          if text.count(old_float) != 1:
              raise SystemExit('Could not stabilize hand-fan floating-point assertion')
          text = text.replace(old_float, new_float, 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Targeted Energy tests
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test \
            tests/energy-production-model.test.ts \
            tests/card-payment.test.ts \
            tests/energy-count-source.test.ts \
            tests/recharge-and-dark-waters.test.ts \
            tests/turn-to-energy-chain.test.ts \
            tests/game-screen-state.test.ts \
            tests/content-pipeline.test.ts \
            tests/rules-engine-modernization.test.ts 2>&1 | tee energy-targeted.log
      - name: Rules suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee energy-rules.log
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee energy-lint.log
      - name: Full test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee energy-full-test.log
      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee energy-build.log
      - name: Diff check
        run: git diff --check
      - name: Commit validated implementation
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "main moved during validation; refusing to overwrite concurrent work."
            exit 1
          fi
          rm -f .github/workflows/finalize-energy-production.yml .github/workflows/trigger-energy-finalize.yml .github/energy-finalize-trigger.txt
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add -A \
            lib/rules/model.ts \
            lib/rules/costs.ts \
            lib/energy.ts \
            lib/cardPayment.ts \
            lib/rules/catalogue-primitives.ts \
            lib/rules/catalogue-structure.ts \
            lib/rules/choices.ts \
            lib/game.ts \
            components/game-screen-v2/GameScreen.tsx \
            tests/energy-production-model.test.ts \
            tests/game-screen-state.test.ts \
            .github/workflows/finalize-energy-production.yml \
            .github/workflows/trigger-energy-finalize.yml \
            .github/energy-finalize-trigger.txt
          git commit -m "Implement Energy uncharge and production model"
          git push origin HEAD:main
      - name: Capture failure diagnostics
        if: failure()
        shell: bash
        run: |
          git diff > energy-production-failure.diff || true
          git status --short > energy-production-failure-status.txt || true
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git checkout -B chatgpt-energy-production-failure
          git add -A
          git commit -m "Capture Energy production validation failure" || true
          git push --force origin chatgpt-energy-production-failure
