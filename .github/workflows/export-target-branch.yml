name: Export target branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Create source archive and payload history
        run: |
          tar --exclude=.git --exclude=node_modules -czf /tmp/target-branch.tar.gz .
          mkdir -p /tmp/target-payload-history
          git log --format='%H' --all -- .github/target-corrections.b64 > /tmp/target-payload-history/commits.txt
          while read -r commit; do
            git show "$commit:.github/target-corrections.b64" > "/tmp/target-payload-history/$commit.b64" || true
          done < /tmp/target-payload-history/commits.txt
          tar -czf /tmp/target-payload-history.tar.gz -C /tmp target-payload-history
      - uses: actions/upload-artifact@v4
        with:
          name: target-branch-source
          path: /tmp/target-branch.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: target-payload-history
          path: /tmp/target-payload-history.tar.gz
          retention-days: 1
