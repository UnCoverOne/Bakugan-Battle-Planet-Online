name: Export target branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Create source archive
        run: |
          tar --exclude=.git --exclude=node_modules -czf target-branch.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: target-branch-source
          path: target-branch.tar.gz
          retention-days: 1
