name: Import exact original profile artwork bytes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-original-artwork-v2
          fetch-depth: 0
      - name: Download and verify exact original PNG files
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import hashlib
          import urllib.request

          manifest = Path('.profile-assets/original-profile-assets.tsv')
          for line in manifest.read_text().splitlines():
              if not line.strip():
                  continue
              path_text, expected, url = line.split('\t', 2)
              path = Path(path_text)
              path.parent.mkdir(parents=True, exist_ok=True)
              print(f'Downloading {path}')
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Hash mismatch for {path}: {actual} != {expected}')
              path.write_bytes(data)
          PY
      - name: Commit exact source artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/profile/icons public/assets/profile/covers
          git commit -m "Import original profile artwork files"
          git push origin HEAD:fix/profile-original-artwork-v2
