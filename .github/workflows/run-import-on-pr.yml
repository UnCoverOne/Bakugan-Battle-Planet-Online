name: Run profile artwork import on pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-original-artwork-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Execute staged import workflow scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/import-original-profile-artwork.yml').read_text())
          for step in workflow['jobs']['import']['steps']:
              script = step.get('run')
              if not script:
                  continue
              print(f"::group::{step.get('name', 'unnamed step')}")
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
              print('::endgroup::')
          PY
