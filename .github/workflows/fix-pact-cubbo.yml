name: Fix Pact of Darkness and Hyper Cubbo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply repaired implementation patch
        shell: bash
        run: |
          python <<'PY'
          import subprocess
          from pathlib import Path

          historical = subprocess.check_output(
              ["git", "show", "6da30135aa7d3fbfc19f9dcf0457b48de13ac002:.github/workflows/fix-pact-cubbo.yml"],
              text=True,
          )
          start = historical.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = historical.index("\n          PY\n", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in historical[start:end].splitlines()
          )
          script = script.replace(
              '''  const rules = ensureRulesState(state) as DamageResumeRules;
  if (stateFlip.catalogId === PACT_OF_DARKNESS_ID) {
    const pact = rules.pactOfDarknessPayment;''',
              '''  const damageRules = ensureRulesState(state) as DamageResumeRules;
  if (stateFlip.catalogId === PACT_OF_DARKNESS_ID) {
    const pact = damageRules.pactOfDarknessPayment;''',
              1,
          )
          script = script.replace(
              '''        rules.pactOfDarknessPayment = {
          playerId,
          cardId: stateFlip.id,
          stage: "declined",''',
              '''        damageRules.pactOfDarknessPayment = {
          playerId,
          cardId: stateFlip.id,
          stage: "declined",''',
              1,
          )
          script = script.replace(
              '''        rules.pactOfDarknessPayment = {
          playerId,
          cardId: stateFlip.id,
          stage: "decision",''',
              '''        damageRules.pactOfDarknessPayment = {
          playerId,
          cardId: stateFlip.id,
          stage: "decision",''',
              1,
          )
          script = script.replace(
              'if (pending.kind === "payment" && pending.cardId === "bb-152") {',
              'if (pending.kind === "payment" && state.revealedFlip?.catalogId === "bb-152" && state.revealedFlip.id === pending.cardId) {',
              1,
          )
          exec(compile(script, "fix-pact-cubbo.py", "exec"))

          ai_file = Path("lib/opponentAi.ts")
          ai_source = ai_file.read_text()
          export_anchor = "export function advanceOpponentAi(input: MatchState, playerId: string): MatchState | null {"
          if export_anchor not in ai_source:
              raise SystemExit("Could not locate the opponent AI entry point.")
          ai_source = ai_source.replace(
              export_anchor,
              "function advanceOpponentAiStep(input: MatchState, playerId: string): MatchState | null {",
              1,
          )
          ai_source += '''

export function advanceOpponentAi(input: MatchState, playerId: string): MatchState | null {
  let current = input;
  let advanced = false;
  for (let step = 0; step < 4; step += 1) {
    const next = advanceOpponentAiStep(current, playerId);
    if (!next) return advanced ? current : null;
    advanced = true;
    current = next;
    const pending = current.pendingChoice;
    const anotherAiChoice = Boolean(
      pending
      && !pending.answers[playerId]
      && pending.schema.fields.some((field) => field.chooserId === playerId),
    );
    if (!anotherAiChoice) return current;
  }
  return current;
}
'''
          ai_file.write_text(ai_source)
          PY
