name: Apply AI Brawl outcome fix

on:
  push:
    branches:
      - fix/ai-brawl-outcome-policy-2026-08-14

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-brawl-outcome-policy-2026-08-14
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply tactical AI fixes and regressions
        shell: python
        run: |
          import base64
          from pathlib import Path

          def dec(value: str) -> str:
              return base64.b64decode(value).decode()

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once("lib/opponentAi.ts", "  passPriority,\n", "  passPriority,\n  prepareCardPlay,\n")
          replace_once("lib/opponentAi.ts", "import { cardEnergyPaymentState } from \"./cardPayment\";\n", "import { cardEnergyPaymentState, playCardWithAutoEnergy } from \"./cardPayment\";\n")
          replace_once("lib/opponentAi.ts", "import { activeTappedEnergyIds } from \"./rules/costs\";\n", "import { activeTappedEnergyIds } from \"./rules/costs\";\nimport { buildChoiceSchema } from \"./rules/choices\";\n")

          replace_once("lib/opponentAi.ts", dec(""), dec(""))

          helpers = dec("")
          replace_once("lib/opponentAi.ts", "function advanceWithCombatPolicy(input: MatchState, playerId: string) {\n", helpers + "function advanceWithCombatPolicy(input: MatchState, playerId: string) {\n")
          replace_once("lib/opponentAi.ts", dec(""), dec(""))
          replace_once("lib/opponentAi.ts", dec(""), dec(""))

          replace_once("lib/opponentAiBase.ts", dec("ICBjb25zdCBwcmludGVkQ29zdCA9IGNhcmQuY29zdCA9PT0gIlgiID8gY2hvaWNlcy54VmFsdWUgPz8gMCA6IGNhcmQuY29zdDsKICBjb25zdCByZXNvbHZpbmcgPSBjbG9uZU1hdGNoKG1hdGNoKTsK"), dec(""))
          replace_once("lib/opponentAiBase.ts", "  }, 0) - printedCost * 0.72;\n", "  }, 0) - evaluatedCost * 0.72;\n")
          replace_once("lib/opponentAiBase.ts", "    entries,\n    printedCost,\n  );\n", "    entries,\n    evaluatedCost,\n  );\n")

          tests_path = Path("tests/opponent-ai-tactics.test.ts")
          tests_text = tests_path.read_text()
          if "// AI brawl outcome regressions (2026-08-14)" in tests_text:
              raise SystemExit("Regression tests already present")
          tests_text = tests_text.rstrip() + "\n\n" + dec("")
          tests_path.write_text(tests_text)

      - name: Install dependencies
        run: npm ci

      - name: Run opponent AI regressions
        run: npx tsx --test tests/opponent-ai-tactics.test.ts

      - name: Lint
        run: npm run lint

      - name: Commit fixes
        run: |
          rm .github/workflows/apply-ai-brawl-outcome-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/opponentAi.ts lib/opponentAiBase.ts tests/opponent-ai-tactics.test.ts .github/workflows/apply-ai-brawl-outcome-fix.yml
          git commit -m "fix: make AI prioritize final Brawl outcomes"
          git push origin HEAD:fix/ai-brawl-outcome-policy-2026-08-14
