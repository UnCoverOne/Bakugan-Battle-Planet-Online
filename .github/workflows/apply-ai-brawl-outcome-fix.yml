name: Apply AI Brawl outcome fix

on:
  push:
    branches:
      - fix/ai-brawl-outcome-policy-2026-08-14

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-brawl-outcome-policy-2026-08-14
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply tactical AI fixes and regressions
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "lib/opponentAi.ts",
              '  passPriority,\n',
              '  passPriority,\n  prepareCardPlay,\n',
          )
          replace_once(
              "lib/opponentAi.ts",
              'import { cardEnergyPaymentState } from "./cardPayment";\n',
              'import { cardEnergyPaymentState, playCardWithAutoEnergy } from "./cardPayment";\n',
          )
          replace_once(
              "lib/opponentAi.ts",
              'import { activeTappedEnergyIds } from "./rules/costs";\n',
              'import { activeTappedEnergyIds } from "./rules/costs";\nimport { buildChoiceSchema } from "./rules/choices";\n',
          )

          replace_once(
              "lib/opponentAi.ts",
              '''  // When the opponent missed, or the AI is already winning, do not spend more
  // B-Power merely to increase a margin. Damage/FrostStrike/DoubleStrike may
  // still be useful because they improve the attack that follows.
  if (projection.currentWin) {
    return !projection.usefulPostVictoryEffect && !hasIndependentBenefit;
  }
''',
              '''  // When the opponent missed, or the AI is already winning, never trade the
  // projected Brawl win for a tie/loss. A card that changes the Victor stat is
  // also suppressed from a winning position unless it has a real non-combat
  // payoff: incidental Damage is not enough reason to abandon a safe B-Power win.
  if (projection.currentWin) {
    if (!projection.projectedWin) return true;
    const changesVictorStat = entries.some(({ action }) => (
      action.kind === "set-rule" && action.rule === "victor-stat"
    ));
    if (changesVictorStat && !hasIndependentBenefit) return true;
    return !projection.usefulPostVictoryEffect && !hasIndependentBenefit;
  }
''',
          )

          replace_once(
              "lib/opponentAi.ts",
              'function advanceWithCombatPolicy(input: MatchState, playerId: string) {\n',
              '''function nextWinningPowerPlanCard(
  match: MatchState,
  playerId: string,
  winningPowerPlan: ReadonlySet<string>,
) {
  const player = playerById(match, playerId);
  if (!player || !winningPowerPlan.size) return undefined;
  return player.hand
    .filter((card) => winningPowerPlan.has(card.id))
    .map((card) => {
      const choices = chooseBaseCardChoices(match, playerId, card);
      const payment = cardEnergyPaymentState(match, playerId, card, choices);
      return {
        card,
        choices,
        cost: payment?.kind === "insufficient"
          ? Number.POSITIVE_INFINITY
          : payment?.cost ?? Number.POSITIVE_INFINITY,
        swing: temporaryPowerSwing(match, playerId, card),
      };
    })
    .filter((candidate) => Number.isFinite(candidate.cost) && candidate.swing > 0)
    .sort((a, b) => (
      a.cost - b.cost
      || b.swing - a.swing
      || a.card.id.localeCompare(b.card.id)
    ))[0];
}

function winningPowerPlanCommand(
  match: MatchState,
  playerId: string,
  winningPowerPlan: ReadonlySet<string>,
): GameCommand | null {
  const candidate = nextWinningPowerPlanCard(match, playerId, winningPowerPlan);
  if (!candidate) return null;
  const schema = buildChoiceSchema(match, playerId, candidate.card);
  return schema.fields.length
    ? { type: "PREPARE_CARD_PLAY", cardId: candidate.card.id }
    : { type: "PLAY_CARD", cardId: candidate.card.id, choices: candidate.choices };
}

function advanceWinningPowerPlan(
  match: MatchState,
  playerId: string,
  winningPowerPlan: ReadonlySet<string>,
) {
  const candidate = nextWinningPowerPlanCard(match, playerId, winningPowerPlan);
  if (!candidate) return null;
  const schema = buildChoiceSchema(match, playerId, candidate.card);
  const next = schema.fields.length
    ? prepareCardPlay(match, playerId, candidate.card.id)
    : playCardWithAutoEnergy(match, playerId, candidate.card.id, candidate.choices);
  return validateAiTransition(match, next, playerId);
}

function advanceWithCombatPolicy(input: MatchState, playerId: string) {
''',
          )

          replace_once(
              "lib/opponentAi.ts",
              '''function advanceWithCombatPolicy(input: MatchState, playerId: string) {
  const player = playerById(input, playerId);
  if (!player) return null;
  const winningPowerPlan = minimumWinningTemporaryPowerCards(input, playerId);
  const suppressed = new Set(
''',
              '''function advanceWithCombatPolicy(input: MatchState, playerId: string) {
  const player = playerById(input, playerId);
  if (!player) return null;
  const winningPowerPlan = minimumWinningTemporaryPowerCards(input, playerId);
  const forcedWinningPlay = advanceWinningPowerPlan(input, playerId, winningPowerPlan);
  if (forcedWinningPlay) return forcedWinningPlay;
  const suppressed = new Set(
''',
          )

          replace_once(
              "lib/opponentAi.ts",
              '''function chooseWithCombatPolicy(input: MatchState, playerId: string): GameCommand | null {
  const player = playerById(input, playerId);
  if (!player) return null;
  const winningPowerPlan = minimumWinningTemporaryPowerCards(input, playerId);
  const suppressed = new Set(
''',
              '''function chooseWithCombatPolicy(input: MatchState, playerId: string): GameCommand | null {
  const player = playerById(input, playerId);
  if (!player) return null;
  const winningPowerPlan = minimumWinningTemporaryPowerCards(input, playerId);
  const forcedWinningCommand = winningPowerPlanCommand(input, playerId, winningPowerPlan);
  if (forcedWinningCommand) return forcedWinningCommand;
  const suppressed = new Set(
''',
          )

          replace_once(
              "lib/opponentAiBase.ts",
              '  const printedCost = card.cost === "X" ? choices.xValue ?? 0 : card.cost;\n  const resolving = cloneMatch(match);\n',
              '''  const printedCost = card.cost === "X" ? choices.xValue ?? 0 : card.cost;
  const payment = cardEnergyPaymentState(match, playerId, card, choices);
  const evaluatedCost = payment?.kind === "insufficient"
    ? printedCost
    : payment?.cost ?? printedCost;
  const resolving = cloneMatch(match);
''',
          )
          replace_once(
              "lib/opponentAiBase.ts",
              '  }, 0) - printedCost * 0.72;\n',
              '  }, 0) - evaluatedCost * 0.72;\n',
          )
          replace_once(
              "lib/opponentAiBase.ts",
              '    entries,\n    printedCost,\n  );\n',
              '    entries,\n    evaluatedCost,\n  );\n',
          )

          tests = Path("tests/opponent-ai-tactics.test.ts")
          text = tests.read_text()
          marker = '// AI brawl outcome regressions (2026-08-14)'
          if marker in text:
              raise SystemExit("Regression tests already present")
          text += '''

// AI brawl outcome regressions (2026-08-14)
test("AI forces reduced-cost Liqui Darts when it turns a B-Power tie into a lead", () => {
  const liquiDarts = catalogueCard("aa-6", "winning-liqui-darts");
  const ai = player(
    "liqui-ai",
    [
      bakugan("liqui-active", "Aquos", 800, 5),
      bakugan("liqui-aurelus", "Aurelus", 100, 1),
    ],
    [],
    [liquiDarts],
  );
  const human = player("liqui-human", [bakugan("liqui-human-b", "Pyrus", 800, 5)]);
  addEnergy(ai, 1);
  const match = matchWith(ai, human, "power");
  setBrawl(match, ai, human, true, true);

  const next = advanceOpponentAi(match, ai.id);
  assert.ok(next);
  assert.equal(next.batch.at(-1)?.card.id, liquiDarts.id);
  assert.equal(next.players[0].hand.some((card) => card.id === liquiDarts.id), false);
});

test("AI keeps Might of Cyndeus when it already has a safe B-Power lead", () => {
  const might = catalogueCard("bb-104", "redundant-might-of-cyndeus");
  const ai = player("might-lead-ai", [bakugan("might-lead-ai-b", "Pyrus", 900, 5)], [], [might]);
  const human = player("might-lead-human", [bakugan("might-lead-human-b", "Aquos", 800, 4)]);
  addEnergy(ai, 2);
  const match = matchWith(ai, human, "power");
  setBrawl(match, ai, human, true, true);

  const next = advanceOpponentAi(match, ai.id);
  assert.ok(next);
  assert.equal(next.batch.length, 0);
  assert.ok(next.players[0].hand.some((card) => card.id === might.id));
});

test("AI does not play Might of Cyndeus into a pending opponent Damage buff that would make it lose", () => {
  const might = catalogueCard("bb-104", "losing-might-of-cyndeus");
  const enemyDamage = catalogueCard("bb-93", "pending-human-fireball");
  const ai = player("might-batch-ai", [bakugan("might-batch-ai-b", "Pyrus", 900, 5)], [], [might]);
  const human = player("might-batch-human", [bakugan("might-batch-human-b", "Aquos", 800, 4)]);
  addEnergy(ai, 2);
  const match = matchWith(ai, human, "power");
  setBrawl(match, ai, human, true, true);
  match.batch = [{
    id: "pending-human-damage",
    controllerId: human.id,
    card: enemyDamage,
    choices: {},
    kind: "card",
  }];

  const next = advanceOpponentAi(match, ai.id);
  assert.ok(next);
  assert.equal(next.batch.length, 1);
  assert.equal(next.batch[0].card.id, enemyDamage.id);
  assert.ok(next.players[0].hand.some((card) => card.id === might.id));
});

test("AI still plays Might of Cyndeus when switching to Damage changes a loss into a win", () => {
  const might = catalogueCard("bb-104", "winning-might-of-cyndeus");
  const ai = player("might-win-ai", [bakugan("might-win-ai-b", "Pyrus", 500, 6)], [], [might]);
  const human = player("might-win-human", [bakugan("might-win-human-b", "Aquos", 800, 5)]);
  addEnergy(ai, 2);
  const match = matchWith(ai, human, "power");
  setBrawl(match, ai, human, true, true);

  const next = advanceOpponentAi(match, ai.id);
  assert.ok(next);
  assert.equal(next.batch.at(-1)?.card.id, might.id);
});
'''
          tests.write_text(text)

      - name: Install dependencies
        run: npm ci

      - name: Run opponent AI regressions
        run: npx tsx --test tests/opponent-ai-tactics.test.ts

      - name: Lint
        run: npm run lint

      - name: Commit fixes
        run: |
          rm .github/workflows/apply-ai-brawl-outcome-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/opponentAi.ts lib/opponentAiBase.ts tests/opponent-ai-tactics.test.ts .github/workflows/apply-ai-brawl-outcome-fix.yml
          git commit -m "fix: make AI prioritize final Brawl outcomes"
          git push origin HEAD:fix/ai-brawl-outcome-policy-2026-08-14
