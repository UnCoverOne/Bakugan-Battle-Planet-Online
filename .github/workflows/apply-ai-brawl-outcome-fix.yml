name: Apply AI Brawl outcome fix

on:
  push:
    branches:
      - fix/ai-brawl-outcome-policy-2026-08-14

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-brawl-outcome-policy-2026-08-14
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply tactical AI fixes and regressions
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          # The combat-policy layer must be able to force a proven winning play
          # instead of merely leaving that card available to the generic scorer.
          replace_once(
              "lib/opponentAi.ts",
              '  passPriority,\n',
              '  passPriority,\n  prepareCardPlay,\n',
          )
          replace_once(
              "lib/opponentAi.ts",
              'import { cardEnergyPaymentState } from "./cardPayment";\n',
              'import { cardEnergyPaymentState, playCardWithAutoEnergy } from "./cardPayment";\n',
          )
          replace_once(
              "lib/opponentAi.ts",
              'import { activeTappedEnergyIds } from "./rules/costs";\n',
              'import { activeTappedEnergyIds } from "./rules/costs";\nimport { buildChoiceSchema } from "./rules/choices";\n',
          )

          old_current_win = '''  // When the opponent missed, or the AI is already winning, do not spend more\n  // B-Power merely to increase a margin. Damage/FrostStrike/DoubleStrike may\n  // still be useful because they improve the attack that follows.\n  if (projection.currentWin) {\n    return !projection.usefulPostVictoryEffect && !hasIndependentBenefit;\n  }\n'''
          new_current_win = '''  // When the opponent missed, or the AI is already winning, never trade the\n  // projected Brawl win for a tie/loss. A card that changes the Victor stat is\n  // also suppressed from a winning position unless it has a real non-combat\n  // payoff: incidental Damage is not enough reason to abandon a safe B-Power win.\n  if (projection.currentWin) {\n    if (!projection.projectedWin) return true;\n    const changesVictorStat = entries.some(({ action }) => (\n      action.kind === "set-rule" && action.rule === "victor-stat"\n    ));\n    if (changesVictorStat && !hasIndependentBenefit) return true;\n    return !projection.usefulPostVictoryEffect && !hasIndependentBenefit;\n  }\n'''
          replace_once("lib/opponentAi.ts", old_current_win, new_current_win)

          insertion_anchor = '''function advanceWithCombatPolicy(input: MatchState, playerId: string) {\n'''
          helpers = '''function nextWinningPowerPlanCard(\n  match: MatchState,\n  playerId: string,\n  winningPowerPlan: ReadonlySet<string>,\n) {\n  const player = playerById(match, playerId);\n  if (!player || !winningPowerPlan.size) return undefined;\n  return player.hand\n    .filter((card) => winningPowerPlan.has(card.id))\n    .map((card) => {\n      const choices = chooseBaseCardChoices(match, playerId, card);\n      const payment = cardEnergyPaymentState(match, playerId, card, choices);\n      return {\n        card,\n        choices,\n        cost: payment?.kind === "insufficient"\n          ? Number.POSITIVE_INFINITY\n          : payment?.cost ?? Number.POSITIVE_INFINITY,\n        swing: temporaryPowerSwing(match, playerId, card),\n      };\n    })\n    .filter((candidate) => Number.isFinite(candidate.cost) && candidate.swing > 0)\n    .sort((a, b) => (\n      a.cost - b.cost\n      || b.swing - a.swing\n      || a.card.id.localeCompare(b.card.id)\n    ))[0];\n}\n\nfunction winningPowerPlanCommand(\n  match: MatchState,\n  playerId: string,\n  winningPowerPlan: ReadonlySet<string>,\n): GameCommand | null {\n  const candidate = nextWinningPowerPlanCard(match, playerId, winningPowerPlan);\n  if (!candidate) return null;\n  const schema = buildChoiceSchema(match, playerId, candidate.card);\n  return schema.fields.length\n    ? { type: "PREPARE_CARD_PLAY", cardId: candidate.card.id }\n    : { type: "PLAY_CARD", cardId: candidate.card.id, choices: candidate.choices };\n}\n\nfunction advanceWinningPowerPlan(\n  match: MatchState,\n  playerId: string,\n  winningPowerPlan: ReadonlySet<string>,\n) {\n  const candidate = nextWinningPowerPlanCard(match, playerId, winningPowerPlan);\n  if (!candidate) return null;\n  const schema = buildChoiceSchema(match, playerId, candidate.card);\n  const next = schema.fields.length\n    ? prepareCardPlay(match, playerId, candidate.card.id)\n    : playCardWithAutoEnergy(match, playerId, candidate.card.id, candidate.choices);\n  return validateAiTransition(match, next, playerId);\n}\n\n'''
          replace_once("lib/opponentAi.ts", insertion_anchor, helpers + insertion_anchor)

          replace_once(
              "lib/opponentAi.ts",
              '  const winningPowerPlan = minimumWinningTemporaryPowerCards(input, playerId);\n  const suppressed = new Set(\n',
              '  const winningPowerPlan = minimumWinningTemporaryPowerCards(input, playerId);\n  const forcedWinningPlay = advanceWinningPowerPlan(input, playerId, winningPowerPlan);\n  if (forcedWinningPlay) return forcedWinningPlay;\n  const suppressed = new Set(\n',
          )

          # There are two identical winningPowerPlan declarations; after the first
          # replacement above only the command-policy version remains unchanged.
          replace_once(
              "lib/opponentAi.ts",
              '  const winningPowerPlan = minimumWinningTemporaryPowerCards(input, playerId);\n  const suppressed = new Set(\n',
              '  const winningPowerPlan = minimumWinningTemporaryPowerCards(input, playerId);\n  const forcedWinningCommand = winningPowerPlanCommand(input, playerId, winningPowerPlan);\n  if (forcedWinningCommand) return forcedWinningCommand;\n  const suppressed = new Set(\n',
          )

          # Generic card utility must use the actual payable Energy cost so cost
          # reductions (for example Aurelus Power on Liqui Darts) are not scored
          # as though the printed cost were still being paid.
          replace_once(
              "lib/opponentAiBase.ts",
              '  const printedCost = card.cost === "X" ? choices.xValue ?? 0 : card.cost;\n  const resolving = cloneMatch(match);\n',
              '  const printedCost = card.cost === "X" ? choices.xValue ?? 0 : card.cost;\n  const payment = cardEnergyPaymentState(match, playerId, card, choices);\n  const evaluatedCost = payment?.kind === "insufficient"\n    ? printedCost\n    : payment?.cost ?? printedCost;\n  const resolving = cloneMatch(match);\n',
          )
          replace_once(
              "lib/opponentAiBase.ts",
              '  }, 0) - printedCost * 0.72;\n',
              '  }, 0) - evaluatedCost * 0.72;\n',
          )
          replace_once(
              "lib/opponentAiBase.ts",
              '    entries,\n    printedCost,\n  );\n',
              '    entries,\n    evaluatedCost,\n  );\n',
          )

          tests = Path("tests/opponent-ai-tactics.test.ts")
          text = tests.read_text()
          marker = '// AI brawl outcome regressions (2026-08-14)'
          if marker in text:
              raise SystemExit("Regression tests already present")
          text += r'''\n\n// AI brawl outcome regressions (2026-08-14)\ntest("AI forces reduced-cost Liqui Darts when it turns a B-Power tie into a lead", () => {\n  const liquiDarts = catalogueCard("aa-6", "winning-liqui-darts");\n  const ai = player(\n    "liqui-ai",\n    [\n      bakugan("liqui-active", "Aquos", 800, 5),\n      bakugan("liqui-aurelus", "Aurelus", 100, 1),\n    ],\n    [],\n    [liquiDarts],\n  );\n  const human = player("liqui-human", [bakugan("liqui-human-b", "Pyrus", 800, 5)]);\n  addEnergy(ai, 1);\n  const match = matchWith(ai, human, "power");\n  setBrawl(match, ai, human, true, true);\n\n  const next = advanceOpponentAi(match, ai.id);\n  assert.ok(next);\n  assert.equal(next.batch.at(-1)?.card.id, liquiDarts.id);\n  assert.equal(next.players[0].hand.some((card) => card.id === liquiDarts.id), false);\n});\n\ntest("AI keeps Might of Cyndeus when it already has a safe B-Power lead", () => {\n  const might = catalogueCard("bb-104", "redundant-might-of-cyndeus");\n  const ai = player("might-lead-ai", [bakugan("might-lead-ai-b", "Pyrus", 900, 5)], [], [might]);\n  const human = player("might-lead-human", [bakugan("might-lead-human-b", "Aquos", 800, 4)]);\n  addEnergy(ai, 2);\n  const match = matchWith(ai, human, "power");\n  setBrawl(match, ai, human, true, true);\n\n  const next = advanceOpponentAi(match, ai.id);\n  assert.ok(next);\n  assert.equal(next.batch.length, 0);\n  assert.ok(next.players[0].hand.some((card) => card.id === might.id));\n});\n\ntest("AI does not play Might of Cyndeus into a pending opponent Damage buff that would make it lose", () => {\n  const might = catalogueCard("bb-104", "losing-might-of-cyndeus");\n  const enemyDamage = catalogueCard("bb-93", "pending-human-fireball");\n  const ai = player("might-batch-ai", [bakugan("might-batch-ai-b", "Pyrus", 900, 5)], [], [might]);\n  const human = player("might-batch-human", [bakugan("might-batch-human-b", "Aquos", 800, 4)]);\n  addEnergy(ai, 2);\n  const match = matchWith(ai, human, "power");\n  setBrawl(match, ai, human, true, true);\n  match.batch = [{\n    id: "pending-human-damage",\n    controllerId: human.id,\n    card: enemyDamage,\n    choices: {},\n    kind: "card",\n  }];\n\n  const next = advanceOpponentAi(match, ai.id);\n  assert.ok(next);\n  assert.equal(next.batch.length, 1);\n  assert.equal(next.batch[0].card.id, enemyDamage.id);\n  assert.ok(next.players[0].hand.some((card) => card.id === might.id));\n});\n\ntest("AI still plays Might of Cyndeus when switching to Damage changes a loss into a win", () => {\n  const might = catalogueCard("bb-104", "winning-might-of-cyndeus");\n  const ai = player("might-win-ai", [bakugan("might-win-ai-b", "Pyrus", 500, 6)], [], [might]);\n  const human = player("might-win-human", [bakugan("might-win-human-b", "Aquos", 800, 5)]);\n  addEnergy(ai, 2);\n  const match = matchWith(ai, human, "power");\n  setBrawl(match, ai, human, true, true);\n\n  const next = advanceOpponentAi(match, ai.id);\n  assert.ok(next);\n  assert.equal(next.batch.at(-1)?.card.id, might.id);\n});\n'''
          tests.write_text(text)

      - name: Install dependencies
        run: npm ci

      - name: Run opponent AI regressions
        run: npx tsx --test tests/opponent-ai-tactics.test.ts

      - name: Lint
        run: npm run lint

      - name: Commit fixes
        run: |
          rm .github/workflows/apply-ai-brawl-outcome-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/opponentAi.ts lib/opponentAiBase.ts tests/opponent-ai-tactics.test.ts .github/workflows/apply-ai-brawl-outcome-fix.yml
          git commit -m "fix: make AI prioritize final Brawl outcomes"
          git push origin HEAD:fix/ai-brawl-outcome-policy-2026-08-14
