      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture base
        shell: bash
        run: |
          git fetch origin main
          echo "BASE_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
