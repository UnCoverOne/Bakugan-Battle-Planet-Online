name: Apply Roll Presentation Fixes

on:
  push:
    branches:
      - agent/fix-roll-result-flash-mobile-veil
    paths:
      - scripts/apply-roll-presentation-fixes.mjs
      - .github/workflows/apply-roll-presentation-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-roll-result-flash-mobile-veil
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply implementation
        run: node scripts/apply-roll-presentation-fixes.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run presentation regressions
        run: node --import tsx --test tests/presentation-stability.test.ts tests/roll-phase-presentation.test.ts tests/mobile-overlay-layering.test.ts
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git rm -f scripts/apply-roll-presentation-fixes.mjs .github/workflows/apply-roll-presentation-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components tests
          git commit -m "Fix roll result timing and mobile veil"
          git push origin HEAD:agent/fix-roll-result-flash-mobile-veil
