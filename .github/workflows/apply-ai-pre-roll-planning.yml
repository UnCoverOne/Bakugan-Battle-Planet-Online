name: Apply AI pre-roll planning implementation

on:
  push:
    branches:
      - agent/full-ai-pre-roll-planning
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  implement-and-validate:
    if: github.head_ref == 'agent/full-ai-pre-roll-planning' || github.ref_name == 'agent/full-ai-pre-roll-planning'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-ai-pre-roll-planning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply implementation
        run: |
          cat scripts/ai-planner-part-* | base64 --decode | gunzip > /tmp/apply-ai-pre-roll-planning.py
          echo "7349fc1ec907be21f3cbfda56f330808a32cc121a78fe4dd00a60f4a286358de  /tmp/apply-ai-pre-roll-planning.py" | sha256sum --check
          python /tmp/apply-ai-pre-roll-planning.py
          rm -f scripts/ai-planner-part-*
      - name: Validate changed AI files
        run: |
          git diff --check
          npx eslint \
            lib/aiCardSemantics.ts \
            lib/opponentAi.ts \
            lib/opponentAiBase.ts \
            tests/opponent-ai-tactics.test.ts \
            tests/ai-energize-planner.test.ts
      - name: Run focused AI regression suites
        run: >-
          node --import tsx --test
          tests/opponent-ai-tactics.test.ts
          tests/ai-energize-planner.test.ts
          tests/ai-roll-forecast.test.ts
          tests/wave-slash-ai.test.ts
          tests/reported-gameplay-regressions-2026-08.test.ts
      - name: Build production application
        run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement state-aware AI pre-roll planning"
          git push origin HEAD:agent/full-ai-pre-roll-planning
