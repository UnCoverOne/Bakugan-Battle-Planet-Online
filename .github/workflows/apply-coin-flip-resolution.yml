name: Apply coin flip resolution

on:
  push:
    branches:
      - fix/coin-flip-resolution-2026-08-15

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coin-flip-resolution-2026-08-15
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply coin flip mechanic
        run: python .github/coin_flip_apply.py

      - name: Install dependencies
        run: npm ci

      - name: Run gameplay and rules regressions
        run: npx tsx --test tests/reported-gameplay-regressions-2026-08.test.ts tests/rules-engine-modernization.test.ts

      - name: Lint
        run: npm run lint

      - name: Commit implementation
        run: |
          rm .github/coin_flip_apply.py .github/workflows/apply-coin-flip-resolution.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add animated coin flip resolution"
          git push origin HEAD:fix/coin-flip-resolution-2026-08-15
