name: Apply Website Overhaul

on:
  pull_request:
    types:
      - reopened
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/website-overhaul'
    runs-on: ubuntu-latest
    steps:
      - name: Check out overhaul branch
        uses: actions/checkout@v4
        with:
          ref: agent/website-overhaul
          fetch-depth: 0
      - name: Reconstruct and apply validated overhaul patch
        run: |
          set -euo pipefail
          for part in 00 01 02 03 04 05; do
            git show 79aeb422b95a30dfd426231eacb36d54d70642a8:.website-overhaul-patch/part-${part}
          done | base64 --decode | gzip --decompress > /tmp/website-overhaul.patch
          echo "f5b79ffc59308c3e67b36d02c34182415af15f27818f80129adf3802f0cee3dc  /tmp/website-overhaul.patch" | sha256sum --check
          git apply --index --exclude=.github/workflows/repository-export.yml /tmp/website-overhaul.patch
          git rm --ignore-unmatch .github/workflows/apply-website-overhaul.yml .github/workflows/repository-export.yml
          rm -rf .website-overhaul-patch
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: overhaul website layout and navigation"
          git push origin HEAD:agent/website-overhaul
