name: Apply Website Overhaul

on:
  pull_request:
    types:
      - reopened
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/website-overhaul'
    runs-on: ubuntu-latest
    steps:
      - name: Check out overhaul branch
        uses: actions/checkout@v4
        with:
          ref: agent/website-overhaul
          fetch-depth: 0
      - name: Reconstruct validated overhaul patch
        run: |
          set -euo pipefail
          {
            git show 79aeb422b95a30dfd426231eacb36d54d70642a8:.website-overhaul-patch/part-00
            git show 79aeb422b95a30dfd426231eacb36d54d70642a8:.website-overhaul-patch/part-01
            cat .website-overhaul-patch/part-02a .website-overhaul-patch/part-02b
            git show 79aeb422b95a30dfd426231eacb36d54d70642a8:.website-overhaul-patch/part-03
            git show 79aeb422b95a30dfd426231eacb36d54d70642a8:.website-overhaul-patch/part-04
            git show 79aeb422b95a30dfd426231eacb36d54d70642a8:.website-overhaul-patch/part-05
          } | base64 --decode | gzip --decompress > /tmp/website-overhaul.patch
      - name: Verify overhaul patch checksum
        run: echo "f5b79ffc59308c3e67b36d02c34182415af15f27818f80129adf3802f0cee3dc  /tmp/website-overhaul.patch" | sha256sum --check
      - name: Verify overhaul patch applies cleanly
        run: git apply --check --exclude=.github/workflows/repository-export.yml /tmp/website-overhaul.patch
      - name: Apply and commit overhaul
        run: |
          set -euo pipefail
          git apply --index --exclude=.github/workflows/repository-export.yml /tmp/website-overhaul.patch
          git rm --ignore-unmatch .github/workflows/apply-website-overhaul.yml .github/workflows/repository-export.yml
          rm -rf .website-overhaul-patch
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: overhaul website layout and navigation"
          git push origin HEAD:agent/website-overhaul
