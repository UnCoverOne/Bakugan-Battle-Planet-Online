name: Apply Website Overhaul

on:
  pull_request:
    types:
      - reopened
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/website-overhaul'
    runs-on: ubuntu-latest
    steps:
      - name: Check out overhaul branch
        uses: actions/checkout@v4
        with:
          ref: agent/website-overhaul
          fetch-depth: 0
      - name: Reconstruct validated overhaul patch
        run: |
          set -euo pipefail
          cat .website-overhaul-patch/final-* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/website-overhaul.patch
      - name: Verify overhaul patch checksum
        run: echo "38e9ad9b7d89353a700dcb8139f40a27765e81fe5247dc9df22d76d9b027e09d  /tmp/website-overhaul.patch" | sha256sum --check
      - name: Verify overhaul patch applies cleanly
        run: git apply --check /tmp/website-overhaul.patch
      - name: Apply and commit overhaul
        run: |
          set -euo pipefail
          git apply --index /tmp/website-overhaul.patch
          git rm --ignore-unmatch .github/workflows/apply-website-overhaul.yml .github/workflows/repository-export.yml
          rm -rf .website-overhaul-patch
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: overhaul website layout and navigation"
          git push origin HEAD:agent/website-overhaul
