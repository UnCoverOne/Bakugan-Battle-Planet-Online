name: Agent AI Energy Reservation

on:
  push:
    branches:
      - agent/ai-energy-reservation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-energy-reservation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply continuation-value model
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent-ai-energy-reservation.py')
          text = path.read_text()
          text = text.replace('          5.5\n', '          7.5\n', 1)
          text = text.replace(
              '  const likelihood = futurePlayLikelihood(match, playerId, card, choices, "hand");\n',
              '''  // The choice schema is intentionally not queried against the pre-roll\n  // snapshot: temporary responses often have no legal target until Bakugan\n  // open. Estimate conditional availability for the future Power Step.\n  const likelihood = /\\b(?:Flow|Fury|Turbo|Domination|Victor)\\b|\\bif\\b/i.test(card.effect)\n    ? 0.65\n    : 1;\n''',
              1,
          )
          path.write_text(text)
          PY
          python scripts/agent-ai-energy-reservation.py
      - name: Run focused AI tactics and Energize regressions
        run: node --import tsx --test tests/opponent-ai-tactics.test.ts tests/ai-energize-planner.test.ts tests/ai-roll-forecast.test.ts
      - name: Build production application
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/agent-ai-energy-reservation.py .github/workflows/agent-ai-energy-reservation.yml
          git add lib/opponentAiBase.ts tests/opponent-ai-tactics.test.ts
          git commit -m "Teach AI to reserve tactical Energy"
          git push origin HEAD:agent/ai-energy-reservation
