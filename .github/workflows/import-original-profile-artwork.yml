          const uniqueIds = (value: unknown) =>
            Array.isArray(value)
              ? [...new Set(value.filter((item): item is string => typeof item === "string").map((item) => item.trim().slice(0, 120)).filter(Boolean))].slice(0, PROFILE_SHOWCASE_LIMIT)
              : [];

          export function normalizeShowcaseIds(value: unknown) {
            return uniqueIds(value);
          }

          export function normalizeProfileAvatar(value: unknown) {
            if (typeof value !== "string" || !value) return "";
            const match = /^preset:([a-z0-9-]{1,120})$/i.exec(value);
            if (!match) return "";
            return PROFILE_AVATARS.some((item) => item.id === match[1]) ? value : "";
          }

          export function normalizeProfileTitle(value: unknown) {
            return PROFILE_TITLES.find((item) => item.id === value)?.id ?? PROFILE_TITLES[0].id;
          }

          export function normalizeProfileCover(value: unknown) {
            return PROFILE_COVERS.find((item) => item.id === value)?.id ?? PROFILE_COVERS[0].id;
          }

          export function profileRewardUnlocked(reward: ProfileReward, completedAchievementIds: ReadonlySet<string>) {
            return reward.achievementId === null || completedAchievementIds.has(reward.achievementId);
          }

          export function toggleShowcaseId(current: readonly string[] | undefined, id: string) {
            const normalized = normalizeShowcaseIds(current);
            if (normalized.includes(id)) return { ids: normalized.filter((item) => item !== id), reachedLimit: false };
            if (normalized.length >= PROFILE_SHOWCASE_LIMIT) return { ids: normalized, reachedLimit: true };
            return { ids: [...normalized, id], reachedLimit: false };
          }
