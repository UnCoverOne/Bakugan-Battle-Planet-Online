          css = css.replace("  .identityCard::after {\n    background:\n      linear-gradient(0deg, rgba(0, 7, 11, .86), rgba(0, 7, 11, .08) 82%),\n      linear-gradient(90deg, rgba(0, 7, 11, .62), transparent 76%);\n  }\n\n", "")
          path.write_text(css)

          Path("components/profile/ProfileArtworkCorrections.module.css").unlink(missing_ok=True)
          Path("public/assets/profile/brawler-profile-icons.avif").unlink(missing_ok=True)
          Path("public/assets/profile/brawler-profile-covers.avif").unlink(missing_ok=True)
          PY

      - name: Add exact-byte and UI regression coverage
        shell: bash
        run: |
          cat > tests/profile-customization.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { existsSync, readFileSync } from "node:fs";
          import test from "node:test";
          import {
            PROFILE_AVATARS,
            PROFILE_COVERS,
            PROFILE_SHOWCASE_LIMIT,
            normalizeProfileAvatar,
            normalizeProfileCover,
            normalizeProfileTitle,
            normalizeShowcaseIds,
            profileRewardUnlocked,
            toggleShowcaseId,
          } from "../lib/profile-customization";

          const EXPECTED_HASHES: Record<string, string> = {
            "/assets/profile/icons/veronica-venegas.png": "40b769ca60a28c472e3c97eb098ab4a09b383354e54cc739f651fe21f0305aa6",
