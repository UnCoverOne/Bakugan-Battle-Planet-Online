name: Import original profile artwork

on:
  push:
    branches:
      - fix/profile-original-artwork-v2
    paths:
      - .github/workflows/import-original-profile-artwork.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-original-artwork-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download exact original PNG files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/profile/icons public/assets/profile/covers
          while IFS=$'\t' read -r path hash url; do
            [ -z "$path" ] && continue
            echo "Importing $path"
            curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$path"
            echo "$hash  $path" | sha256sum -c -
          done <<'ASSETS'
