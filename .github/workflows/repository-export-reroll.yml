name: Temporary Reroll Repository Export

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/repository-export-reroll.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository
        shell: bash
        run: |
          zip -qr repository.zip . -x '.git/*' 'node_modules/*' '.next/*' 'dist/*'
      - uses: actions/upload-artifact@v4
        with:
          name: reroll-repository-export
          path: repository.zip
          retention-days: 1
