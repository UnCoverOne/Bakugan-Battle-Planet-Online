name: Apply Serpenteze and Dark Waters fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'fix/serpenteze-dark-waters'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/serpenteze-dark-waters
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Remove embedded test fixture from patch script
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'scripts/apply-serpenteze-dark-waters-fix.mjs';
          let source = await readFile(path, 'utf8');
          const start = source.indexOf('const testSource = `');
          const endMarker = 'await writeFile("tests/recharge-and-dark-waters.test.ts", testSource);\n\n';
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end < 0) throw new Error('Could not isolate embedded test fixture');
          source = source.slice(0, start) + source.slice(end + endMarker.length);
          await writeFile(path, source);
          NODE
      - name: Apply source fix
        run: node scripts/apply-serpenteze-dark-waters-fix.mjs
      - name: Targeted regressions
        run: node --import tsx --test tests/recharge-and-dark-waters.test.ts tests/opponent-ai-tactics.test.ts
      - name: Rules regressions
        run: npm run test:rules
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Recharge effects and Dark Waters AI tactics"
          git push origin HEAD:fix/serpenteze-dark-waters
