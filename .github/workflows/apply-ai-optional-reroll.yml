name: Apply AI optional reroll patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-optional-reroll-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply implementation patch
        run: python scripts/patch-ai-optional-reroll.py
      - name: Install dependencies
        run: npm run install:ci
      - name: Run focused AI regressions
        run: node --import tsx --test tests/reported-gameplay-regressions.test.ts tests/opponent-ai-tactics.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/opponentAiBase.ts tests/reported-gameplay-regressions.test.ts
          git diff --cached --check
          git commit -m "Improve AI optional reroll decisions"
          git push origin HEAD:fix/ai-optional-reroll-20260807
