name: Finalize AI performance optimization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-ai-forecast-performance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Finalize behavior-preserving source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          tests = Path("tests/opponent-ai-tactics.test.ts")
          text = tests.read_text()
          text = text.replace(
              'import {\n  opponentAiPerformanceSnapshot,\n  resetOpponentAiPerformanceMetrics,\n} from "../lib/opponentAiBase";\n',
              '',
              1,
          )
          marker = '\n\ntest("AI reuses exact forecasts and projected Brawl scenarios within one decision"'
          index = text.find(marker)
          if index < 0:
              raise SystemExit("Could not locate the instrumentation-only regression")
          tests.write_text(text[:index].rstrip() + "\n")

          base = Path("lib/opponentAiBase.ts")
          text = base.read_text()
          metrics_start = text.find("function createPerformanceMetrics() {")
          metrics_end = text.find("function playerById(", metrics_start)
          if metrics_start < 0 or metrics_end < 0:
              raise SystemExit("Could not locate AI performance instrumentation")
          text = text[:metrics_start] + text[metrics_end:]
          text = '\n'.join(
              line for line in text.splitlines()
              if 'opponentAiPerformance.' not in line
          ) + '\n'
          base.write_text(text)

          gameplay = Path("components/game-screen-v2/GameplayClient.tsx")
          text = gameplay.read_text()
          old_import = 'from "../../lib/opponentAiBase";'
          if old_import not in text:
              raise SystemExit("Could not locate the UI AI readiness import")
          gameplay.write_text(text.replace(
              old_import,
              'from "../../lib/opponentAiCanAct";',
              1,
          ))
          PY
          cat > lib/opponentAiCanAct.ts <<'EOF'
          import type { MatchState } from "./game";
          import {
            playerCanConfirmRoll,
            playerCanSelectRollTarget,
          } from "./rolling";
          import { playerCanDrawTurnCard } from "./turnStart";

          const PRIORITY_PHASES = new Set<MatchState["phase"]>([
            "preRoll",
            "power",
            "victor",
            "postDamage",
            "endPlay",
          ]);

          /**
           * Lightweight readiness check used by the UI. Tactical planning stays
           * inside the opponent worker and is not bundled into the render thread.
           */
          export function opponentAiCanAct(match: MatchState, playerId: string) {
            const player = match.players.find((candidate) => candidate.id === playerId);
            if (!player) return false;
            if (match.pendingChoice?.schema.fields.some(
              (field) => field.chooserId === playerId && !match.pendingChoice?.answers[playerId],
            )) return true;
            if (match.triggerOrders.some(
              (request) => request.controllerId === playerId && !request.orderedIds,
            )) return true;
            if (
              match.phase === "startingPlayer"
              && Date.now() >= match.startingPlayerRevealedAt
            ) return true;
            if (match.phase === "placement" && match.priority === playerId) return true;
            if (playerCanDrawTurnCard(match, playerId)) return true;
            if (match.phase === "energize" && !player.energizedThisTurn) return true;
            if (match.phase === "selection" && !match.selected[playerId]) return true;
            if (
              (match.phase === "target" || match.phase === "reroll")
              && (
                playerCanSelectRollTarget(match, playerId)
                || playerCanConfirmRoll(match, playerId)
              )
            ) return true;
            if (match.phase === "damage" && match.pendingLoser === playerId) return true;
            if (
              match.phase === "reset"
              && match.batch.length > 0
              && match.priority === playerId
            ) return true;
            if (PRIORITY_PHASES.has(match.phase) && match.priority === playerId) return true;
            return match.phase === "handLimit" && match.priority === playerId;
          }
          EOF
          sed -i 's/^          //' lib/opponentAiCanAct.ts
          rm -f ai-performance-ci-report.txt
      - name: Validate changed source
        run: |
          git diff --check
          npx eslint lib/opponentAiBase.ts lib/opponentAi.ts lib/opponentAiCanAct.ts components/game-screen-v2/GameplayClient.tsx components/game-screen-v2/opponentAi.worker.ts tests/opponent-ai-tactics.test.ts
      - name: Run focused AI regressions
        run: |
          node --import tsx --test tests/opponent-ai-tactics.test.ts tests/ai-roll-forecast.test.ts tests/ai-energize-planner.test.ts tests/wave-slash-ai.test.ts
      - name: Build optimized production bundle
        run: npm run build
      - name: Compare gameplay bundle with main baseline
        run: |
          node - <<'NODE'
          const { readdirSync, statSync, writeFileSync } = require("node:fs");
          const { join } = require("node:path");
          const directory = "dist/client/assets";
          const file = readdirSync(directory).find((name) => /^GameplayRuntime-.*\.js$/.test(name));
          if (!file) throw new Error("Optimized gameplay bundle was not found.");
          const size = statSync(join(directory, file)).size;
          writeFileSync("/tmp/optimized-gameplay-size", String(size));
          console.log(`Optimized gameplay route JavaScript: ${size.toLocaleString()} bytes`);
          NODE
          git worktree add /tmp/bbp-main origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/bbp-main/node_modules
          (cd /tmp/bbp-main && npm run build)
          node - <<'NODE'
          const { readdirSync, statSync, readFileSync } = require("node:fs");
          const { join } = require("node:path");
          const directory = "/tmp/bbp-main/dist/client/assets";
          const file = readdirSync(directory).find((name) => /^GameplayRuntime-.*\.js$/.test(name));
          if (!file) throw new Error("Main gameplay bundle was not found.");
          const baseline = statSync(join(directory, file)).size;
          const optimized = Number(readFileSync("/tmp/optimized-gameplay-size", "utf8"));
          const difference = optimized - baseline;
          console.log(`Main gameplay route JavaScript: ${baseline.toLocaleString()} bytes`);
          console.log(`Optimized difference: ${difference >= 0 ? "+" : ""}${difference.toLocaleString()} bytes`);
          if (difference > 20_000) {
            throw new Error(`Gameplay route increased by ${difference} bytes, above the 20 KB guardrail.`);
          }
          NODE
      - name: Commit validated implementation
        run: |
          rm -f .github/workflows/finalize-ai-performance.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize behavior-preserving AI performance optimizations"
          git push origin HEAD:agent/optimize-ai-forecast-performance
