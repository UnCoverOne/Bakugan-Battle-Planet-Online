name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-artwork-apply:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/profile-original-artwork-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile artwork branch
        uses: actions/checkout@v4
        with:
          ref: fix/profile-original-artwork-v2
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply profile artwork implementation
        run: python .github/scripts/apply-profile-original-artwork.py
      - name: Verify implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm ci --ignore-scripts
          node --import tsx --test tests/profile-customization.test.ts
          npm run lint
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete original profile artwork implementation"
          git push origin HEAD:fix/profile-original-artwork-v2

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
