name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-artwork-apply:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/profile-original-artwork-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile artwork branch
        uses: actions/checkout@v4
        with:
          ref: fix/profile-original-artwork-v2
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture verification diagnostics
        shell: bash
        run: |
          set +e
          LOG=/tmp/profile-verify.log
          : > "$LOG"
          python .github/scripts/apply-profile-original-artwork.py >> "$LOG" 2>&1
          echo "PATCH_EXIT=$?" >> "$LOG"
          git diff --check >> "$LOG" 2>&1
          echo "DIFF_EXIT=$?" >> "$LOG"
          npm ci --ignore-scripts >> "$LOG" 2>&1
          echo "NPM_CI_EXIT=$?" >> "$LOG"
          node --import tsx --test tests/profile-customization.test.ts >> "$LOG" 2>&1
          echo "PROFILE_TEST_EXIT=$?" >> "$LOG"
          npm run lint >> "$LOG" 2>&1
          echo "LINT_EXIT=$?" >> "$LOG"
          git reset --hard HEAD
          git clean -fd
          cp "$LOG" .profile-verify.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .profile-verify.log
          git commit -m "Capture profile artwork verification diagnostics"
          git push origin HEAD:fix/profile-original-artwork-v2

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
