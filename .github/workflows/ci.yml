name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/generalized-rules-primitives

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-generalized-rules:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/generalized-rules-primitives'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feature/generalized-rules-primitives
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply implementation
        run: python3 scripts/apply-generalized-rules-primitives.py
      - name: Targeted rules tests
        run: node --import tsx --test tests/rules-primitives.test.ts tests/turn-draw-mechanic.test.ts tests/bakucore-choice-regressions.test.ts
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/rules/primitives.ts lib/rules/model.ts lib/rules/objects.ts lib/rules/choices.ts lib/rules/catalogue-structure.ts lib/rules/catalogue-primitives.ts lib/rules/index.ts lib/game.ts tests/rules-primitives.test.ts package.json
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "Implement generalized rules primitives"
          git push origin HEAD:feature/generalized-rules-primitives

  validate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
