name: Validate mobile overlay layering

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm run install:ci
      - name: Run focused regressions
        run: >-
          node --import tsx --test
          tests/mobile-overlay-layering.test.ts
          tests/brawl-presentation.test.ts
      - name: Build application
        run: npm run build
      - name: Remove temporary workflows
        shell: bash
        run: |
          git config user.name "UnCoverOne"
          git config user.email "291861529+UnCoverOne@users.noreply.github.com"
          git rm .github/workflows/export-mobile-overlay-source.yml
          git rm .github/workflows/validate-mobile-overlay-layering.yml
          git commit -m "Clean mobile overlay validation workflows"
          git push origin HEAD:${{ github.head_ref }}
