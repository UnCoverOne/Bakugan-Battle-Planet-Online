name: Promote security and reliability implementation

on:
  push:
    branches:
      - implementation/security-reliability-20260806

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-security-reliability
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: implementation/security-reliability-20260806
          fetch-depth: 0

      - name: Fast-forward main and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
          git rm .github/workflows/promote-security-reliability.yml
          git commit -m "Remove temporary promotion workflow"
          git push origin HEAD:main HEAD:implementation/security-reliability-20260806
