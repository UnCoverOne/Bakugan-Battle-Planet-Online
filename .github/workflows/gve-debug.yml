name: Final Canonical Value Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.head_ref == 'feature/unified-card-play-pipeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-card-play-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply completed migration and regression fixes
        shell: bash
        run: |
          sed -n "/python <<'PY'/,/^          PY$/p" .github/workflows/generalized-value-expressions-final-validation.yml | sed '1d;$d;s/^          //' > /tmp/migrate.py
          python /tmp/migrate.py
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing expected text for {label}")
              return text.replace(old, new, 1)

          p = Path('tests/rules-engine-modernization.test.ts')
          s = p.read_text().replace('  assert.equal(schema.fields[0]?.id, "mode");', '  assert.equal(schema.fields[0]?.id, "targetEffectId");')
          p.write_text(s)

          p = Path('tests/dynamic-value-catalogue.test.ts')
          s = p.read_text()
          s = s.replace('case "conditional": return "whenTrue" in node && "whenFalse" in node;', 'case "conditional": return !Array.isArray(node.whenTrue) && !Array.isArray(node.whenFalse) && "whenTrue" in node && "whenFalse" in node;')
          s = s.replace('`${card.catalogId} produced a non-finite value`', '`${card.catalogId} ${JSON.stringify(expression)} produced ${String(value)}`')
          p.write_text(s)

          p = Path('lib/rules/catalogue-structure.ts')
          s = p.read_text()
          s = replace_once(s,
              '  const explicitBakuganTarget = /choose (?:a|an|one|another).*Bakugan|target .*Bakugan|retract (?:(?:one of|another) )?(?:your )?(?:open )?Bakugan|give (?:a|an|one|another)(?: \\[[^\\]]+\\])? Bakugan|(?:a|an|one|another)(?: \\[[^\\]]+\\])? Bakugan gets?|to (?:a|an|one) \\[(?:Aquos|Pyrus|Darkus|Haos|Ventus|Aurelus)\\] Bakugan/i.test(text)\n    || coreAttachmentTarget;',
              '  const explicitBakuganTarget = /choose (?:a|an|one|another)(?:(?!\\bplayer\\b)[^.;])*?Bakugan|target .*Bakugan|retract (?:(?:one of|another) )?(?:your )?(?:open )?Bakugan|give (?:a|an|one|another)(?: \\[[^\\]]+\\])? Bakugan|(?:a|an|one|another)(?: \\[[^\\]]+\\])? Bakugan gets?|to (?:a|an|one) \\[(?:Aquos|Pyrus|Darkus|Haos|Ventus|Aurelus)\\] Bakugan/i.test(text)\n    || coreAttachmentTarget;',
              'explicit Bakugan target grammar')
          s = replace_once(s,
              '    const noOp: RuleAction = { kind: "cost", amount: 0, operation: "reduce", duration: "instant" };\n    const chooser: RuleInstruction = {\n      ...current,\n      id: `${ruleCardId(card)}:battle-mastery-choice`,\n      condition: { kind: "always" },\n      effects: [noOp],\n      actions: [noOp],',
              '    const noOp: RuleAction = { kind: "cost", amount: 0, operation: "reduce", duration: "instant" };\n    const triggerEffects = current.effects.filter((effect) => effect.kind === "trigger");\n    const chooserEffects: RuleAction[] = triggerEffects.length ? [...triggerEffects, noOp] : [noOp];\n    const chooser: RuleInstruction = {\n      ...current,\n      id: `${ruleCardId(card)}:battle-mastery-choice`,\n      condition: { kind: "always" },\n      effects: chooserEffects,\n      actions: chooserEffects,',
              'Battle Mastery trigger preservation')
          old = '''    const continuesTrigger = Boolean(activeTrigger) && /^(?:then\\b|shuffle\\s+your\\s+deck\\b|you\\s+may\\s+(?:put|play|attach)\\s+(?:it|that\\s+card|the\\s+(?:chosen|revealed)\\s+card|an?\\s+\\[(?:FT|FF|SD|MS|HE)\\])\\b|if\\s+(?:it(?:['’]?s|\\b)|they\\b|you do\\b|an?\\s+[^,.]+\\s+cards?\\s+is\\s+revealed\\s+this\\s+way\\b|one\\s+of\\s+(?:them|those\\s+cards)\\b|the\\s+revealed\\s+card\\b))/i.test(\n      instruction.sourceText.trim(),\n    );'''
          new = '''    const continuesTrigger = Boolean(activeTrigger) && (\n      instruction.condition.kind === "mode-selected"\n      || /^(?:then\\b|shuffle\\s+your\\s+deck\\b|you\\s+may\\s+(?:put|play|attach)\\s+(?:it|that\\s+card|the\\s+(?:chosen|revealed)\\s+card|an?\\s+\\[(?:FT|FF|SD|MS|HE)\\])\\b|if\\s+(?:it(?:['’]?s|\\b)|they\\b|you do\\b|an?\\s+[^,.]+\\s+cards?\\s+is\\s+revealed\\s+this\\s+way\\b|one\\s+of\\s+(?:them|those\\s+cards)\\b|the\\s+revealed\\s+card\\b))/i.test(\n        instruction.sourceText.trim(),\n      )\n    );'''
          s = replace_once(s, old, new, 'Battle Mastery trigger grouping')
          p.write_text(s)

          p = Path('tests/bakucore-choice-regressions.test.ts')
          s = p.read_text()
          s = replace_once(s,
              '  state.selected = { [first.id]: first.bakugan[0].id, [second.id]: second.bakugan[0].id };\n  first.bakugan[0].open = true;',
              '  state.selected = { [first.id]: first.bakugan[0].id, [second.id]: second.bakugan[0].id };\n  state.placements = [\n    { playerId: first.id, core: first.cores[0], cell: "test-core-first", order: 1 },\n    { playerId: second.id, core: second.cores[0], cell: "test-core-second", order: 2 },\n  ];\n  first.bakugan[0].open = true;',
              'BakuCore test Field fixture')
          p.write_text(s)

          p = Path('tests/deck-inspection.test.ts')
          s = p.read_text()
          s = replace_once(s,
              '  const cards = CARDS.filter((card) => card.type === "Action").slice(0, 5).map(deckCard);',
              '  const cards = CARDS.filter((card) => card.type === "Action" && ruleDefinitionForCard(card).play.choices.filter((choice) => choice.timing === "announce").length === 0).slice(0, 5).map(deckCard);',
              'legal reveal/play deck fixture')
          s = replace_once(s,
              '    const initial = matchWithKnownDeck();\n    const card = catalogueCard(catalogId, `${catalogId}-reveal-skip`);',
              '    const initial = matchWithKnownDeck();\n    if (catalogId === "aa-140") initial.brawlWinner = "a";\n    const card = catalogueCard(catalogId, `${catalogId}-reveal-skip`);',
              'Victor reveal skip fixture')
          s = replace_once(s,
              '    const initial = matchWithKnownDeck();\n    const source = catalogueCard(catalogId, `${catalogId}-play-choice`);',
              '    const initial = matchWithKnownDeck();\n    if (catalogId === "aa-140") initial.brawlWinner = "a";\n    const source = catalogueCard(catalogId, `${catalogId}-play-choice`);',
              'Victor reveal play fixture')
          p.write_text(s)
          PY
      - run: npm ci
      - name: Focused generalized-value and card-play coverage
        run: npx tsx --test tests/value-expressions.test.ts tests/dynamic-value-catalogue.test.ts tests/rules-primitives.test.ts tests/card-payment.test.ts tests/card-play-pipeline.test.ts tests/pact-cubbo-regressions.test.ts tests/rules-engine-modernization.test.ts
      - name: Full rules suite
        run: npm run test:rules
      - name: Full gameplay suite
        run: npm run test:gameplay
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Enforce one canonical numeric implementation
        shell: bash
        run: |
          if grep -R -n -E 'AmountExpression|amountExpression|evaluateAmountExpression|amountExpressionForScale|CostScale|printedScaleMultiplier' lib --include='*.ts'; then
            echo 'Legacy numeric expression implementation remains.' >&2
            exit 1
          fi
          if grep -R -n -E 'scale\?: (string|CostScale)|modifier\.scale|action\.scale' lib/rules lib/game.ts --include='*.ts'; then
            echo 'Legacy numeric scale side channel remains.' >&2
            exit 1
          fi
      - name: Commit validated product changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib tests
          git commit -m 'refactor: complete canonical dynamic value system'
          git push origin HEAD:feature/unified-card-play-pipeline
