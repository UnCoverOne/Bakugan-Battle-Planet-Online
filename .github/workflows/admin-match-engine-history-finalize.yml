name: Finalize Administrator Match Log Export

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/admin-match-engine-history-finalize.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Implement Administrator engine-history download
        run: python .github/admin-engine-history-apply.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused Administrator and replay tests
        run: node --import tsx --test tests/admin-ai-visibility.test.ts tests/replay-performance-architecture.test.ts tests/history-overhaul.test.ts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit implementation and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/admin-match-engine-history-finalize.yml .github/admin-engine-history-apply.py
          git add app/api/admin/route.ts components/game-screen-v2/GameMenuHud.tsx components/game-screen-v2/GameplayClient.tsx lib/admin-engine-history-server.ts lib/replay-journal.ts lib/replay-journal.worker.ts tests/admin-ai-visibility.test.ts
          git commit -m "Add Administrator match engine-history download"
          git push origin HEAD:main
