          import { ensureEngineEventStore } from "./engine/event-store";

          type MatchRow = {
            state_json: string;
            previous_state_json: string | null;
            updated_at: number;
          };

          type CommandRow = {
            command_id: string;
            actor_id: string;
            expected_version: number;
            result_version: number;
            request_hash: string;
            event_sequence_start: number;
            event_sequence_end: number;
