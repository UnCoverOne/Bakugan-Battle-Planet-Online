name: Apply requested gameplay fixes

on:
  push:
    branches:
      - fix/opposite-matrix-roll-resolution
    paths:
      - .github/workflows/apply-requested-gameplay-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply focused source changes
        run: node scripts/apply-requested-fixes.mjs

      - name: Install dependencies
        run: npm run install:ci

      - name: Run complete test suite
        run: npm test

      - name: Commit validated implementation
        run: |
          rm scripts/apply-requested-fixes.mjs
          rm .github/workflows/apply-requested-gameplay-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct matrix perspective and roll resolution"
          git push origin HEAD:fix/opposite-matrix-roll-resolution
