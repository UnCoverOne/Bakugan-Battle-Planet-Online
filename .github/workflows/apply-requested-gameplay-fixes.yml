name: Apply requested gameplay fixes

on:
  push:
    branches:
      - fix/opposite-matrix-roll-resolution
    paths:
      - .github/workflows/apply-requested-gameplay-fixes.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-requested-gameplay-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/opposite-matrix-roll-resolution

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply focused source changes
        run: node scripts/apply-requested-fixes.mjs

      - name: Correct perspective source assertion
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = "tests/rolling-mechanic.test.ts";
          const source = await readFile(path, "utf8");
          const before = "assert.match(placementLayer, /oppositePerspective \\? -cell\\.q : cell\\.q/);";
          const after = "assert.match(placementLayer, /oppositePerspective\\s*\\?\\s*-cell\\.q\\s*:\\s*cell\\.q/);";
          if (!source.includes(before)) throw new Error("Expected perspective assertion was not found.");
          await writeFile(path, source.replace(before, after));
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run complete test suite
        id: tests
        continue-on-error: true
        run: npm test > validation-output.log 2>&1

      - name: Upload validation output
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: validation-output
          path: validation-output.log

      - name: Fail after preserving output
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Commit validated implementation
        if: steps.tests.outcome == 'success'
        run: |
          rm -f validation-output.log
          rm scripts/apply-requested-fixes.mjs
          rm .github/workflows/apply-requested-gameplay-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct matrix perspective and roll resolution"
          git push origin HEAD:fix/opposite-matrix-roll-resolution
