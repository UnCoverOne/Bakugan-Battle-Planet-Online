name: Implement Dragonoid Maximus alternate win

on:
  pull_request:
    branches: [main]
    paths:
      - .github/dragonoid-maximus-implementation

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply implementation patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-dragonoid-maximus.yml').read_text()
          start = workflow.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          exec(compile(script, 'apply-dragonoid-maximus.py', 'exec'))
          PY
      - name: Install dependencies
        run: npm run install:ci
      - name: Run targeted regression tests
        run: node --import tsx --test tests/reported-regressions-2026-08-02.test.ts tests/brawl-presentation.test.ts tests/opponent-ai-tactics.test.ts
      - name: Build application
        run: npm run build
      - name: Commit implementation to pull request
        shell: bash
        run: |
          git config user.name "UnCoverOne"
          git config user.email "291861529+UnCoverOne@users.noreply.github.com"
          git rm .github/dragonoid-maximus-implementation
          git rm .github/workflows/apply-dragonoid-maximus.yml
          git rm .github/workflows/apply-dragonoid-maximus-pr.yml
          git add lib components tests
          git commit -m "Stage Dragonoid Maximus alternate win effect"
          git push origin HEAD:${{ github.head_ref }}
