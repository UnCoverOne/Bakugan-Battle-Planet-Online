name: Fix guest shell and profile menu main 20260808

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Apply fixes
        run: python scripts/patch-guest-shell-profile-menu-main-20260808.py

      - name: Install dependencies
        run: npm ci

      - name: Test guest and lobby regressions
        run: node --import tsx --test tests/guest-first-auth.test.ts tests/lobby-flow.test.ts

      - name: Build
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-guest-shell-profile-menu-main-20260808.yml scripts/patch-guest-shell-profile-menu-main-20260808.py
          git add components/application/AppProvider.jsx app/website-overhaul.css tests/guest-first-auth.test.ts
          git commit -m "Fix guest shell boot and profile menu width"
          git push origin HEAD:main
