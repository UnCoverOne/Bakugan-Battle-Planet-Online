name: Fix room seat capability 20260808

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Apply capability fix
        run: python scripts/patch-room-capability-20260808.py

      - name: Install dependencies
        run: npm ci

      - name: Test lobby capability regression
        run: node --import tsx --test tests/lobby-flow.test.ts

      - name: Build
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-room-seat-capability-20260808.yml scripts/patch-room-capability-20260808.py
          git add components/application/AppProvider.jsx components/routes/LobbyRoomScreen.tsx components/routes/MatchRuntime.tsx tests/lobby-flow.test.ts
          git commit -m "Fix room seat capability propagation"
          git push origin HEAD:main
