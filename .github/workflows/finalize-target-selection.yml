name: Finalize target selection

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply complete correction set
        shell: bash
        run: |
          git show bae2c27f611ae8e0ac279d091cef8b0218d5f298:.github/target-corrections.b64 > /tmp/target-corrections.b64
          base64 -d /tmp/target-corrections.b64 | gzip -d > /tmp/target-corrections.py
          python3 -m py_compile /tmp/target-corrections.py .github/finalize-target-selection.py
          python3 /tmp/target-corrections.py
          python3 .github/finalize-target-selection.py
      - name: Install dependencies
        run: npm run install:ci
      - name: Run focused regressions
        run: >-
          node --import tsx --test
          tests/underdog-target-selection.test.ts
          tests/pact-cubbo-regressions.test.ts
          tests/card-preview-state.test.ts
          tests/card-preview-interactions.test.ts
          tests/administration.test.ts
      - name: Build application
        run: npm run build
      - name: Commit final implementation
        shell: bash
        run: |
          git config user.name "UnCoverOne"
          git config user.email "291861529+UnCoverOne@users.noreply.github.com"
          git rm .github/finalize-target-selection.py
          git rm .github/workflows/finalize-target-selection.yml
          git add lib components tests
          git commit -m "Complete target locking and restriction enforcement"
          git push origin HEAD:${{ github.head_ref }}
