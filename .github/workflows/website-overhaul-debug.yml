name: Website Overhaul Debug

on:
  pull_request:
    types:
      - reopened
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'agent/website-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture full validation output
        run: |
          set +e
          npm test > website-overhaul-test.log 2>&1
          status=$?
          echo "exit_status=$status" >> website-overhaul-test.log
          npm run lint > website-overhaul-lint.log 2>&1
          echo "lint_exit_status=$?" >> website-overhaul-lint.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: website-overhaul-debug
          path: |
            website-overhaul-test.log
            website-overhaul-lint.log
          retention-days: 1
