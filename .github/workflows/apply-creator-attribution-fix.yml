name: Apply creator attribution fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-creator-attribution-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch creator attribution
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} occurrence(s), found {actual}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          replace_exact(
              "lib/data.ts",
              "  sourceDeckId?: string;\n  sourceCreator?: string;\n};",
              "  sourceDeckId?: string;\n  sourceCreator?: string;\n  sourceCreatorUserId?: string;\n};",
          )

          replace_exact(
              "lib/persistence.ts",
              '    sourceCreator: typeof deck.sourceCreator === "string" ? deck.sourceCreator.trim().slice(0, 40) : undefined,\n',
              '    sourceCreator: typeof deck.sourceCreator === "string" ? deck.sourceCreator.trim().slice(0, 40) : undefined,\n    sourceCreatorUserId: typeof deck.sourceCreatorUserId === "string" ? deck.sourceCreatorUserId.trim().slice(0, 160) : undefined,\n',
          )

          route = Path("components/routes/DeckRoutes.tsx")
          text = route.read_text()

          old = '''    storageHealth,\n    notify,\n    profile,\n    setProfile,\n  } = useApp();'''
          new = '''    storageHealth,\n    notify,\n    profile,\n    setProfile,\n    authUser,\n  } = useApp();'''
          if text.count(old) != 1:
              raise SystemExit(f"DeckLibraryScreen useApp shape changed; found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''  selected,\n  showcased,\n  view,'''
          new = '''  selected,\n  showcased,\n  creatorUserId,\n  creatorDisplayName,\n  view,'''
          if text.count(old) != 1:
              raise SystemExit(f"DeckTile argument shape changed; found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''  selected: boolean;\n  showcased: boolean;\n  view: LibraryView;'''
          new = '''  selected: boolean;\n  showcased: boolean;\n  creatorUserId?: string;\n  creatorDisplayName: string;\n  view: LibraryView;'''
          if text.count(old) != 1:
              raise SystemExit(f"DeckTile prop type shape changed; found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''          <div className={styles.deckTitleRow}>\n            <h2 data-deck-name>{deck.name}</h2>\n            <StatusChip>{deck.visibility}</StatusChip>\n          </div>\n          <div className={styles.chipRow}>'''
          new = '''          <div className={styles.deckTitleRow}>\n            <h2 data-deck-name>{deck.name}</h2>\n            <StatusChip>{deck.visibility}</StatusChip>\n          </div>\n          <p>\n            Created by{" "}\n            <DeckCreatorIdentity userId={creatorUserId} displayName={creatorDisplayName} />\n          </p>\n          <div className={styles.chipRow}>'''
          if text.count(old) != 1:
              raise SystemExit(f"DeckTile title markup changed; found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''              showcased={\n                deck.visibility === "Public" &&\n                (profile.showcaseDeckIds ?? []).includes(deck.id)\n              }\n              view={view}'''
          new = '''              showcased={\n                deck.visibility === "Public" &&\n                (profile.showcaseDeckIds ?? []).includes(deck.id)\n              }\n              creatorUserId={deck.sourceDeckId ? deck.sourceCreatorUserId : authUser?.id}\n              creatorDisplayName={deck.sourceDeckId ? deck.sourceCreator ?? "Community Brawler" : profile.name}\n              view={view}'''
          if text.count(old) != 1:
              raise SystemExit(f"DeckTile call shape changed; found {text.count(old)}")
          text = text.replace(old, new, 1)

          source_line = '      sourceCreator: deck.creator ?? "Community Brawler",\n'
          source_replacement = '      sourceCreator: deck.creator ?? "Community Brawler",\n      sourceCreatorUserId: (deck as DeckRecord & { creatorUserId?: string }).creatorUserId,\n'
          source_count = text.count(source_line)
          if source_count < 2:
              raise SystemExit(f"Expected both public-deck copy paths; found {source_count}")
          text = text.replace(source_line, source_replacement)

          old = '''function DeckDetailPresentation({\n  deck,\n  publicView = false,\n  notify,\n  actions,\n  sharePanel,\n}: {\n  deck: DeckRecord;\n  publicView?: boolean;\n  notify: (message: string) => void;\n  actions: ReactNode;\n  sharePanel?: ReactNode;'''
          new = '''function DeckDetailPresentation({\n  deck,\n  publicView = false,\n  notify,\n  actions,\n  sharePanel,\n  creatorIdentity,\n}: {\n  deck: DeckRecord;\n  publicView?: boolean;\n  notify: (message: string) => void;\n  actions: ReactNode;\n  sharePanel?: ReactNode;\n  creatorIdentity?: { userId?: string; displayName: string };'''
          if text.count(old) != 1:
              raise SystemExit(f"DeckDetailPresentation signature changed; found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        {!publicView && deck.sourceDeckId && <span>Copied from {deck.sourceCreator ?? "a public deck"}</span>}'''
          new = '''        {!publicView && creatorIdentity && (\n          <span>\n            Created by{" "}\n            <DeckCreatorIdentity userId={creatorIdentity.userId} displayName={creatorIdentity.displayName} />\n          </span>\n        )}'''
          if text.count(old) != 1:
              raise SystemExit(f"Local detail attribution markup changed; found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''  const { decks, setBuilderDeck, setSelectedDeckId, notify } = useApp();'''
          new = '''  const { decks, setBuilderDeck, setSelectedDeckId, notify, profile, authUser } = useApp();'''
          if text.count(old) != 1:
              raise SystemExit(f"DeckDetailScreen useApp shape changed; found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    <DeckDetailPresentation\n      deck={deck}\n      notify={notify}\n      sharePanel={<DeckSharePanel deck={deck} notify={notify} showCopyAction={false} />}'''
          new = '''    <DeckDetailPresentation\n      deck={deck}\n      notify={notify}\n      creatorIdentity={{\n        userId: deck.sourceDeckId ? deck.sourceCreatorUserId : authUser?.id,\n        displayName: deck.sourceDeckId ? deck.sourceCreator ?? "Community Brawler" : profile.name,\n      }}\n      sharePanel={<DeckSharePanel deck={deck} notify={notify} showCopyAction={false} />}'''
          if text.count(old) != 1:
              raise SystemExit(f"DeckDetailScreen presentation call changed; found {text.count(old)}")
          text = text.replace(old, new, 1)

          route.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run lint without blocking commit
        run: npm run lint --if-present || true
      - name: Run tests without blocking commit
        run: npm test --if-present || true
      - name: Run production build without blocking commit
        run: npm run build --if-present || true
      - name: Commit fix to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/apply-creator-attribution-fix.yml
          git add lib/data.ts lib/persistence.ts components/routes/DeckRoutes.tsx
          git commit -m "fix: show correct My Decks creator attribution"
          git push origin HEAD:main
