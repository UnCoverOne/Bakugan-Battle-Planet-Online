name: One-shot Deck Fan Curve

on:
  push:
    branches:
      - fix/deck-fan-continuous-curve
    paths:
      - ".github/workflows/one-shot-deck-fan-curve.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deck-fan-continuous-curve
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Tighten preview and apply continuous fan curve
        run: |
          python - <<'PY'
          from pathlib import Path
          css_path = Path('components/routes/DeckRoutes.module.css')
          css = css_path.read_text()
          css = css.replace('padding: 1.25rem .75rem .45rem;', 'padding: .55rem .75rem .35rem;', 1)
          css = css.replace('bottom: .45rem;\n  width: min(27%, 6.9rem);', 'bottom: .15rem;\n  width: min(30%, 7.35rem);', 1)
          css = css.replace('left: 7%;\n  transform: translateY(7%) rotate(-10deg);', 'z-index: 1;\n  left: 3%;\n  transform: translateY(7%) rotate(-9deg);', 1)
          css = css.replace('z-index: 2;\n  left: 29%;\n  transform: translateY(2%) rotate(-4deg);', 'z-index: 2;\n  left: 25%;\n  transform: translateY(1%) rotate(-3deg);', 1)
          css = css.replace('z-index: 1;\n  left: 49%;\n  transform: translateY(7%) rotate(3deg);', 'z-index: 3;\n  left: 47%;\n  transform: translateY(2%) rotate(3deg);', 1)
          css = css.replace('right: 7%;\n  bottom: .7rem;\n  width: min(28%, 7.2rem);\n  transform: rotate(10deg);', 'right: 3%;\n  bottom: .15rem;\n  width: min(30%, 7.35rem);\n  transform: translateY(7%) rotate(9deg);', 1)
          css_path.write_text(css)
          test_path = Path('tests/deck-library-visuals.test.ts')
          test = test_path.read_text()
          marker = 'test("Deck Library four-card fan keeps a continuous left-to-right stacking curve"'
          if marker not in test:
              test += '\n\ntest("Deck Library four-card fan keeps a continuous left-to-right stacking curve", async () => {\n  const css = await read("components/routes/DeckRoutes.module.css");\n  assert.match(css, /padding: \\.55rem \\.75rem \\.35rem/);\n  assert.match(css, /\\.characterFanFeatured > :nth-child\\(1\\) \\{[\\s\\S]*?z-index: 1/);\n  assert.match(css, /\\.characterFanFeatured > :nth-child\\(2\\) \\{[\\s\\S]*?z-index: 2/);\n  assert.match(css, /\\.characterFanFeatured > :nth-child\\(3\\) \\{[\\s\\S]*?z-index: 3/);\n  assert.match(css, /\\.characterFanFeatured > \\.featuredPreviewCard \\{[\\s\\S]*?z-index: 4/);\n  assert.match(css, /rotate\\(-9deg\\)/);\n  assert.match(css, /rotate\\(-3deg\\)/);\n  assert.match(css, /rotate\\(3deg\\)/);\n  assert.match(css, /rotate\\(9deg\\)/);\n});\n'
          test_path.write_text(test)
          PY
      - name: Focused regression test
        run: node --import tsx --test tests/deck-library-visuals.test.ts
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit fan refinement
        run: |
          rm .github/workflows/one-shot-deck-fan-curve.yml
          git config user.name "UnCoverOne"
          git config user.email "uncover250@gmail.com"
          git add -A
          git commit -m "Refine Deck Library four-card fan"
          git push origin HEAD:fix/deck-fan-continuous-curve
