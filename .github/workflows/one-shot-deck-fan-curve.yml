name: One-shot Deck Fan Curve

on:
  push:
    branches:
      - fix/deck-fan-continuous-curve
    paths:
      - ".github/workflows/one-shot-deck-fan-curve.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deck-fan-continuous-curve
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Tighten preview and apply continuous fan curve
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('components/routes/DeckRoutes.module.css')
          css = css_path.read_text()
          old = '''.characterFan {
  position: relative;
  min-height: 11.25rem;
  display: flex;
  align-items: end;
  justify-content: center;
  overflow: hidden;
  padding: 1.25rem .75rem .45rem;
  background:
    radial-gradient(circle at 50% 105%, rgba(34, 176, 229, .25), transparent 55%),
    linear-gradient(180deg, rgba(8, 35, 46, .55), rgba(1, 10, 15, .96));
}
'''
          new = '''.characterFan {
  position: relative;
  min-height: 11.25rem;
  display: flex;
  align-items: end;
  justify-content: center;
  overflow: hidden;
  padding: .55rem .75rem .35rem;
  background:
    radial-gradient(circle at 50% 105%, rgba(34, 176, 229, .25), transparent 55%),
    linear-gradient(180deg, rgba(8, 35, 46, .55), rgba(1, 10, 15, .96));
}
'''
          if old not in css:
              raise SystemExit('characterFan block changed unexpectedly')
          css = css.replace(old, new, 1)

          old = '''.characterFanFeatured > img,
.characterFanFeatured > .characterPlaceholder {
  position: absolute;
  bottom: .45rem;
  width: min(27%, 6.9rem);
}

.characterFanFeatured > :nth-child(1) {
  left: 7%;
  transform: translateY(7%) rotate(-10deg);
}

.characterFanFeatured > :nth-child(2) {
  z-index: 2;
  left: 29%;
  transform: translateY(2%) rotate(-4deg);
}

.characterFanFeatured > :nth-child(3) {
  z-index: 1;
  left: 49%;
  transform: translateY(7%) rotate(3deg);
}

.characterFanFeatured > .featuredPreviewCard {
  z-index: 4;
  right: 7%;
  bottom: .7rem;
  width: min(28%, 7.2rem);
  transform: rotate(10deg);
  filter: drop-shadow(0 .75rem .85rem rgba(0, 0, 0, .72));
}
'''
          new = '''.characterFanFeatured > img,
.characterFanFeatured > .characterPlaceholder {
  position: absolute;
  bottom: .15rem;
  width: min(30%, 7.35rem);
}

.characterFanFeatured > :nth-child(1) {
  z-index: 1;
  left: 3%;
  transform: translateY(7%) rotate(-9deg);
}

.characterFanFeatured > :nth-child(2) {
  z-index: 2;
  left: 25%;
  transform: translateY(1%) rotate(-3deg);
}

.characterFanFeatured > :nth-child(3) {
  z-index: 3;
  left: 47%;
  transform: translateY(2%) rotate(3deg);
}

.characterFanFeatured > .featuredPreviewCard {
  z-index: 4;
  right: 3%;
  bottom: .15rem;
  width: min(30%, 7.35rem);
  transform: translateY(7%) rotate(9deg);
  filter: drop-shadow(0 .75rem .85rem rgba(0, 0, 0, .72));
}
'''
          if old not in css:
              raise SystemExit('featured fan block changed unexpectedly')
          css = css.replace(old, new, 1)
          css_path.write_text(css)

          test_path = Path('tests/deck-library-visuals.test.ts')
          test = test_path.read_text()
          old = '''test("Deck Library CSS keeps cards compact and gives the Featured card a front fan position", async () => {
  const css = await read("components/routes/DeckRoutes.module.css");
  assert.match(css, /\\.characterFanFeatured > \\.featuredPreviewCard/);
  assert.match(css, /\\.factionSymbols img/);
  assert.match(css, /\\.favoriteButton\\[aria-pressed="true"\\]/);
  assert.match(css, /grid-template-rows: 11\\.25rem auto/);
  assert.doesNotMatch(css, /min-height: 2\\.2em/);
});
'''
          new = '''test("Deck Library CSS keeps cards compact and gives the four-card fan a continuous curve and stack", async () => {
  const css = await read("components/routes/DeckRoutes.module.css");
  assert.match(css, /padding: \\.55rem \\.75rem \\.35rem/);
  assert.match(css, /\\.characterFanFeatured > :nth-child\\(1\\) \\{[\\s\\S]*?z-index: 1/);
  assert.match(css, /\\.characterFanFeatured > :nth-child\\(2\\) \\{[\\s\\S]*?z-index: 2/);
  assert.match(css, /\\.characterFanFeatured > :nth-child\\(3\\) \\{[\\s\\S]*?z-index: 3/);
  assert.match(css, /\\.characterFanFeatured > \\.featuredPreviewCard \\{[\\s\\S]*?z-index: 4/);
  assert.match(css, /rotate\\(-9deg\\)/);
  assert.match(css, /rotate\\(-3deg\\)/);
  assert.match(css, /rotate\\(3deg\\)/);
  assert.match(css, /rotate\\(9deg\\)/);
  assert.match(css, /\\.factionSymbols img/);
  assert.match(css, /\\.favoriteButton\\[aria-pressed="true"\\]/);
  assert.match(css, /grid-template-rows: 11\\.25rem auto/);
  assert.doesNotMatch(css, /min-height: 2\\.2em/);
});
'''
          if old not in test:
              raise SystemExit('visual regression test changed unexpectedly')
          test_path.write_text(test.replace(old, new, 1))
          PY
      - name: Focused regression test
        run: node --import tsx --test tests/deck-library-visuals.test.ts
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit fan refinement
        run: |
          rm .github/workflows/one-shot-deck-fan-curve.yml
          git config user.name "UnCoverOne"
          git config user.email "uncover250@gmail.com"
          git add -A
          git commit -m "Refine Deck Library four-card fan"
          git push origin HEAD:fix/deck-fan-continuous-curve
