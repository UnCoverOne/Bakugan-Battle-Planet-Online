name: Finalize AI optional reroll patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-optional-reroll-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply implementation patch
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('scripts/patch-ai-optional-reroll.py')
          s = p.read_text()
          s = s.replace('    reroll_block + "function negateTarget(",', '    reroll_block,')
          s = s.replace(
              'if (card.type === "Action" && immediateDrawAmount > 0) {',
              'if (match.phase === "power" && card.type === "Action" && immediateDrawAmount > 0) {',
          )
          p.write_text(s)
          PY
          python scripts/patch-ai-optional-reroll.py
      - name: Install dependencies
        run: npm run install:ci
      - name: Run opponent AI tactics
        run: node --import tsx --test tests/opponent-ai-tactics.test.ts
      - name: Run Deep Dive regressions
        run: node --import tsx --test --test-name-pattern="Deep Dive" tests/reported-gameplay-regressions.test.ts
      - name: Record repository typecheck baseline
        run: npx tsc --noEmit 2>&1 | tee /tmp/typecheck.log
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/opponentAiBase.ts tests/reported-gameplay-regressions.test.ts
          git diff --cached --check
          git commit -m "Improve AI optional reroll decisions"
          git push origin HEAD:fix/ai-optional-reroll-20260807
