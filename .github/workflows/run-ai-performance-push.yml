name: Run AI performance optimization on push

on:
  push:
    branches:
      - agent/optimize-ai-forecast-performance

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-ai-forecast-performance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install, apply, validate, and publish
        shell: bash
        run: |
          set +e
          : > /tmp/ai-performance-ci-report.txt
          npm ci 2>&1 | tee -a /tmp/ai-performance-ci-report.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            python - <<'PY' 2>&1 | tee -a /tmp/ai-performance-ci-report.txt
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/optimize-ai-performance.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(index for index in range(start, len(source)) if source[index].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          brittle = 'replace_once(gameplay, old_timer, new_timer)'
          robust = '''text = read(gameplay)
effect_start = text.find("    const drawDelay = waitingForDrawWindow")
block_start = text.find("    const timeout = window.setTimeout(() => {", effect_start)
block_end = text.find("    return () => window.clearTimeout(timeout);", block_start)
if effect_start < 0 or block_start < 0 or block_end < 0:
    raise SystemExit("Could not locate the training-bot timer block")
write(gameplay, text[:block_start] + new_timer + text[block_end:])'''
          if brittle not in script:
              raise SystemExit('Could not locate the timer replacement in the generated script')
          script = script.replace(brittle, robust)
          Path('/tmp/apply-ai-performance.py').write_text(script)
          subprocess.run(['python', '/tmp/apply-ai-performance.py'], check=True)
          PY
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check 2>&1 | tee -a /tmp/ai-performance-ci-report.txt
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            npx eslint lib/opponentAiBase.ts lib/opponentAi.ts components/game-screen-v2/GameplayClient.tsx components/game-screen-v2/opponentAi.worker.ts tests/opponent-ai-tactics.test.ts 2>&1 | tee -a /tmp/ai-performance-ci-report.txt
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            node --import tsx --test tests/opponent-ai-tactics.test.ts tests/ai-roll-forecast.test.ts tests/ai-energize-planner.test.ts tests/wave-slash-ai.test.ts tests/game-engine.test.ts 2>&1 | tee -a /tmp/ai-performance-ci-report.txt
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            npm run build 2>&1 | tee -a /tmp/ai-performance-ci-report.txt
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            npm run bundle:budget 2>&1 | tee -a /tmp/ai-performance-ci-report.txt
            status=${PIPESTATUS[0]}
          fi

          rm -f .github/workflows/optimize-ai-performance.yml
          rm -f .github/workflows/run-ai-performance-optimization.yml
          rm -f .github/workflows/run-ai-performance-push.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            cp /tmp/ai-performance-ci-report.txt ai-performance-ci-report.txt
            git add -A
            git commit -m "Record AI performance optimization validation failure"
            git push origin HEAD:agent/optimize-ai-forecast-performance
            exit "$status"
          fi

          rm -f ai-performance-ci-report.txt
          git add -A
          git commit -m "Optimize opponent AI forecasting without changing tactics"
          git push origin HEAD:agent/optimize-ai-forecast-performance
