name: Unified Card Play Coverage Validation

on:
  push:
    branches: [feature/unified-card-play-pipeline]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[coverage-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-card-play-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply coverage fixes
        run: python scripts/fix-unified-card-play-coverage.py
      - name: Validate implementation
        run: |
          set +e
          : > scripts/unified-card-play-validation-3.txt
          echo '=== implementation tests ===' >> scripts/unified-card-play-validation-3.txt
          node --import tsx --test tests/card-payment.test.ts tests/card-play-pipeline.test.ts >> scripts/unified-card-play-validation-3.txt 2>&1
          CORE_STATUS=$?
          echo "core_status=$CORE_STATUS" >> scripts/unified-card-play-validation-3.txt
          echo '=== focused existing regressions ===' >> scripts/unified-card-play-validation-3.txt
          node --import tsx --test --test-name-pattern='Pact of Darkness|Divine Intervention|successful Superfuel copies|stacked Superfuel reduction' tests/pact-cubbo-regressions.test.ts tests/reroll-mechanic.test.ts >> scripts/unified-card-play-validation-3.txt 2>&1
          FOCUSED_STATUS=$?
          echo "focused_status=$FOCUSED_STATUS" >> scripts/unified-card-play-validation-3.txt
          echo '=== old baseline comparison group ===' >> scripts/unified-card-play-validation-3.txt
          node --import tsx --test tests/pact-cubbo-regressions.test.ts tests/deck-inspection.test.ts tests/reroll-mechanic.test.ts >> scripts/unified-card-play-validation-3.txt 2>&1
          BASELINE_STATUS=$?
          echo "baseline_group_status=$BASELINE_STATUS" >> scripts/unified-card-play-validation-3.txt
          echo '=== build ===' >> scripts/unified-card-play-validation-3.txt
          npm run build >> scripts/unified-card-play-validation-3.txt 2>&1
          BUILD_STATUS=$?
          echo "build_status=$BUILD_STATUS" >> scripts/unified-card-play-validation-3.txt
          echo '=== lint ===' >> scripts/unified-card-play-validation-3.txt
          npm run lint >> scripts/unified-card-play-validation-3.txt 2>&1
          LINT_STATUS=$?
          echo "lint_status=$LINT_STATUS" >> scripts/unified-card-play-validation-3.txt
          echo "implementation_overall=$(( CORE_STATUS || FOCUSED_STATUS || BUILD_STATUS || LINT_STATUS ))" >> scripts/unified-card-play-validation-3.txt
          exit 0
      - name: Commit coverage fixes and validation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib components tests scripts/unified-card-play-validation-3.txt
          git commit -m 'Complete free-play pipeline coverage [coverage-fixed]' || true
          git push
