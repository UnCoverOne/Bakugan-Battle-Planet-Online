name: Unified Card Play Fix Validation

on:
  push:
    branches: [feature/unified-card-play-pipeline]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[pipeline-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-card-play-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply focused fixes
        run: python scripts/fix-unified-card-play-pipeline.py
      - name: Validate focused pipeline behavior
        run: |
          set +e
          : > scripts/unified-card-play-validation-2.txt
          echo '=== implementation tests ===' >> scripts/unified-card-play-validation-2.txt
          node --import tsx --test tests/card-payment.test.ts tests/card-play-pipeline.test.ts >> scripts/unified-card-play-validation-2.txt 2>&1
          CORE_STATUS=$?
          echo "core_status=$CORE_STATUS" >> scripts/unified-card-play-validation-2.txt
          echo '=== Pact focused regression ===' >> scripts/unified-card-play-validation-2.txt
          node --import tsx --test --test-name-pattern='Pact of Darkness' tests/pact-cubbo-regressions.test.ts >> scripts/unified-card-play-validation-2.txt 2>&1
          PACT_STATUS=$?
          echo "pact_status=$PACT_STATUS" >> scripts/unified-card-play-validation-2.txt
          echo '=== Divine Intervention regression ===' >> scripts/unified-card-play-validation-2.txt
          node --import tsx --test --test-name-pattern='Divine Intervention' tests/reroll-mechanic.test.ts >> scripts/unified-card-play-validation-2.txt 2>&1
          DIVINE_STATUS=$?
          echo "divine_status=$DIVINE_STATUS" >> scripts/unified-card-play-validation-2.txt
          echo '=== existing baseline groups ===' >> scripts/unified-card-play-validation-2.txt
          node --import tsx --test tests/pact-cubbo-regressions.test.ts tests/deck-inspection.test.ts tests/reroll-mechanic.test.ts >> scripts/unified-card-play-validation-2.txt 2>&1
          BASELINE_GROUP_STATUS=$?
          echo "baseline_group_status=$BASELINE_GROUP_STATUS" >> scripts/unified-card-play-validation-2.txt
          echo '=== build ===' >> scripts/unified-card-play-validation-2.txt
          npm run build >> scripts/unified-card-play-validation-2.txt 2>&1
          BUILD_STATUS=$?
          echo "build_status=$BUILD_STATUS" >> scripts/unified-card-play-validation-2.txt
          echo '=== lint ===' >> scripts/unified-card-play-validation-2.txt
          npm run lint >> scripts/unified-card-play-validation-2.txt 2>&1
          LINT_STATUS=$?
          echo "lint_status=$LINT_STATUS" >> scripts/unified-card-play-validation-2.txt
          echo "implementation_overall=$(( CORE_STATUS || PACT_STATUS || DIVINE_STATUS || BUILD_STATUS || LINT_STATUS ))" >> scripts/unified-card-play-validation-2.txt
          exit 0
      - name: Commit fixes and validation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib components tests scripts/unified-card-play-validation-2.txt
          git commit -m 'Fix unified card-play pipeline regressions [pipeline-fixed]' || true
          git push
