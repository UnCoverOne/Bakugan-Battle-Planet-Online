name: Unified Card Play Runtime Diagnostics

on:
  push:
    branches: [feature/unified-card-play-pipeline]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-card-play-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Capture runtime diagnostics
        run: |
          node --import tsx <<'NODE' > scripts/unified-card-play-runtime.txt 2>&1
          import { CARD_BY_ID, CARDS, STARTER_DECKS, makePlayer } from './lib/data.ts';
          import { createMatch, passPriority } from './lib/game.ts';
          import { createRuleObject } from './lib/rules/objects.ts';
          import { ruleDefinitionForCard } from './lib/rules/catalogue.ts';
          import { compileCardEffect } from './lib/rules/effects.ts';
          import { cardCostBreakdown } from './lib/rules/costs.ts';
          function card(id, instance) { const c=CARD_BY_ID.get(id); if(!c) throw new Error(id); return {...structuredClone(c),id:instance}; }
          const first=makePlayer('first','First',STARTER_DECKS[0]);
          const second=makePlayer('second','Second',STARTER_DECKS[1]);
          let state=createMatch('SNEAKDBG','bo1',[first,second]); state.turn=3; state.phase='power'; state.priority='first'; state.startingPlayer='first';
          const sneak=card('br-10','sneak-debug'); const def=ruleDefinitionForCard(sneak); const ability=def.abilities.find(a=>a.kind!=='triggered');
          console.log('SNEAK EFFECT', sneak.effect); console.dir(compileCardEffect(sneak),{depth:12}); console.dir(def,{depth:8});
          state.batch=[createRuleObject({controllerId:'first',card:sneak,ability,kind:'card'})];
          state=passPriority(state,'first'); state=passPriority(state,'second');
          console.log('SNEAK RULES AFTER RESOLVE'); console.dir(state.rules,{depth:12});
          const evo=card('br-102','evo-debug'); console.log('FIRST EVO COST',cardCostBreakdown(state,'first',evo)); console.log('SECOND EVO COST',cardCostBreakdown(state,'second',evo));
          console.log('\nFREE COVERAGE');
          function has(actions){return actions.some(a=>a.kind==='play'&&a.free||a.kind==='cost'&&a.operation==='free'||a.kind==='sequence'&&has(a.effects)||a.kind==='conditional'&&(has(a.whenTrue)||has(a.whenFalse??[]))||a.kind==='replacement'&&has(a.replaceWith));}
          for(const c of CARDS.filter(c=>/for free|this is free/i.test(c.effect))){ const d=ruleDefinitionForCard(c); const p=compileCardEffect(c); const ok=d.play.costModifiers.some(m=>m.kind==='cost-free'||m.kind==='cost-alternative')||p.instructions.some(i=>has(i.effects)); if(!ok) console.log('MISSING',c.catalogId,c.name,'::',c.effect); }
          NODE
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/unified-card-play-runtime.txt
          git commit -m 'Record unified play runtime diagnostics [runtime-diagnostic]' || true
          git push
