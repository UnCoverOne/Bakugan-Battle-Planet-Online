name: Unified Card Play Bootstrap

on:
  push:
    branches: [feature/unified-card-play-pipeline]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[pipeline-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-card-play-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply implementation
        run: |
          set +e
          python scripts/apply-unified-card-play-pipeline.py > scripts/unified-card-play-patch.txt 2>&1
          echo "patch_status=$?" >> scripts/unified-card-play-patch.txt
          exit 0
      - name: Validate implementation
        run: |
          set +e
          : > scripts/unified-card-play-validation.txt
          echo '=== targeted tests ===' >> scripts/unified-card-play-validation.txt
          node --import tsx --test tests/card-payment.test.ts tests/pact-cubbo-regressions.test.ts tests/manual-damage.test.ts tests/deck-inspection.test.ts tests/reroll-mechanic.test.ts tests/card-play-pipeline.test.ts >> scripts/unified-card-play-validation.txt 2>&1
          TEST_STATUS=$?
          echo "targeted_status=$TEST_STATUS" >> scripts/unified-card-play-validation.txt
          echo '=== build ===' >> scripts/unified-card-play-validation.txt
          npm run build >> scripts/unified-card-play-validation.txt 2>&1
          BUILD_STATUS=$?
          echo "build_status=$BUILD_STATUS" >> scripts/unified-card-play-validation.txt
          echo '=== lint ===' >> scripts/unified-card-play-validation.txt
          npm run lint >> scripts/unified-card-play-validation.txt 2>&1
          LINT_STATUS=$?
          echo "lint_status=$LINT_STATUS" >> scripts/unified-card-play-validation.txt
          exit 0
      - name: Commit implementation and diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib components tests scripts/unified-card-play-patch.txt scripts/unified-card-play-validation.txt
          git commit -m 'Implement unified card-play pipeline [pipeline-applied]' || true
          git push
