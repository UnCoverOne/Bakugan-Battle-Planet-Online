name: Unified Card Play Diagnostics

on:
  push:
    branches: [feature/unified-card-play-pipeline]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[pipeline-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-card-play-pipeline
          path: feature
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version-file: feature/.nvmrc
      - name: Install feature dependencies
        working-directory: feature
        run: npm ci
      - name: Install baseline dependencies
        working-directory: baseline
        run: npm ci
      - name: Run branch diagnostics
        working-directory: feature
        run: |
          set +e
          : > scripts/unified-card-play-baseline.txt
          echo '=== FEATURE FAILING GROUPS ===' >> scripts/unified-card-play-baseline.txt
          node --import tsx --test tests/pact-cubbo-regressions.test.ts tests/deck-inspection.test.ts tests/reroll-mechanic.test.ts >> scripts/unified-card-play-baseline.txt 2>&1
          echo "feature_status=$?" >> scripts/unified-card-play-baseline.txt
          echo '=== COMPILED PROGRAMS ===' >> scripts/unified-card-play-baseline.txt
          node --import tsx <<'NODE' >> scripts/unified-card-play-baseline.txt 2>&1
          import { CARDS } from './lib/data.ts';
          import { compileCardEffect } from './lib/rules/effects.ts';
          for (const name of ['Sneak Attack','Pyrus Hyper Trhyno','Air Zero','Divine Intervention','Thunder Storm']) {
            const card = CARDS.find((candidate) => (candidate.displayName || candidate.name) === name || candidate.name === name);
            console.log('\n###', name, card?.catalogId, card?.effect);
            if (card) console.dir(compileCardEffect(card), { depth: 12 });
          }
          NODE
      - name: Run main baseline
        working-directory: baseline
        run: |
          set +e
          echo '=== MAIN BASELINE FAILING GROUPS ===' >> ../feature/scripts/unified-card-play-baseline.txt
          node --import tsx --test tests/pact-cubbo-regressions.test.ts tests/deck-inspection.test.ts tests/reroll-mechanic.test.ts >> ../feature/scripts/unified-card-play-baseline.txt 2>&1
          echo "baseline_status=$?" >> ../feature/scripts/unified-card-play-baseline.txt
      - name: Commit diagnostics
        working-directory: feature
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/unified-card-play-baseline.txt
          git commit -m 'Record unified pipeline baseline diagnostics [pipeline-diagnostic]' || true
          git push
