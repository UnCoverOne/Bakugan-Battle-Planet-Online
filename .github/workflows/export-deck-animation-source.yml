name: Export deck animation source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/deck-animation-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: deck-animation-source
          path: /tmp/deck-animation-source.tar.gz
          retention-days: 1
