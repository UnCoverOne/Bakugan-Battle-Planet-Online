.cardFrame::after {
  inset: -8%;
  z-index: -2;
  background: conic-gradient(from 0deg, transparent, rgba(255, 49, 34, 0.82), transparent 23%, rgba(255, 146, 75, 0.78), transparent 52%, rgba(255, 49, 34, 0.82), transparent 78%);
  filter: blur(1rem);
  animation: maximus-spin 2.2s linear infinite;
}

.cardGlow {
  inset: -28%;
  z-index: -3;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 89, 43, 0.64), rgba(177, 0, 9, 0.22) 42%, transparent 72%);
  filter: blur(0.5rem);
}

.cardFrame img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.copy {
  margin-top: 1rem;
  animation: maximus-copy-enter 580ms ease-out 620ms both;
}

.copy h2 {
  margin: 0;
  color: #fff5e9;
  font-size: clamp(2.2rem, 6vw, 5.5rem);
  font-style: italic;
  line-height: 0.86;
  letter-spacing: 0.035em;
  text-shadow:
    0 0 0.35rem #ff3b2e,
    0 0 1.3rem rgba(255, 31, 25, 0.82),
    0 0.16rem 0 #7e0709;
}

.copy strong {
  display: block;
  margin-top: 0.7rem;
  color: #ff695a;
  font-size: clamp(0.7rem, 1.2vw, 1.05rem);
  letter-spacing: 0.16em;
}

.copy p {
  margin: 0.55rem 0 0;
  color: rgba(255, 237, 229, 0.78);
  font-family: var(--font-body);
  font-size: clamp(0.78rem, 1.1vw, 1rem);
}

.layer[data-phase="aftermath"] .burst,
.layer[data-phase="aftermath"] .energyRings,
.layer[data-phase="aftermath"] .particles,
.layer[data-phase="aftermath"] .kicker,
.layer[data-phase="aftermath"] .copy {
  opacity: 0;
  transition: opacity 420ms ease;
}

.layer[data-phase="aftermath"] .cardFrame {
  transform: perspective(72rem) rotateX(0) scale(0.82);
  opacity: 0;
  transition: transform 720ms ease, opacity 720ms ease;
}

.accessibleStatus {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

@keyframes maximus-layer-enter { from { opacity: 0; } }
@keyframes maximus-burst { from { transform: translate(-50%, -50%) scale(0.08) rotate(-18deg); opacity: 0; } 58% { opacity: 1; } to { transform: translate(-50%, -50%) scale(1.08) rotate(5deg); opacity: 0.38; } }
@keyframes maximus-ring { from { transform: scale(0.2); opacity: 0.95; } to { transform: scale(1.65); opacity: 0; } }
@keyframes maximus-particle { 0% { opacity: 0; transform: rotate(var(--angle)) translateY(-2rem) scaleY(0.15); } 24% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--angle)) translateY(-17rem) scaleY(1.35); } }
@keyframes maximus-card-arrive { from { transform: perspective(72rem) translateY(9rem) rotateX(24deg) rotateZ(-7deg) scale(0.2); opacity: 0; } 68% { transform: perspective(72rem) translateY(-0.7rem) rotateX(2deg) rotateZ(1deg) scale(1.08); opacity: 1; } to { transform: perspective(72rem) rotateX(5deg) scale(1); } }
@keyframes maximus-frame-pulse { to { filter: brightness(1.42); box-shadow: 0 0 1.4rem #ff2019, 0 0 3rem rgba(255, 20, 16, 0.92); } }
@keyframes maximus-spin { to { transform: rotate(360deg); } }
@keyframes maximus-copy-enter { from { transform: translateY(1.1rem); opacity: 0; } }

@media (max-width: 620px) {
  .cardFrame { width: min(15rem, 58vw, 43vh); }
  .copy h2 { font-size: clamp(2rem, 12vw, 3.8rem); }
}

@media (prefers-reduced-motion: reduce) {
  .layer,
  .burst,
  .energyRings span,
  .particles i,
  .cardFrame,
  .cardFrame::before,
  .cardFrame::after,
  .copy {
    animation: none;
  }
  .energyRings,
  .particles { display: none; }
  .cardFrame { transform: none; }
}
