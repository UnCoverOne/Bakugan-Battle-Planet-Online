          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected patch anchor not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

