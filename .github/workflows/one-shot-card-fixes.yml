name: One-shot card fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-card-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Apply reviewed card fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          def sub_once(path, pattern, replacement, flags=0):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}: {pattern[:100]!r}")
              write(path, updated)

          def append_once(path, marker, addition):
              text = read(path)
              if marker in text:
                  return
              write(path, text.rstrip() + "\n\n" + addition.strip() + "\n")

          # --- Typed rules model -------------------------------------------------
          replace_once(
              'lib/rules/model.ts',
              '  | "batch-object"\n  | "player"',
              '  | "batch-object"\n  | "discarded-card-this-turn"\n  | "player"',
          )
          replace_once(
              'lib/rules/model.ts',
              '  | { kind: "open-bakugan-count"; comparison: "exactly" | "at-least" | "at-most" | "more-than" | "fewer-than"; amount: NumberValue }\n',
              '  | { kind: "open-bakugan-count"; comparison: "exactly" | "at-least" | "at-most" | "more-than" | "fewer-than"; amount: NumberValue }\n  | { kind: "source-only-open-bakugan" }\n',
          )
          replace_once(
              'lib/rules/model.ts',
              'target: "next-action" | "batch-action" | "chosen-batch-object" | "played-action" | "revealed-action";',
              'target: "next-action" | "batch-action" | "chosen-batch-object" | "played-action" | "revealed-action" | "discarded-action-this-turn";',
          )

          # --- AA-84: exact continuous condition -------------------------------
          marker = '  const openBakuganCount = text.match(\n'
          text = read('lib/rules/catalogue-primitives.ts')
          if 'source-only-open-bakugan' not in text:
              idx = text.index(marker)
              text = text[:idx] + '  if (/\\bif this is your only open Bakugan\\b/i.test(text)) return { kind: "source-only-open-bakugan" };\n' + text[idx:]
              write('lib/rules/catalogue-primitives.ts', text)

          replace_once(
              'lib/rules/modifiers.ts',
              '    case "open-bakugan-count": {\n      const open = player.bakugan.filter((bakugan) => bakugan.open).length;',
              '    case "source-only-open-bakugan": return Boolean(bakugan?.open && player.bakugan.filter((candidate) => candidate.open).length === 1);\n    case "open-bakugan-count": {\n      const open = player.bakugan.filter((bakugan) => bakugan.open).length;',
          )

          # --- AA-19: remember actual discard events ----------------------------
          replace_once(
              'lib/game.ts',
              '  /** Distinct factions represented by cards this player has played this turn. */\n  factionsPlayedThisTurn?: Faction[];\n',
              '  /** Distinct factions represented by cards this player has played this turn. */\n  factionsPlayedThisTurn?: Faction[];\n  /** Physical cards actually discarded from hand this turn (not merely put into discard). */\n  discardedCardIdsThisTurn?: string[];\n',
          )
          replace_once(
              'lib/game.ts',
              '    player.playedCardCostsThisTurn = []; player.playedCardTypesThisTurn = []; player.factionsPlayedThisTurn = [];\n',
              '    player.playedCardCostsThisTurn = []; player.playedCardTypesThisTurn = []; player.factionsPlayedThisTurn = []; player.discardedCardIdsThisTurn = [];\n',
          )
          replace_once(
              'lib/game.ts',
              '    if (index >= 0) { const [card]=player.hand.splice(index,1); player.discard.push(card); discarded.push(card); }\n',
              '    if (index >= 0) {\n      const [card] = player.hand.splice(index, 1);\n      player.discard.push(card);\n      discarded.push(card);\n      player.discardedCardIdsThisTurn = [...new Set([...(player.discardedCardIdsThisTurn ?? []), card.id])];\n    }\n',
          )

          # Compile Nova Burst to a history-aware copy action, before generic copy.
          replace_once(
              'lib/rules/catalogue-primitives.ts',
              '  if (/copy the effect of an Action card|copy an? Action card(?:\'s|’s) effect/i.test(text)) actions.push({ kind: "copy", target: "batch-action", independentChoices: true, targetChoiceId: "targetEffectId", count: { kind: "constant", value: 1 }, controller: "controller" });',
              '  if (/copy the effect of an Action card that was discarded this turn/i.test(text)) actions.push({ kind: "copy", target: "discarded-action-this-turn", independentChoices: true, targetChoiceId: "targetCardId", count: { kind: "constant", value: 1 }, controller: "controller" });\n  else if (/copy the effect of an Action card|copy an? Action card(?:\'s|’s) effect/i.test(text)) actions.push({ kind: "copy", target: "batch-action", independentChoices: true, targetChoiceId: "targetEffectId", count: { kind: "constant", value: 1 }, controller: "controller" });',
          )

          # Nova Burst announces a card in a discard pile that was actually discarded this turn.
          old_copy_choice = '''  if (!negateMatch && /copy (?:the effect of )?an? Action card|copy an? Action card(?:'s|’s) effect/i.test(text)) {
            const selected = choice("targetEffectId", targetTiming, "batch-object", "Choose an Action effect to copy");
            selected.cardTypes = ["Action"];
            selected.objectKinds = ["card", "copy"];
            selected.owner = "any";
            selected.targetOwner = selected.owner;
            result.push(selected);
          }
          '''
          new_copy_choice = '''  if (/copy the effect of an Action card that was discarded this turn/i.test(text)) {
            const selected = choice("targetCardId", targetTiming, "discarded-card-this-turn", "Choose an Action discarded this turn");
            selected.cardTypes = ["Action"];
            selected.owner = "any";
            selected.targetOwner = selected.owner;
            result.push(selected);
          } else if (!negateMatch && /copy (?:the effect of )?an? Action card|copy an? Action card(?:'s|’s) effect/i.test(text)) {
            const selected = choice("targetEffectId", targetTiming, "batch-object", "Choose an Action effect to copy");
            selected.cardTypes = ["Action"];
            selected.objectKinds = ["card", "copy"];
            selected.owner = "any";
            selected.targetOwner = selected.owner;
            result.push(selected);
          }
          '''
          replace_once('lib/rules/catalogue-structure.ts', old_copy_choice, new_copy_choice)

          # Expose only cards still in discard that have a discard event this turn.
          insert_after = '''    case "batch-object": {
              const owners = new Set(targetOwners(match, controllerId, {
                ...spec,
                owner: spec.owner ?? spec.targetOwner ?? "opponent",
              }, chooserId, priorChoices).map((owner) => owner.id));
              return match.batch
                .filter((object) => owners.has(object.controllerId))
                .filter((object) => !object.negated && object.status !== "negated" && object.status !== "resolved")
                .filter((object) => !spec.objectKinds?.length || spec.objectKinds.includes(object.kind))
                .filter((object) => cardMatchesSpec(object.card, spec))
                .map((object) => option(
                  object.id,
                  object.card.displayName || object.card.name,
                  object.controllerId,
                  `${object.kind === "card" ? "Card play" : object.kind} • ${object.card.type} • ${object.card.cost === "X" ? "X" : object.card.cost} Energy`,
                  cardPreview(object.card),
                ));
            }
          '''
          nova_case = '''    case "discarded-card-this-turn":
              return targetOwners(match, controllerId, spec, chooserId, priorChoices).flatMap((owner) => {
                const discardedThisTurn = new Set(owner.discardedCardIdsThisTurn ?? []);
                return owner.discard
                  .filter((candidate) => discardedThisTurn.has(candidate.id) && cardMatchesSpec(candidate, spec))
                  .map((candidate) => option(
                    candidate.id,
                    candidate.displayName || candidate.name,
                    owner.id,
                    `Discarded this turn • ${candidate.type} • ${candidate.cost === "X" ? "X" : candidate.cost} Energy`,
                    cardPreview(candidate),
                  ));
              });
          '''
          text = read('lib/rules/choices.ts')
          if 'case "discarded-card-this-turn"' not in text:
              if insert_after not in text:
                  raise SystemExit('lib/rules/choices.ts: batch-object insertion anchor changed')
              text = text.replace(insert_after, insert_after + nova_case, 1)
              write('lib/rules/choices.ts', text)
          replace_once(
              'lib/rules/choices.ts',
              '  if (spec.selector === "batch-object") return "batch-object";\n',
              '  if (spec.selector === "batch-object") return "batch-object";\n  if (spec.selector === "discarded-card-this-turn") return "card";\n',
          )

          # Copy the reviewed spell ability from the selected discarded card.
          runtime_anchor = '''      if (action.target === "revealed-action") {'''
          nova_runtime = '''      if (action.target === "discarded-action-this-turn") {
                const selectedId = choices.targetCardId;
                if (typeof selectedId !== "string") return;
                const owner = state.players.find((candidate) => (
                  (candidate.discardedCardIdsThisTurn ?? []).includes(selectedId)
                  && candidate.discard.some((discarded) => discarded.id === selectedId && discarded.type === "Action")
                ));
                const selected = owner?.discard.find((discarded) => discarded.id === selectedId && discarded.type === "Action");
                if (!owner || !selected) return;
                const definition = ruleDefinitionForCard(selected);
                const ability = definition.abilities.find((candidate) => candidate.kind === "spell") ?? definition.abilities[0];
                if (!ability) return;
                for (const copyControllerId of copyControllers) {
                  for (let copyIndex = 0; copyIndex < count; copyIndex += 1) {
                    state.batch.push(createRuleObject({
                      controllerId: copyControllerId,
                      cardOwnerId: owner.id,
                      card: selected,
                      ability,
                      choices: {},
                      kind: "copy",
                      sourceId: selected.id,
                    }));
                  }
                }
                return;
              }
          '''
          text = read('lib/game.ts')
          if 'action.target === "discarded-action-this-turn"' not in text:
              if runtime_anchor not in text:
                  raise SystemExit('lib/game.ts: copy runtime anchor changed')
              text = text.replace(runtime_anchor, nova_runtime + runtime_anchor, 1)
              write('lib/game.ts', text)

          # --- BR-104: faction Stops consult effective Bakugan factions ----------
          replace_once(
              'lib/game.ts',
              'import { effectiveCardFactions } from "./rules/derived-characteristics";',
              'import { effectiveBakuganFactions, effectiveCardFactions } from "./rules/derived-characteristics";',
          )
          old_stop = '''  const faction = state.damageFaction ?? attackingBakugan?.faction;
            // Legacy and hand-built snapshots may omit the attack source. Normal games
            // always carry it; preserve those snapshots rather than rejecting every Flip.
            if (!faction) return true;
            const non = text.match(/\\[Stop\\] non-\\[(Aquos|Pyrus|Darkus|Haos|Ventus|Aurelus)\\]/i);
            if (non) return faction !== non[1];
            const listed = [...text.matchAll(/\\[(Aquos|Pyrus|Darkus|Haos|Ventus|Aurelus)\\]/gi)]
              .map((match) => match[1]);
            return /\\[Stop\\]/i.test(text) && listed.includes(faction);
          '''
          new_stop = '''  const factions = attackingBakugan
              ? effectiveBakuganFactions(attackingBakugan)
              : state.damageFaction ? [state.damageFaction] : [];
            // Legacy and hand-built snapshots may omit the attack source. Normal games
            // always carry it; preserve those snapshots rather than rejecting every Flip.
            if (!factions.length) return true;
            const non = text.match(/\\[Stop\\] non-\\[(Aquos|Pyrus|Darkus|Haos|Ventus|Aurelus)\\]/i);
            if (non) return !factions.includes(non[1] as Faction);
            const listed = [...text.matchAll(/\\[(Aquos|Pyrus|Darkus|Haos|Ventus|Aurelus)\\]/gi)]
              .map((match) => match[1] as Faction);
            return /\\[Stop\\]/i.test(text) && listed.some((faction) => factions.includes(faction));
          '''
          replace_once('lib/game.ts', old_stop, new_stop)

          # --- Regression tests --------------------------------------------------
          replace_once(
              'tests/reported-gameplay-regressions-2026-08.test.ts',
              '  emitGameEvent,\n  passPriority,',
              '  emitGameEvent,\n  flipStopsDamage,\n  passPriority,',
          )

          tests = r'''
          test("AA-84 Hyper Pyravian Ultra grants FrostStrike only while it is the controller's sole open Bakugan", () => {
            const player = makePlayer("pyravian", "Pyravian", STARTER_DECKS[0]);
            const opponent = makePlayer("pyravian-opponent", "Opponent", STARTER_DECKS[1]);
            const state = createMatch("PYRAVIAN-ONLY-OPEN", "bo1", [player, opponent]);
            const livePlayer = state.players.find((candidate) => candidate.id === player.id)!;
            const source = livePlayer.bakugan[0];
            const other = livePlayer.bakugan[1];
            const evo = card("aa-84", "aa-84-regression");
            source.evoStack = [evo];
            source.open = true;
            other.open = false;

            const instruction = compileCardEffect(evo).instructions.find((candidate) => /only open Bakugan/i.test(candidate.sourceText));
            assert.ok(instruction);
            assert.deepEqual(instruction.condition, { kind: "source-only-open-bakugan" });
            assert.equal(evaluateBakuganCharacteristics(state, source, livePlayer).frostStrike, 3);

            other.open = true;
            assert.equal(evaluateBakuganCharacteristics(state, source, livePlayer).frostStrike, 0);

            source.open = false;
            other.open = true;
            assert.equal(evaluateBakuganCharacteristics(state, source, livePlayer).frostStrike, 0);
          });

          test("AA-19 Nova Burst selects and copies only an Action actually discarded this turn", () => {
            const player = makePlayer("nova", "Nova", STARTER_DECKS[0]);
            const opponent = makePlayer("nova-opponent", "Opponent", STARTER_DECKS[1]);
            const nova = card("aa-19", "aa-19-regression");
            const eligible = card("bb-2", "nova-eligible-action");
            const stale = card("bb-3", "nova-stale-action");
            player.hand = [nova];
            player.discard = [eligible, stale];
            player.discardedCardIdsThisTurn = [eligible.id];
            addUntappedEnergy(player, 3);

            let state = createMatch("NOVA-BURST-DISCARD", "bo1", [player, opponent]);
            const livePlayer = state.players.find((candidate) => candidate.id === player.id)!;
            const liveOpponent = state.players.find((candidate) => candidate.id === opponent.id)!;
            livePlayer.hand = [nova];
            livePlayer.discard = [eligible, stale];
            livePlayer.discardedCardIdsThisTurn = [eligible.id];
            addUntappedEnergy(livePlayer, 3);
            state.turn = 2;
            state.phase = "power";
            state.stepLabel = "Brawl Phase • Power Step";
            state.startingPlayer = livePlayer.id;
            state.initialStartingPlayer = livePlayer.id;
            state.priority = livePlayer.id;
            livePlayer.bakugan[0].open = true;
            liveOpponent.bakugan[0].open = true;
            state.selected[livePlayer.id] = livePlayer.bakugan[0].id;
            state.selected[liveOpponent.id] = liveOpponent.bakugan[0].id;
            state.rolls[livePlayer.id] = successfulRoll(livePlayer.id, livePlayer.bakugan[0].id);
            state.rolls[liveOpponent.id] = successfulRoll(liveOpponent.id, liveOpponent.bakugan[0].id);

            const definition = ruleDefinitionForCard(nova);
            const targetChoice = definition.play.choices.find((choice) => choice.id === "targetCardId");
            assert.equal(targetChoice?.selector, "discarded-card-this-turn");
            assert.equal(targetChoice?.timing, "announce");
            const copyAction = definition.abilities.flatMap((ability) => ability.instructions)
              .flatMap((instruction) => instruction.effects)
              .find((action) => action.kind === "copy");
            assert.equal(copyAction?.kind === "copy" ? copyAction.target : undefined, "discarded-action-this-turn");

            state = playCard(state, livePlayer.id, nova.id);
            const field = state.pendingChoice?.schema.fields.find((candidate) => candidate.id === "targetCardId");
            assert.deepEqual(field?.options.map((option) => option.id), [eligible.id]);
            state = submitCardChoice(state, livePlayer.id, { targetCardId: eligible.id });
            state = resolveTopBatchObject(state);
            assert.ok(state.batch.some((object) => object.kind === "copy" && object.card.id === eligible.id));

            const illegalState = structuredClone(state);
            illegalState.batch = [];
            const spell = definition.abilities.find((ability) => ability.kind === "spell")!;
            illegalState.batch = [createRuleObject({
              controllerId: livePlayer.id,
              card: nova,
              ability: spell,
              choices: { targetCardId: stale.id },
              kind: "card",
              sourceId: nova.id,
            })];
            illegalState.priority = livePlayer.id;
            const afterIllegal = resolveTopBatchObject(illegalState);
            assert.equal(afterIllegal.batch.some((object) => object.kind === "copy" && object.card.id === stale.id), false);
          });

          test("BR-104 Titan Dragonoid Ultra counts as every faction for faction and non-faction Stops", () => {
            const attacker = makePlayer("titan-attacker", "Attacker", STARTER_DECKS[0]);
            const defender = makePlayer("titan-defender", "Defender", STARTER_DECKS[1]);
            const state = createMatch("TITAN-STOP-FACTIONS", "bo1", [attacker, defender]);
            const liveAttacker = state.players.find((candidate) => candidate.id === attacker.id)!;
            const liveDefender = state.players.find((candidate) => candidate.id === defender.id)!;
            const titan = card("br-104", "br-104-regression");
            const attacking = liveAttacker.bakugan[0];
            attacking.evoStack = [titan];
            attacking.open = true;
            state.phase = "damage";
            state.pendingLoser = liveDefender.id;
            state.pendingDamage = 5;
            state.damageOrigin = attacking.id;
            state.damageFaction = "Aurelus";

            for (const faction of ["Aquos", "Aurelus", "Darkus", "Haos", "Pyrus", "Ventus"] as const) {
              const positive = {
                ...card("bb-140", `positive-stop-${faction}`),
                effect: `[Stop] [${faction}].`,
              };
              assert.equal(flipStopsDamage(state, positive), true, `${faction} Stop should match Titan Dragonoid Ultra`);

              const negative = {
                ...card("bb-140", `negative-stop-${faction}`),
                effect: `[Stop] non-[${faction}].`,
              };
              assert.equal(flipStopsDamage(state, negative), false, `non-${faction} Stop should not match Titan Dragonoid Ultra`);
            }

            state.damageOrigin = "card-generated-attack";
            state.damageFaction = "Pyrus";
            const pyrusStop = { ...card("bb-140", "pyrus-card-attack-stop"), effect: "[Stop] [Pyrus]." };
            const aquosStop = { ...card("bb-140", "aquos-card-attack-stop"), effect: "[Stop] [Aquos]." };
            assert.equal(flipStopsDamage(state, pyrusStop), true);
            assert.equal(flipStopsDamage(state, aquosStop), false);
          });
          '''
          append_once(
              'tests/reported-gameplay-regressions-2026-08.test.ts',
              'AA-19 Nova Burst selects and copies only an Action actually discarded this turn',
              tests,
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run targeted regression tests
        run: node --import tsx --test tests/reported-gameplay-regressions-2026-08.test.ts
      - name: Typecheck/build
        run: npm run build
      - name: Commit fixes to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/game.ts lib/rules/model.ts lib/rules/catalogue-primitives.ts lib/rules/catalogue-structure.ts lib/rules/choices.ts lib/rules/modifiers.ts tests/reported-gameplay-regressions-2026-08.test.ts
          git commit -m "Fix Nova Burst, Hyper Pyravian, and faction Stops"
          git push origin HEAD:main
