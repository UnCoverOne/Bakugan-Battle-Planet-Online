name: Implement Underdog and target selection

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply engine and interface implementation
        shell: bash
        run: |
          cat > /tmp/implementation.b64 <<'B64'
          
          B64
          tr -d '[:space:]' < /tmp/implementation.b64 | base64 -d | gzip -d > /tmp/implement.py
          python3 /tmp/implement.py
      - name: Install dependencies
        run: npm run install:ci
      - name: Run focused regressions
        run: node --import tsx --test tests/underdog-target-selection.test.ts tests/pact-cubbo-regressions.test.ts tests/administration.test.ts tests/card-preview-state.test.ts tests/card-preview-interactions.test.ts
      - name: Build application
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "UnCoverOne"
          git config user.email "291861529+UnCoverOne@users.noreply.github.com"
          git rm .github/workflows/investigate-target-selection.yml
          git rm .github/workflows/implement-underdog-target-selection.yml
          git add lib components tests package.json
          git commit -m "Fix Underdog triggers and pre-Batch target selection"
          git push origin HEAD:${{ github.head_ref }}
