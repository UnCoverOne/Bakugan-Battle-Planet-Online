name: Agent Energy Zone Count Animation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/energy-zone-count-animation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply Energy zone implementation
        run: python scripts/agent-energy-zone-animation-patch.py
      - name: Run focused Energy zone regressions
        run: node --import tsx --test tests/game-screen-state.test.ts tests/presentation-stability.test.ts
      - name: Build production application
        run: npm run build
      - name: Commit implementation
        run: |
          rm scripts/agent-energy-zone-animation-patch.py .github/workflows/agent-energy-zone-animation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Energy zone count and Energize animation"
          git push origin HEAD:agent/energy-zone-count-animation
