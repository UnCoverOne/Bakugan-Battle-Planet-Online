name: Verify targeting staging

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Inspect staged payload
        shell: bash
        run: |
          wc -c .github/implement-underdog-target-selection.b64 .github/targeting-chunk-01 .github/targeting-chunk-02 .github/targeting-chunk-03 .github/targeting-chunk-04
          sha256sum .github/implement-underdog-target-selection.b64 .github/targeting-chunk-01 .github/targeting-chunk-02 .github/targeting-chunk-03 .github/targeting-chunk-04
          cat .github/implement-underdog-target-selection.b64 .github/targeting-chunk-01 .github/targeting-chunk-02 .github/targeting-chunk-03 .github/targeting-chunk-04 > /tmp/all.b64
          echo COMBINED
          wc -c /tmp/all.b64
          sha256sum /tmp/all.b64
          base64 -d /tmp/all.b64 | gzip -t
