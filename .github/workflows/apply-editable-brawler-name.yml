name: Apply editable Brawler Name

on:
  push:
    branches:
      - agent/editable-brawler-name

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/editable-brawler-name
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Implement editable Brawler Name
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"Start marker not found in {path}: {start!r}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"End marker not found in {path}: {end!r}")
              file.write_text(text[:start_index] + replacement + text[end_index:])

          replace_once(
              "lib/account-server.ts",
              'export function validateAccountInput(email: string, password: string, displayName?: string) {\n',
              '''const RESERVED_BRAWLER_NAMES = /^(admin|administrator|moderator|official|support)$/i;\n\nexport function normalizeBrawlerName(value: string) {\n  const normalized = value.trim().replace(/\\s+/g, " ");\n  if (!normalized || normalized.length > 20) {\n    throw new Error("Brawler Name must be between 1 and 20 characters.");\n  }\n  if (!/^[\\p{L}\\p{N} _'-]+$/u.test(normalized)) {\n    throw new Error(\n      "Brawler Name may use letters, numbers, spaces, apostrophes, underscores, or hyphens.",\n    );\n  }\n  if (RESERVED_BRAWLER_NAMES.test(normalized)) {\n    throw new Error("That reserved Brawler Name cannot be used.");\n  }\n  return normalized;\n}\n\nexport function validateAccountInput(email: string, password: string, displayName?: string) {\n''',
          )
          replace_once(
              "lib/account-server.ts",
              '  if (displayName != null && (!displayName.trim() || displayName.trim().length > 20)) throw new Error("Brawler name must be between 1 and 20 characters.");\n',
              '  if (displayName != null) normalizeBrawlerName(displayName);\n',
          )

          replace_once(
              "app/api/auth/route.ts",
              '  getAccountBan, getAccountRoles, getSessionUser, getUserByEmail, normalizeEmail, passwordRecordNeedsUpgrade,\n',
              '  getAccountBan, getAccountRoles, getSessionUser, getUserByEmail, normalizeBrawlerName, normalizeEmail, passwordRecordNeedsUpgrade,\n',
          )
          replace_once(
              "app/api/auth/route.ts",
              '''      const email = validateAccountInput(String(body.email ?? ""), String(body.password ?? ""), String(body.displayName ?? ""));\n      const displayName = String(body.displayName ?? "").trim();\n''',
              '''      const displayName = normalizeBrawlerName(String(body.displayName ?? ""));\n      const email = validateAccountInput(\n        String(body.email ?? ""),\n        String(body.password ?? ""),\n        displayName,\n      );\n''',
          )
          replace_once(
              "app/api/auth/route.ts",
              '''    if (action === "update-profile") {\n      const displayName = String(body.displayName ?? "").trim();\n      if (!displayName || displayName.length > 20) return json({ error: "Brawler name must be between 1 and 20 characters." }, 400);\n''',
              '''    if (action === "update-profile") {\n      const displayName = normalizeBrawlerName(String(body.displayName ?? ""));\n''',
          )

          replace_between(
              "components/application/AppProvider.jsx",
              "  const saveAccountProfile = useCallback",
              "  const changePassword",
              '''  const saveAccountProfile = useCallback(async (updates = {}) => {\n    const displayName = String(updates.displayName ?? profile.name)\n      .trim()\n      .replace(/\\s+/g, " ");\n    const faction = updates.faction ?? profile.faction;\n    if (!displayName || displayName.length > 20) {\n      throw new Error("Brawler Name must be between 1 and 20 characters.");\n    }\n    if (!authUser) {\n      setProfile((current) => ({ ...current, name: displayName, faction }));\n      notify("Brawler Name saved on this device.");\n      return { displayName, faction };\n    }\n    const response = await fetch("/api/auth", {\n      method: "POST",\n      headers: { "content-type": "application/json" },\n      body: JSON.stringify({\n        action: "update-profile",\n        displayName,\n        faction,\n      }),\n    });\n    const result = await readJsonResponse(\n      response,\n      "Account profile returned an invalid response.",\n    );\n    if (!response.ok || !result.user) {\n      throw new Error(result.error ?? "Could not update the Brawler Name.");\n    }\n    setAuthUser(result.user);\n    setProfile((current) => ({\n      ...current,\n      name: result.user.displayName,\n      faction: result.user.faction,\n      signedIn: true,\n    }));\n    setModifiedAt(Date.now());\n    notify("Brawler Name updated.");\n    return result.user;\n  }, [authUser, notify, profile.faction, profile.name, setModifiedAt, setProfile]);\n''',
          )

          replace_once(
              "components/routes/SettingsScreen.tsx",
              '''    signOutAccount,\n    requestAccountAccess,\n''',
              '''    signOutAccount,\n    saveAccountProfile,\n    requestAccountAccess,\n''',
          )
          replace_once(
              "components/routes/SettingsScreen.tsx",
              '  const [section, setSection] = useState<Section>("Account");\n',
              '  const [section, setSection] = useState<Section>("Account");\n  const [brawlerName, setBrawlerName] = useState(profile.name);\n',
          )
          replace_once(
              "components/routes/SettingsScreen.tsx",
              '''  useEffect(\n    () => () => {\n      if (savedTimer.current) clearTimeout(savedTimer.current);\n    },\n    [],\n  );\n\n''',
              '''  useEffect(\n    () => () => {\n      if (savedTimer.current) clearTimeout(savedTimer.current);\n    },\n    [],\n  );\n\n  useEffect(() => {\n    setBrawlerName(profile.name);\n  }, [profile.name]);\n\n''',
          )
          replace_once(
              "components/routes/SettingsScreen.tsx",
              '  const submitPassword = async (event: React.FormEvent) => {\n',
              '''  const submitBrawlerName = async (event: React.FormEvent) => {\n    event.preventDefault();\n    const normalizedBrawlerName = brawlerName.trim().replace(/\\s+/g, " ");\n    setAccountBusy(true);\n    setAccountError("");\n    try {\n      await saveAccountProfile({ displayName: normalizedBrawlerName });\n      setBrawlerName(normalizedBrawlerName);\n      setSavedField("Brawler Name updated");\n      if (savedTimer.current) clearTimeout(savedTimer.current);\n      savedTimer.current = setTimeout(() => setSavedField(""), 2200);\n    } catch (error) {\n      setAccountError(\n        error instanceof Error\n          ? error.message\n          : "Could not update the Brawler Name.",\n      );\n    } finally {\n      setAccountBusy(false);\n    }\n  };\n\n  const submitPassword = async (event: React.FormEvent) => {\n''',
          )
          replace_once(
              "components/routes/SettingsScreen.tsx",
              '''                  <form\n                    className={styles.passwordForm}\n                    onSubmit={submitPassword}\n                  >\n''',
              '''                  <form\n                    className={styles.passwordForm}\n                    onSubmit={submitBrawlerName}\n                  >\n                    <h3>Brawler identity</h3>\n                    <Field\n                      label="Brawler Name"\n                      hint="Shown on your Profile, published identity, and matches. Use 1–20 characters."\n                    >\n                      <input\n                        type="text"\n                        autoComplete="nickname"\n                        minLength={1}\n                        maxLength={20}\n                        value={brawlerName}\n                        onChange={(event) => setBrawlerName(event.target.value)}\n                        required\n                      />\n                    </Field>\n                    <ActionButton\n                      type="submit"\n                      tone="secondary"\n                      disabled={\n                        accountBusy ||\n                        !brawlerName.trim() ||\n                        brawlerName.trim().replace(/\\s+/g, " ") === profile.name\n                      }\n                    >\n                      Update Brawler Name\n                    </ActionButton>\n                  </form>\n                  <form\n                    className={styles.passwordForm}\n                    onSubmit={submitPassword}\n                  >\n''',
          )

          modal = Path("components/application/AccountAccessModal.tsx")
          modal_text = modal.read_text().replace("Brawler name", "Brawler Name")
          modal.write_text(modal_text)

          test_file = Path("tests/brawler-name.test.ts")
          test_file.write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\nimport { normalizeBrawlerName } from "../lib/account-server";\n\nconst source = (path: string) => readFileSync(path, "utf8");\n\ntest("Brawler Name normalization is shared by registration and account updates", () => {\n  assert.equal(normalizeBrawlerName("  Mira   Nova  "), "Mira Nova");\n  assert.equal(normalizeBrawlerName("Brawler_250"), "Brawler_250");\n  assert.throws(() => normalizeBrawlerName("   "), /between 1 and 20/);\n  assert.throws(() => normalizeBrawlerName("x".repeat(21)), /between 1 and 20/);\n  assert.throws(() => normalizeBrawlerName("Mira<script>"), /letters, numbers/);\n  assert.throws(() => normalizeBrawlerName("administrator"), /reserved Brawler Name/);\n\n  const authRoute = source("app/api/auth/route.ts");\n  assert.match(authRoute, /normalizeBrawlerName\(String\(body\.displayName/);\n  assert.match(authRoute, /UPDATE users SET display_name = \?, faction = \?/);\n});\n\ntest("Settings exposes an explicit Brawler Name account action", () => {\n  const settings = source("components/routes/SettingsScreen.tsx");\n  const provider = source("components/application/AppProvider.jsx");\n  const accountAccess = source("components/application/AccountAccessModal.tsx");\n\n  assert.match(settings, /label="Brawler Name"/);\n  assert.match(settings, /Update Brawler Name/);\n  assert.match(settings, /saveAccountProfile\(\{ displayName: normalizedBrawlerName \}\)/);\n  assert.match(settings, /maxLength=\{20\}/);\n  assert.match(provider, /action: "update-profile"/);\n  assert.match(provider, /name: result\.user\.displayName/);\n  assert.match(provider, /setAuthUser\(result\.user\)/);\n  assert.match(accountAccess, />\s*Brawler Name\s*</);\n  assert.doesNotMatch(accountAccess, /Brawler name/);\n});\n''')

          replace_once(
              "package.json",
              "tests/supporting-pages.test.ts tests/guest-first-auth.test.ts",
              "tests/supporting-pages.test.ts tests/brawler-name.test.ts tests/guest-first-auth.test.ts",
          )

          Path(".github/workflows/apply-editable-brawler-name.yml").unlink()
          PY
      - name: Validate implementation
        run: |
          git diff --check
          npx eslint \
            app/api/auth/route.ts \
            lib/account-server.ts \
            components/application/AppProvider.jsx \
            components/application/AccountAccessModal.tsx \
            components/routes/SettingsScreen.tsx \
            tests/brawler-name.test.ts
      - name: Run account and profile regressions
        run: >-
          node --import tsx --test
          tests/brawler-name.test.ts
          tests/supporting-pages.test.ts
          tests/guest-first-auth.test.ts
          tests/persistence-boundaries.test.ts
          tests/account-sync.integration.test.ts
          tests/administration.test.ts
      - name: Build production application
        run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Brawler Name editable"
          git push origin HEAD:agent/editable-brawler-name
