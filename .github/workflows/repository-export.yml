name: Repository Export

on:
  push:
    branches:
      - feature/complete-br-aa-runtime

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create source archive
        run: |
          git archive --format=zip --output=repository-source.zip HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: repository-source
          path: repository-source.zip
          if-no-files-found: error
          retention-days: 1

# Temporary workflow used only while completing BR/AA runtime automation.
