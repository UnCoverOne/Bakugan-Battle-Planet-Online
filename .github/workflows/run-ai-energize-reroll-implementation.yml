name: Run AI Energize reroll implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm run install:ci
      - name: Apply implementation patch
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/implement-ai-energize-reroll-value.yml').read_text()
          start = source.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = source.index("\n          PY", start)
          lines = source[start:end].splitlines()
          Path('/tmp/ai-reroll-patch.py').write_text('\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          ) + '\n')
          PY
          python /tmp/ai-reroll-patch.py
      - name: Run focused AI Energize regressions
        run: node --import tsx --test tests/ai-energize-planner.test.ts tests/ai-roll-forecast.test.ts
      - name: Build production application and validate artifact
        run: npm run build
      - name: Commit implementation
        run: |
          rm .github/workflows/implement-ai-energize-reroll-value.yml
          rm .github/workflows/run-ai-energize-reroll-implementation.yml
          rm .github/ai-reroll-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/opponentAiBase.ts tests/ai-energize-planner.test.ts .github/workflows .github/ai-reroll-trigger.txt
          git commit -m "Fix AI Energize likelihood and Reroll valuation"
          git push origin HEAD:${{ github.head_ref }}
