name: Account Identity Release Validation

on:
  push:
    branches:
      - feature/account-identity-release

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run account and website regression tests
        run: node --import tsx --test tests/guest-first-auth.test.ts tests/website-overhaul.test.ts tests/brawler-name.test.ts tests/persistence-boundaries.test.ts
      - name: Build
        run: npm run build
