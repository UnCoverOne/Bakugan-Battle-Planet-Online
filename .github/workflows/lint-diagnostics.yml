name: Temporary Lint Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Capture ESLint JSON
        run: npm run lint -- --format json > lint-results.json 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint-results.json
          retention-days: 1
