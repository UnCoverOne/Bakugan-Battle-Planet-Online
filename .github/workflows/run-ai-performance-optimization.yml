name: Run AI performance optimization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-ai-forecast-performance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply exact AI optimizations
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/optimize-ai-performance.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(index for index in range(start, len(source)) if source[index].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          brittle = 'replace_once(gameplay, old_timer, new_timer)'
          robust = (
              'text = read(gameplay)\n'
              'effect_start = text.find("    const drawDelay = waitingForDrawWindow")\n'
              'block_start = text.find("    const timeout = window.setTimeout(() => {", effect_start)\n'
              'block_end = text.find("    return () => window.clearTimeout(timeout);", block_start)\n'
              'if effect_start < 0 or block_start < 0 or block_end < 0:\n'
              '    raise SystemExit("Could not locate the training-bot timer block")\n'
              'write(gameplay, text[:block_start] + new_timer + text[block_end:])'
          )
          if brittle not in script:
              raise SystemExit('Could not locate the timer replacement in the generated script')
          script = script.replace(brittle, robust)
          Path('/tmp/apply-ai-performance.py').write_text(script)
          subprocess.run(['python', '/tmp/apply-ai-performance.py'], check=True)
          Path('.github/workflows/run-ai-performance-optimization.yml').unlink()
          PY
      - name: Validate source
        run: |
          git diff --check
          npx eslint lib/opponentAiBase.ts lib/opponentAi.ts components/game-screen-v2/GameplayClient.tsx components/game-screen-v2/opponentAi.worker.ts tests/opponent-ai-tactics.test.ts
      - name: Run focused AI regressions
        run: |
          node --import tsx --test tests/opponent-ai-tactics.test.ts tests/ai-roll-forecast.test.ts tests/ai-energize-planner.test.ts tests/wave-slash-ai.test.ts tests/game-engine.test.ts
      - name: Build production bundle
        run: |
          npm run build
          npm run bundle:budget
      - name: Commit optimized implementation
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize opponent AI forecasting without changing tactics"
          git push origin HEAD:agent/optimize-ai-forecast-performance
