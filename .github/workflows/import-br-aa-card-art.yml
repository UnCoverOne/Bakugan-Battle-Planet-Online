name: Finalize Self-Hosted Card Art

on:
  push:
    branches:
      - fix/self-host-br-aa-card-art

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/self-host-br-aa-card-art
      - name: Remove external image permissions and regression expectation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          worker = Path("worker/index.ts")
          text = worker.read_text()
          old = '    "img-src \'self\' data: blob: https://bakugan.wiki https://*.bakugan.wiki",'
          new = '    "img-src \'self\' data: blob:",'
          if old not in text:
              raise SystemExit("Expected external CSP source was not found")
          worker.write_text(text.replace(old, new))

          test = Path("tests/rendered-html.test.mjs")
          text = test.read_text()
          old = '  assert.match(contentSecurityPolicy, /img-src[^;]*https:\\/\\/bakugan\\.wiki/);'
          new = '  assert.match(contentSecurityPolicy, /img-src \'self\' data: blob:/);\n  assert.doesNotMatch(contentSecurityPolicy, /https?:\\/\\//);'
          if old not in text:
              raise SystemExit("Expected external CSP test was not found")
          test.write_text(text.replace(old, new))
          PY
      - name: Commit final source changes
        run: |
          set -euo pipefail
          git rm .github/workflows/import-br-aa-card-art.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.ts tests/rendered-html.test.mjs
          git commit -m "fix: enforce same-origin card artwork"
          git push origin HEAD:fix/self-host-br-aa-card-art
