name: Rules Engine Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/rules/**"
      - "lib/engine/**"
      - "lib/game.ts"
      - "lib/cardPayment.ts"
      - "lib/manualDamage.ts"
      - "lib/energy.ts"
      - "lib/evo.ts"
      - "tests/rules-engine-modernization.test.ts"
      - "tests/game-engine.test.ts"
      - "package.json"
      - ".github/workflows/rules-engine.yml"
  push:
    branches:
      - main
    paths:
      - "lib/rules/**"
      - "lib/engine/**"
      - "lib/game.ts"
      - "lib/cardPayment.ts"
      - "lib/manualDamage.ts"
      - "lib/energy.ts"
      - "lib/evo.ts"
      - "tests/rules-engine-modernization.test.ts"
      - "tests/game-engine.test.ts"
      - "package.json"
      - ".github/workflows/rules-engine.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Update catalogue regression expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          game = Path("tests/game-engine.test.ts")
          text = game.read_text()
          text = text.replace(
              'assert.equal(CARDS.length, 374); assert.equal(BAKUGAN.length, 93); assert.equal(CORES.length, 52);',
              'assert.equal(CARDS.length, 843); assert.equal(BAKUGAN.length, 236); assert.equal(CORES.length, 52);',
          )
          text = text.replace(
              '{ Action:137, Flip:49, Hero:29, Evo:66, Character:93 }',
              '{ Action:246, Flip:82, Hero:47, Evo:232, Character:236 }',
          )
          text = text.replace(
              'assert.equal(CARDS.filter((card) => card.type === "Flip").length, 49); assert.equal(CARDS.filter((card) => card.type === "Hero").length, 29);',
              'assert.equal(CARDS.filter((card) => card.type === "Flip").length, 82); assert.equal(CARDS.filter((card) => card.type === "Hero").length, 47);',
          )
          game.write_text(text)

          rules = Path("tests/rules-engine-modernization.test.ts")
          text = rules.read_text()
          text = text.replace('assert.equal(definitions.length, 374);', 'assert.equal(definitions.length, 843);')
          text = text.replace('assert.equal(new Set(definitions.map((definition) => definition.cardId)).size, 374);', 'assert.equal(new Set(definitions.map((definition) => definition.cardId)).size, 843);')
          text = text.replace('assert.equal(CARDS.length, 374);', 'assert.equal(CARDS.length, 843);')
          rules.write_text(text)
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/game-engine.test.ts tests/rules-engine-modernization.test.ts
            git commit -m "test: update catalogue regression totals"
            git push origin HEAD:"${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Typed rules tests
        id: rules
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee rules.log
      - name: Engine regression tests
        id: engine
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:engine 2>&1 | tee engine.log
      - name: Complete repository regression suite
        id: full_suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee full-suite.log
      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-engine-diagnostics
          path: |
            build.log
            rules.log
            engine.log
            full-suite.log
            lint.log
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce results
        if: always()
        shell: bash
        run: |
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.rules.outcome }}" = "success"
          test "${{ steps.engine.outcome }}" = "success"
          test "${{ steps.full_suite.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
