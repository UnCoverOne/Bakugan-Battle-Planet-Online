name: Trigger one-shot card fixes from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Apply embedded one-shot patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/one-shot-card-fixes.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script.splitlines())
          script = script.replace(
              "replace_once('lib/rules/catalogue-structure.ts', old_copy_choice, new_copy_choice)",
              "text = read('lib/rules/catalogue-structure.ts')\nstart_choice = text.index('  if (!negateMatch && /copy ')\nend_choice = text.index('\\n  }\\n', start_choice) + len('\\n  }\\n')\nwrite('lib/rules/catalogue-structure.ts', text[:start_choice] + new_copy_choice + text[end_choice:])",
          )
          script = script.replace(
              "text = read('lib/rules/choices.ts')\nif 'case \"discarded-card-this-turn\"' not in text:\n    if insert_after not in text:\n        raise SystemExit('lib/rules/choices.ts: batch-object insertion anchor changed')\n    text = text.replace(insert_after, insert_after + nova_case, 1)\n    write('lib/rules/choices.ts', text)",
              "text = read('lib/rules/choices.ts')\nif 'case \"discarded-card-this-turn\"' not in text:\n    batch_start = text.index('    case \"batch-object\": {')\n    next_case = text.index('    case \"chosen-bakugan\":', batch_start)\n    text = text[:next_case] + nova_case + text[next_case:]\n    write('lib/rules/choices.ts', text)",
          )
          script = script.replace(
              "replace_once('lib/game.ts', old_stop, new_stop)",
              "text = read('lib/game.ts')\nstop_start = text.index('  const faction = state.damageFaction ?? attackingBakugan?.faction;')\nstop_end = text.index('\\n};', stop_start)\nwrite('lib/game.ts', text[:stop_start] + new_stop + text[stop_end:])",
          )
          exec(compile(script, 'embedded-card-fix.py', 'exec'))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run targeted regression tests
        run: node --import tsx --test tests/reported-gameplay-regressions-2026-08.test.ts
      - name: Typecheck/build
        run: npm run build
      - name: Commit fixes to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/game.ts lib/rules/model.ts lib/rules/catalogue-primitives.ts lib/rules/catalogue-structure.ts lib/rules/choices.ts lib/rules/modifiers.ts tests/reported-gameplay-regressions-2026-08.test.ts
          git commit -m "Fix Nova Burst, Hyper Pyravian, and faction Stops"
          git push origin HEAD:main
