name: Trigger one-shot card fixes from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Apply embedded one-shot patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/one-shot-card-fixes.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script.splitlines())
          exec(compile(script, 'embedded-card-fix.py', 'exec'))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run targeted regression tests
        run: node --import tsx --test tests/reported-gameplay-regressions-2026-08.test.ts
      - name: Typecheck/build
        run: npm run build
      - name: Commit fixes to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/game.ts lib/rules/model.ts lib/rules/catalogue-primitives.ts lib/rules/catalogue-structure.ts lib/rules/choices.ts lib/rules/modifiers.ts tests/reported-gameplay-regressions-2026-08.test.ts
          git commit -m "Fix Nova Burst, Hyper Pyravian, and faction Stops"
          git push origin HEAD:main
