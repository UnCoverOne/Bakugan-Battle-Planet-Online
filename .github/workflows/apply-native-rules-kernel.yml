name: Apply Native Rules Kernel

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply-native-rules-kernel.mjs"
      - ".github/workflows/apply-native-rules-kernel.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Preserve target-code placeholders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-native-rules-kernel.mjs')
          source = path.read_text()
          anchor = 'let source = await readFile(path, "utf8");\n'
          placeholders = '''let source = await readFile(path, "utf8");
          const card = { id: "${card.id}" };
          const pending = { id: "${pending.id}" };
          const action = { modifier: { id: "${action.modifier.id}" }, kind: "${action.kind}" };
          const instructionIndex = "${instructionIndex}";
          '''
          if anchor not in source:
              raise SystemExit('placeholder anchor is missing')
          path.write_text(source.replace(anchor, placeholders, 1))
          PY
      - name: Apply kernel migration
        shell: bash
        run: |
          set -o pipefail
          node scripts/apply-native-rules-kernel.mjs 2>&1 | tee migration.log
      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rules-kernel-migration
          path: migration.log
          retention-days: 3
      - name: Remove one-time migration files
        run: rm scripts/apply-native-rules-kernel.mjs .github/workflows/apply-native-rules-kernel.yml
      - run: npm ci
      - name: Validate migrated kernel
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm run build
            npm run test:rules
            npm run test:engine
            npm run lint
          } 2>&1 | tee validation.log
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rules-kernel-validation
          path: validation.log
          retention-days: 3
      - name: Enforce validation
        run: test "${{ steps.validation.outcome }}" = "success"
      - name: Commit native kernel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(game): remove legacy rules compatibility hooks'
          git push origin HEAD:${{ github.head_ref }}
