name: Apply Native Rules Kernel

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply-native-rules-kernel.mjs"
      - ".github/workflows/apply-native-rules-kernel.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Prepare migration transform
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-native-rules-kernel.mjs')
          source = path.read_text()
          anchor = 'let source = await readFile(path, "utf8");\n'
          placeholders = '''let source = await readFile(path, "utf8");
          const card = { id: "${card.id}" };
          const pending = { id: "${pending.id}" };
          const action = { modifier: { id: "${action.modifier.id}" }, kind: "${action.kind}" };
          const instructionIndex = "${instructionIndex}";
          '''
          duplicate = '  "const stageSimultaneousTriggers =",\n  "remove legacy direct trigger queue",'
          replacement = '  "",\n  "remove legacy direct trigger queue",'
          if anchor not in source:
              raise SystemExit('placeholder anchor is missing')
          if duplicate not in source:
              raise SystemExit('trigger staging migration anchor is missing')
          source = source.replace(anchor, placeholders, 1).replace(duplicate, replacement, 1)
          path.write_text(source)
          PY
      - name: Apply kernel migration
        shell: bash
        run: |
          set -o pipefail
          node scripts/apply-native-rules-kernel.mjs 2>&1 | tee migration.log
      - name: Finalize typed catalogue and kernel semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          catalogue = Path('lib/rules/catalogue.ts')
          source = catalogue.read_text()
          replacements = [
              (
                  '[/when (?:your )?opponent plays/i, "CARD_PLAYED", "opponent"],',
                  '[/when (?:your |an )?opponent plays/i, "CARD_PLAYED", "opponent"],',
                  'opponent trigger',
              ),
              (
                  '    let effects = parseAtomicEffects(card, clause);\n    if (REPLACEMENT_CARD_NUMBERS.has(card.number)',
                  '    let effects = parseAtomicEffects(card, clause);\n    if (card.number === 152) effects = effects.filter((effect) => effect.kind !== "discard");\n    if (!effects.length) effects = [{ kind: "sequence", effects: [] }];\n    if (REPLACEMENT_CARD_NUMBERS.has(card.number)',
                  'cost-only instruction',
              ),
              (
                  '  const timing = /when you play this|\\bmay\\b/i.test(text) ? "resolve" : defaultTiming;',
                  '  const timing = /when you play this|\\bmay\\b|\\bSacrifice\\b/i.test(text) ? "resolve" : defaultTiming;',
                  'Sacrifice choice timing',
              ),
          ]
          for old, new, label in replacements:
              if old not in source:
                  raise SystemExit(f'{label} anchor is missing')
              source = source.replace(old, new, 1)
          catalogue.write_text(source)

          game = Path('lib/game.ts')
          game_source = game.read_text()
          start = game_source.find('export const cardChoiceSpec =')
          end = game_source.find('\n\nconst stageSimultaneousTriggers', start)
          if start < 0 or end < 0:
              raise SystemExit('typed cardChoiceSpec range is missing')
          direct_choice_spec = '''export const cardChoiceSpec = (_state: MatchState, _playerId: string, card: GameCard) => {
            const mapping: Partial<Record<keyof CardChoices, string>> = {
              targetBakuganId: "targetBakugan",
              targetPlayerId: "targetPlayer",
              targetHeroId: "targetHero",
              targetEvoId: "targetEvo",
              targetEnergyId: "targetEnergy",
              targetEnergyIds: "targetEnergy",
              coreCell: "core",
              discardCardIds: "discard",
              handCardIds: "multiHand",
              orderedCardIds: "deckOrder",
              deckCardId: "deckCard",
              xValue: "xValue",
              mode: "mode",
              confirmed: "mode",
            };
            const definition = ruleDefinitionForCard(card);
            return [...new Set(definition.play.choices
              .filter((choice) => choice.timing === "announce" || choice.timing === "pay")
              .map((choice) => mapping[choice.id])
              .filter((value): value is string => Boolean(value)))];
          };'''
          game.write_text(game_source[:start] + direct_choice_spec + game_source[end:])

          tests = Path('tests/rules-engine-modernization.test.ts')
          test_source = tests.read_text()
          old = '  assert.ok(definitions.every((definition) => definition.sourceText.length > 0 || definition.cardType === "Character"));'
          new = '  assert.ok(definitions.every((definition) => definition.implementationStatus === "complete"));'
          if old not in test_source:
              raise SystemExit('catalogue completeness assertion anchor is missing')
          tests.write_text(test_source.replace(old, new, 1))
          PY
      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rules-kernel-migration
          path: migration.log
          retention-days: 3
      - name: Remove one-time migration files
        run: rm scripts/apply-native-rules-kernel.mjs .github/workflows/apply-native-rules-kernel.yml
      - run: npm ci
      - name: Validate migrated kernel
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee build.log
          npm run test:rules 2>&1 | tee rules.log
          npm run test:engine 2>&1 | tee engine.log
          npm run lint 2>&1 | tee lint.log
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rules-kernel-validation
          path: |
            build.log
            rules.log
            engine.log
            lint.log
          if-no-files-found: warn
          retention-days: 3
      - name: Commit native kernel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(game): remove legacy rules compatibility hooks'
          git push origin HEAD:${{ github.head_ref }}
