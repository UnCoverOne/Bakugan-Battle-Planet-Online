name: Apply target selection corrections

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply corrections
        shell: bash
        run: |
          echo "21a3d822aca964f14afc5951b02ae2242b9a5ecbad26a8aa7c7b51e6903e1a59  .github/target-corrections.b64" | sha256sum -c -
          base64 -d .github/target-corrections.b64 | gzip -d > /tmp/target-corrections.py
          python3 -m py_compile /tmp/target-corrections.py
          python3 /tmp/target-corrections.py
      - name: Install dependencies
        run: npm run install:ci
      - name: Run focused regressions
        run: >-
          node --import tsx --test
          tests/underdog-target-selection.test.ts
          tests/pact-cubbo-regressions.test.ts
          tests/card-preview-state.test.ts
          tests/card-preview-interactions.test.ts
          tests/administration.test.ts
      - name: Build application
        run: npm run build
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "UnCoverOne"
          git config user.email "291861529+UnCoverOne@users.noreply.github.com"
          git rm .github/target-corrections.b64
          git rm .github/workflows/apply-target-corrections.yml
          git add lib components tests
          git commit -m "Complete target locking and restriction enforcement"
          git push origin HEAD:${{ github.head_ref }}
